<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MA.TEMPA - CADENCE PROFILE</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#dbe7ee">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: linear-gradient(180deg, #d3e4ed 0%, #e9edf1 100%);
      color: #121212;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 1.2rem 1.2rem 3rem 1.2rem;
      user-select: none;
      -webkit-user-select: none;
      letter-spacing: -0.3px;
    }

    .app-screen {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
    }

    .header-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.2rem;
      padding: 0 4px;
    }

    .nav-circle-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      color: #2c2c2e;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      transition: transform 0.15s ease;
    }
    .nav-circle-btn:active { transform: scale(0.92); }

    .nav-title {
      text-align: center;
      line-height: 1.15;
    }
    .nav-title h2 {
      font-size: 1.15rem;
      font-weight: 800;
      color: #111111;
      letter-spacing: -0.5px;
    }
    .nav-title span {
      font-size: 1.15rem;
      font-weight: 500;
      font-style: italic;
      color: #111111;
      font-family: serif;
      margin-left: 2px;
    }

    .profile-card {
      background: #ffffff;
      border-radius: 34px;
      padding: 1.5rem 1.4rem;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.08);
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
    }

    .card-title-box {
      border-bottom: 1px solid rgba(0, 0, 0, 0.06);
      padding-bottom: 0.8rem;
    }
    .card-title-box h3 {
      font-size: 1.1rem;
      font-weight: 800;
      color: #111111;
    }
    .card-title-box p {
      font-size: 0.72rem;
      color: #8e8e93;
      margin-top: 3px;
      line-height: 1.3;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-label {
      font-size: 0.75rem;
      font-weight: 800;
      color: #3a3a3c;
    }

    /* 성별 선택 칩 */
    .gender-chips-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    .gender-chip-btn {
      height: 40px;
      border-radius: 12px;
      border: 1px solid rgba(0, 0, 0, 0.06);
      background: #f4f6f8;
      font-size: 0.82rem;
      font-weight: 800;
      color: #555555;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }
    .gender-chip-btn.selected {
      background: #111111;
      color: #ffffff;
      border-color: #111111;
    }

    /* 2열 인풋 배치 */
    .row-two-inputs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-wrapper input {
      width: 100%;
      height: 44px;
      background: #f4f6f8;
      border: 1px solid rgba(0, 0, 0, 0.05);
      border-radius: 12px;
      padding: 0 34px 0 12px;
      font-size: 0.9rem;
      font-weight: 800;
      color: #111111;
      outline: none;
      font-variant-numeric: tabular-nums;
    }
    .input-wrapper input:focus {
      border-color: #111111;
      background: #ffffff;
    }
    .input-unit {
      position: absolute;
      right: 12px;
      font-size: 0.72rem;
      font-weight: 700;
      color: #8e8e93;
    }

    /* 페이스 2열 분/초 인풋 */
    .pace-inputs-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .pace-col {
      flex: 1;
      display: flex;
      align-items: center;
      position: relative;
    }
    .pace-col input {
      width: 100%;
      height: 44px;
      background: #f4f6f8;
      border: 1px solid rgba(0, 0, 0, 0.05);
      border-radius: 12px;
      padding: 0 28px 0 12px;
      font-size: 0.9rem;
      font-weight: 800;
      color: #111111;
      outline: none;
      text-align: center;
    }
    .pace-col input:focus {
      border-color: #111111;
      background: #ffffff;
    }

    /* 거리 프리셋 칩 */
    .dist-chips-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }
    .dist-btn {
      height: 38px;
      border-radius: 11px;
      border: 1px solid rgba(0, 0, 0, 0.06);
      background: #f4f6f8;
      font-size: 0.75rem;
      font-weight: 800;
      color: #555555;
      cursor: pointer;
    }
    .dist-btn.selected {
      background: #111111;
      color: #ffffff;
    }

    /* 분석 추천 결과 카드 */
    .recom-hero-box {
      background: #111315;
      color: #ffffff;
      border-radius: 22px;
      padding: 1rem 1.2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 0.3rem;
    }
    .recom-info-left span {
      display: block;
      font-size: 0.68rem;
      font-weight: 700;
      color: #8e8e93;
    }
    .recom-info-left b {
      font-size: 0.92rem;
      color: #34c759;
      letter-spacing: -0.3px;
    }
    .recom-bpm-val {
      font-size: 2.3rem;
      font-weight: 900;
      letter-spacing: -1px;
      line-height: 1;
      color: #ffffff;
    }

    /* 저장 버튼 */
    .save-profile-btn {
      margin-top: 1.2rem;
      width: 100%;
      height: 54px;
      background: #111111;
      color: #ffffff;
      border: none;
      border-radius: 27px;
      font-size: 0.95rem;
      font-weight: 900;
      letter-spacing: 0.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.18);
      transition: transform 0.12s ease;
    }
    .save-profile-btn:active { transform: scale(0.96); }
  </style>
</head>
<body>

  <div class="app-screen">

    <!-- 상단 내비 바 -->
    <div class="header-nav">
      <button class="nav-circle-btn" onclick="window.location.href='main.html'">←</button>
      <div class="nav-title">
        <h2>Cadence<span>Profile</span></h2>
      </div>
      <div style="width: 38px;"></div>
    </div>

    <!-- 정보 입력 카드 -->
    <div class="profile-card">
      <div class="card-title-box">
        <h3>맞춤형 러너 정보</h3>
        <p>신체 조건과 목표 페이스를 기반으로 부상 방지 및 에너지 효율이 가장 높은 최적 케이던스를 산출합니다.</p>
      </div>

      <!-- 성별 -->
      <div class="form-group">
        <label class="form-label">성별 (Gender)</label>
        <div class="gender-chips-row">
          <button class="gender-chip-btn selected" id="gender-male" onclick="setGender('male')">남성</button>
          <button class="gender-chip-btn" id="gender-female" onclick="setGender('female')">여성</button>
        </div>
      </div>

      <!-- 키 & 몸무게 -->
      <div class="row-two-inputs">
        <div class="form-group">
          <label class="form-label">키 (Height)</label>
          <div class="input-wrapper">
            <input type="number" id="inputHeight" value="175" min="120" max="230" oninput="calculateOptimalCadence()">
            <span class="input-unit">cm</span>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">몸무게 (Weight)</label>
          <div class="input-wrapper">
            <input type="number" id="inputWeight" value="68" min="30" max="160" oninput="calculateOptimalCadence()">
            <span class="input-unit">kg</span>
          </div>
        </div>
      </div>

      <!-- 평균 페이스 -->
      <div class="form-group">
        <label class="form-label">평균 페이스 (Pace)</label>
        <div class="pace-inputs-wrap">
          <div class="pace-col">
            <input type="number" id="paceMin" value="5" min="2" max="15" oninput="calculateOptimalCadence()">
            <span class="input-unit">분</span>
          </div>
          <span style="font-weight: 800; color: #8e8e93;">:</span>
          <div class="pace-col">
            <input type="number" id="paceSec" value="30" min="0" max="59" step="5" oninput="calculateOptimalCadence()">
            <span class="input-unit">초</span>
          </div>
        </div>
      </div>

      <!-- 주로 뛰는 거리 -->
      <div class="form-group">
        <label class="form-label">주 러닝 거리 (Distance)</label>
        <div class="dist-chips-grid">
          <button class="dist-btn selected" id="dist-5" onclick="setDistance(5)">5 km</button>
          <button class="dist-btn" id="dist-10" onclick="setDistance(10)">10 km</button>
          <button class="dist-btn" id="dist-21" onclick="setDistance(21)">하프</button>
          <button class="dist-btn" id="dist-42" onclick="setDistance(42)">풀코스</button>
        </div>
      </div>

      <!-- 추천 케이던스 박스 -->
      <div class="recom-hero-box">
        <div class="recom-info-left">
          <span>RECOMMENDED CADENCE</span>
          <b id="recomZoneComment">지구력 & 무릎 보호 최적</b>
        </div>
        <div class="recom-bpm-val" id="recomBpmNum">178 <span style="font-size:0.9rem; font-weight:700;">BPM</span></div>
      </div>
    </div>

    <!-- 저장 및 메인 반영 버튼 -->
    <button class="save-profile-btn" onclick="saveAndApplyCadence()">설정 저장 및 케이던스 적용 ▶</button>

  </div>

  <script>
    let currentGender = 'male';
    let currentDistance = 5;
    let recommendedCadence = 178;

    function triggerHaptic(duration = 20) {
      if (navigator.vibrate) navigator.vibrate(duration);
    }

    function setGender(gender) {
      triggerHaptic(15);
      currentGender = gender;
      document.getElementById('gender-male').classList.toggle('selected', gender === 'male');
      document.getElementById('gender-female').classList.toggle('selected', gender === 'female');
      calculateOptimalCadence();
    }

    function setDistance(dist) {
      triggerHaptic(15);
      currentDistance = dist;
      [5, 10, 21, 42].forEach(d => {
        document.getElementById(`dist-${d}`).classList.toggle('selected', d === dist);
      });
      calculateOptimalCadence();
    }

    // 신체 조건 및 페이스 역학 기반 최적 케이던스 계산 공식
    function calculateOptimalCadence() {
      const height = parseFloat(document.getElementById('inputHeight').value) || 175;
      const weight = parseFloat(document.getElementById('inputWeight').value) || 68;
      const pMin = parseInt(document.getElementById('paceMin').value) || 5;
      const pSec = parseInt(document.getElementById('paceSec').value) || 30;

      const totalPaceSeconds = (pMin * 60) + pSec;
      const speedKmh = 3600 / totalPaceSeconds; // km/h

      // 1. 키에 따른 기본 보폭 비율 계수
      let strideFactor = 0.65;
      if (height > 185) strideFactor = 0.62;
      else if (height < 165) strideFactor = 0.68;

      // 2. 속도에 따른 이상적 보폭(m) 추정
      const estimatedStride = (height / 100) * (speedKmh / 10) * strideFactor;

      // 3. 속도와 보폭을 기반으로 한 분당 발걸음(BPM) 산출
      let calculatedBpm = Math.round((speedKmh * 1000 / 60) / estimatedStride);

      // 4. 과체중/부상 방지 보정 (몸무게가 나갈수록 짧은 피치 권장)
      const bmi = weight / Math.pow(height / 100, 2);
      if (bmi > 24) calculatedBpm += 2;

      // 5. 거리 보정 (장거리일수록 발목 피로 최소화)
      if (currentDistance >= 21) calculatedBpm += 2;

      // 6. 케이던스 안전 가드레일 (160 ~ 195 BPM)
      recommendedCadence = Math.min(Math.max(calculatedBpm, 162), 195);

      document.getElementById('recomBpmNum').innerHTML = `${recommendedCadence} <span style="font-size:0.9rem; font-weight:700;">BPM</span>`;

      // 가이드 코멘트
      const commentEl = document.getElementById('recomZoneComment');
      if (recommendedCadence >= 184) {
        commentEl.textContent = '부상 방지 & 고속 피치 러닝';
      } else if (recommendedCadence >= 174) {
        commentEl.textContent = '지구력 & 무릎 관절 보호 최적';
      } else {
        commentEl.textContent = '안정적인 조깅 & 에너지 절약';
      }
    }

    // 프로필 정보 로컬 저장 및 main.html 반영
    function saveAndApplyCadence() {
      triggerHaptic(30);

      const profileData = {
        gender: currentGender,
        height: document.getElementById('inputHeight').value,
        weight: document.getElementById('inputWeight').value,
        paceMin: document.getElementById('paceMin').value,
        paceSec: document.getElementById('paceSec').value,
        distance: currentDistance,
        optimalCadence: recommendedCadence
      };

      try {
        localStorage.setItem('matempa_user_profile', JSON.stringify(profileData));

        // 메인 설정 화면에서 사용 중인 1번 루틴의 기본 케이던스에도 자동 반영
        const activeSlot = localStorage.getItem('matempa_active_slot') || 0;
        const savedRoutine = localStorage.getItem(`matempa_routine_slot_${activeSlot}`);
        if (savedRoutine) {
          let routine = JSON.parse(savedRoutine);
          if (routine.length > 0) {
            routine[0].bpm = recommendedCadence;
            localStorage.setItem(`matempa_routine_slot_${activeSlot}`, JSON.stringify(routine));
          }
        }
      } catch (e) {}

      window.location.href = 'main.html';
    }

    // 기존 저장된 정보 불러오기
    window.onload = () => {
      try {
        const saved = localStorage.getItem('matempa_user_profile');
        if (saved) {
          const data = JSON.parse(saved);
          if (data.gender) setGender(data.gender);
          if (data.height) document.getElementById('inputHeight').value = data.height;
          if (data.weight) document.getElementById('inputWeight').value = data.weight;
          if (data.paceMin) document.getElementById('paceMin').value = data.paceMin;
          if (data.paceSec) document.getElementById('paceSec').value = data.paceSec;
          if (data.distance) setDistance(data.distance);
        }
      } catch (e) {}

      calculateOptimalCadence();
    };
  </script>
</body>
</html>
