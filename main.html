<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MA.TEMPA - SETTINGS</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#dbe7ee">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: linear-gradient(180deg, #d3e4ed 0%, #e9edf1 100%);
      color: #121212;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 1.2rem 1.2rem 3rem 1.2rem;
      user-select: none;
      -webkit-user-select: none;
      letter-spacing: -0.3px;
    }

    .app-screen {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
    }

    /* 상단 내비 바 */
    .header-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.2rem;
      padding: 0 4px;
    }

    .nav-circle-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      color: #2c2c2e;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      transition: transform 0.15s ease;
    }
    .nav-circle-btn:active { transform: scale(0.92); }

    .nav-title {
      text-align: center;
      line-height: 1.15;
    }
    .nav-title h2 {
      font-size: 1.15rem;
      font-weight: 800;
      color: #111111;
      letter-spacing: -0.5px;
    }
    .nav-title span {
      font-size: 1.15rem;
      font-weight: 500;
      font-style: italic;
      color: #111111;
      font-family: serif;
      margin-left: 2px;
    }

    /* 카드 스택 컨테이너 */
    .card-stack {
      position: relative;
      width: 100%;
      border-radius: 36px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.12);
    }

    /* 공통 카드 스타일 */
    .stack-card {
      width: 100%;
      border-radius: 34px;
      transition: all 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
      overflow: hidden;
      cursor: pointer;
      position: relative;
    }

    .card-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.15rem 1.4rem;
    }

    .card-header-left {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .card-header-title {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* 헤더 인라인 복사 버튼: 펼쳐졌을 때만 표시 */
    .header-copy-btn {
      display: none;
      background: #f0f2f5;
      color: #111111;
      border: 1px solid rgba(0, 0, 0, 0.08);
      padding: 3px 9px;
      border-radius: 8px;
      font-size: 0.68rem;
      font-weight: 700;
      cursor: pointer;
      align-items: center;
      gap: 3px;
      transition: all 0.15s ease;
    }
    .stack-card.expanded .header-copy-btn {
      display: inline-flex;
    }
    .header-copy-btn:active {
      transform: scale(0.92);
      background: #e2e4e8;
    }

    .card-summary-tag {
      font-size: 0.74rem;
      font-weight: 700;
      opacity: 0.82;
      letter-spacing: 0.2px;
      transition: opacity 0.2s ease;
    }
    .stack-card.expanded .card-summary-tag {
      display: none;
    }

    /* 4단 전용 요약 박스 그룹 */
    .summary-badge-group {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .stack-card.expanded .summary-badge-group {
      display: none;
    }

    .summary-box {
      background: #f1f3f5;
      color: #444446;
      border: 1px solid rgba(0, 0, 0, 0.05);
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: -0.2px;
      font-variant-numeric: tabular-nums;
    }

    .card-arrow-icon {
      font-size: 0.95rem;
      transition: transform 0.3s ease;
    }
    .stack-card.expanded .card-arrow-icon {
      transform: rotate(90deg);
    }

    .card-expand-body {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transition: max-height 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.3s ease, padding 0.3s ease;
      padding: 0 1.4rem;
    }
    .stack-card.expanded .card-expand-body {
      max-height: 540px;
      opacity: 1;
      padding: 0 1.4rem 1.6rem 1.4rem;
    }

    /* 1단: 검정 카드 (Cadence & Time) */
    .card-black {
      background: #111315;
      color: #ffffff;
      z-index: 10;
    }
    .card-black .card-summary-tag {
      color: #34c759;
    }

    .black-subhead-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
    }

    .black-reset-pill {
      background: rgba(255, 255, 255, 0.14);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 0.72rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: transform 0.12s ease;
    }
    .black-reset-pill:active { transform: scale(0.92); }

    .black-bpm-hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.8rem 0;
      cursor: ns-resize;
      touch-action: none;
    }
    .bpm-display-num {
      font-size: 6.8rem;
      font-weight: 900;
      line-height: 0.88;
      color: #ffffff;
      font-variant-numeric: tabular-nums;
      letter-spacing: -4px;
    }
    .bpm-label-sub {
      font-size: 0.72rem;
      color: #8e8e93;
      font-weight: 800;
      letter-spacing: 1.6px;
      margin-top: 8px;
    }

    .black-time-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 1.2rem;
    }
    .time-chip-quick {
      background: rgba(255, 255, 255, 0.08);
      color: #d1d1d6;
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 7px 14px;
      border-radius: 12px;
      font-size: 0.74rem;
      font-weight: 700;
      cursor: pointer;
    }
    .time-chip-quick.selected {
      background: #ffffff;
      color: #111111;
      font-weight: 800;
    }
    .black-sec-input {
      width: 65px;
      height: 33px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      color: #ffffff;
      font-size: 0.88rem;
      font-weight: 800;
      text-align: center;
      outline: none;
    }

    .black-action-capsule {
      width: 100%;
      background: rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px;
      gap: 8px;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.3);
    }
    .capsule-btn {
      flex: 1;
      height: 42px;
      border-radius: 19px;
      border: none;
      font-size: 0.8rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.12s ease;
    }
    .capsule-btn:active { transform: scale(0.94); }
    .btn-capsule-test { background: rgba(255, 255, 255, 0.18); color: #ffffff; }
    .btn-capsule-test.playing { background: #34c759; color: #ffffff; }
    .btn-capsule-add { background: #ffffff; color: #111111; box-shadow: 0 3px 8px rgba(0,0,0,0.15); }
    .btn-capsule-mod { background: rgba(255, 255, 255, 0.22); color: #ffffff; }

    /* 2단: 주황 카드 (Sound & Tuning) */
    .card-orange {
      background: #e89553;
      color: #111111;
      margin-top: -20px;
      z-index: 9;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.08);
    }
    .card-orange .card-summary-tag {
      color: #2c1a0b;
    }

    .slider-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      font-weight: 800;
      margin-bottom: 12px;
    }
    .slider-item input[type="range"] {
      width: 170px;
      height: 5px;
      border-radius: 3px;
      accent-color: #111111;
      background: rgba(0, 0, 0, 0.14);
      outline: none;
    }

    .sound-chips-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 5px;
      margin-top: 10px;
    }
    .sound-btn {
      background: rgba(255, 255, 255, 0.4);
      color: #111111;
      border: 1px solid rgba(0, 0, 0, 0.06);
      padding: 8px 0;
      border-radius: 12px;
      font-size: 0.7rem;
      font-weight: 800;
      cursor: pointer;
      text-align: center;
    }
    .sound-btn.selected {
      background: #111111;
      color: #ffffff;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2);
    }

    /* 3단: 민트 카드 (Rhythm Meter) */
    .card-mint {
      background: #a5c8c5;
      color: #111111;
      margin-top: -20px;
      z-index: 8;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.06);
    }
    .card-mint .card-summary-tag {
      color: #1b2f2d;
      letter-spacing: -0.5px;
    }

    .meter-chips-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 5px;
    }
    .meter-btn {
      background: rgba(255, 255, 255, 0.4);
      color: #111111;
      border: 1px solid rgba(0, 0, 0, 0.06);
      padding: 9px 0;
      border-radius: 12px;
      font-size: 0.68rem;
      letter-spacing: -1.2px;
      font-weight: 800;
      cursor: pointer;
      text-align: center;
    }
    .meter-btn.selected {
      background: #111111;
      color: #ffffff;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2);
    }

    /* 4단: 화이트 카드 (Intervals & Presets) */
    .card-white {
      background: #ffffff;
      color: #111111;
      margin-top: -20px;
      z-index: 7;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.05);
    }

    .steps-list-wrap {
      max-height: 200px;
      overflow-y: auto;
      margin-bottom: 14px;
      padding-right: 2px;
      touch-action: pan-y;
    }
    .steps-list-wrap::-webkit-scrollbar { width: 3px; }
    .steps-list-wrap::-webkit-scrollbar-thumb { background: #e0e0e0; border-radius: 3px; }

    .step-card-item {
      background: #f7f8fa;
      border: 1px solid rgba(0, 0, 0, 0.04);
      padding: 10px 12px;
      border-radius: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      font-size: 0.75rem;
      cursor: pointer;
      position: relative;
      touch-action: pan-y;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }
    .step-card-item.selected {
      border: 1.5px solid #111111;
      background: #ffffff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .step-card-item.dragging-active {
      opacity: 0.88;
      transform: scale(1.02);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      background: #ffffff;
      border-color: #111111;
      z-index: 20;
    }
    .step-card-item.drag-over-target {
      border-top: 2.5px dashed #111111 !important;
    }

    .step-btn-group {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-left: 6px;
    }
    .step-icon-btn.delete {
      font-size: 1.25rem;
      color: #c7c7cc;
      cursor: pointer;
      padding: 2px 4px;
      transition: color 0.1s ease;
    }
    .step-icon-btn.delete:hover { color: #ff3b30; }

    .preset-scroll-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 4px 0;
      scrollbar-width: none;
    }
    .preset-scroll-row::-webkit-scrollbar { display: none; }
    .preset-chip-dot {
      flex: 0 0 38px;
      height: 38px;
      border-radius: 50%;
      background: #f2f3f5;
      color: #555555;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 800;
      cursor: pointer;
    }
    .preset-chip-dot.active {
      background: #111111;
      color: #ffffff;
    }

    /* 하단 START RUN 버튼 */
    .start-run-bar {
      margin-top: 1.4rem;
      width: 100%;
      height: 54px;
      background: #111111;
      color: #ffffff;
      border: none;
      border-radius: 27px;
      font-size: 1rem;
      font-weight: 900;
      letter-spacing: 0.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.18);
      transition: transform 0.12s ease;
    }
    .start-run-bar:active { transform: scale(0.96); }
  </style>
</head>
<body>

  <div class="app-screen">

    <!-- 상단 내비 바 -->
    <div class="header-nav">
      <button class="nav-circle-btn" onclick="window.location.href='index.html'">←</button>
      <div class="nav-title">
        <h2>Make<span>your tempo</span></h2>
      </div>
      <button class="nav-circle-btn" onclick="triggerHaptic(15)">//</button>
    </div>

    <!-- 4단 스택 레이아웃 -->
    <div class="card-stack">

      <!-- 1단: 검정 영역 (Cadence & Time) -->
      <div class="stack-card card-black expanded" id="cardBlack" onclick="openCadenceManually()">
        <div class="card-header-bar">
          <div class="card-header-left">
            <div class="card-header-title">
              <span>Cadence</span>
            </div>
            <span class="card-summary-tag" id="summaryCadence">180 BPM · 60s</span>
          </div>
          <span class="card-arrow-icon">→</span>
        </div>

        <div class="card-expand-body" onclick="event.stopPropagation()">
          <div class="black-subhead-row">
            <span style="font-size:0.75rem; color:#8e8e93; font-weight:700;" id="activeSlotBadge">ROUTINE #1</span>
            <button class="black-reset-pill" id="resetBtn">
              <span>Reset</span>
              <span style="font-size:0.8rem;">↻</span>
            </button>
          </div>

          <div class="black-bpm-hero" id="bpmDialWrap">
            <div class="bpm-display-num" id="bpmDisplay">180</div>
            <div class="bpm-label-sub">TARGET SPM (ROLL ▲▼)</div>
          </div>

          <div class="black-time-row">
            <button class="time-chip-quick selected" id="t-60" onclick="setQuickTime(60)">60s</button>
            <button class="time-chip-quick" id="t-300" onclick="setQuickTime(300)">300s</button>
            <button class="time-chip-quick" id="t-600" onclick="setQuickTime(600)">600s</button>
            <input type="number" class="black-sec-input" id="durationSecInput" value="60" min="1" max="99999">
          </div>

          <!-- TEST / 추가 / 수정 -->
          <div class="black-action-capsule">
            <button class="capsule-btn btn-capsule-test" id="testToneBtn">TEST ♪</button>
            <button class="capsule-btn btn-capsule-add" id="addStepBtn">+ 추가</button>
            <button class="capsule-btn btn-capsule-mod" id="updateStepBtn">수정</button>
          </div>
        </div>
      </div>

      <!-- 2단: 주황색 카드 (Sound & Tuning) -->
      <div class="stack-card card-orange" id="cardOrange" onclick="toggleSubCard('cardOrange')">
        <div class="card-header-bar">
          <div class="card-header-left">
            <div class="card-header-title">
              <span>Sound & Tuning</span>
            </div>
            <span class="card-summary-tag" id="summarySound">WOOD · P600 · V80%</span>
          </div>
          <span class="card-arrow-icon">→</span>
        </div>
        <div class="card-expand-body" onclick="event.stopPropagation()">
          <div class="slider-item">
            <span>PITCH</span>
            <input type="range" id="pitchSlider" min="200" max="1000" step="20" value="600">
          </div>
          <div class="slider-item">
            <span>VOLUME</span>
            <input type="range" id="volSlider" min="0.1" max="1" step="0.05" value="0.8">
          </div>
          <div class="sound-chips-grid">
            <button class="sound-btn selected" id="s-wood" onclick="setSound('wood')">우드</button>
            <button class="sound-btn" id="s-bass" onclick="setSound('bass')">베이스</button>
            <button class="sound-btn" id="s-drum" onclick="setSound('drum')">드럼</button>
            <button class="sound-btn" id="s-beep" onclick="setSound('beep')">비프</button>
            <button class="sound-btn" id="s-click" onclick="setSound('click')">클릭</button>
          </div>
        </div>
      </div>

      <!-- 3단: 민트 카드 (Rhythm Meter) -->
      <div class="stack-card card-mint" id="cardMint" onclick="toggleSubCard('cardMint')">
        <div class="card-header-bar">
          <div class="card-header-left">
            <div class="card-header-title">
              <span>Rhythm Meter</span>
            </div>
            <span class="card-summary-tag" id="summaryMeter">●●●●</span>
          </div>
          <span class="card-arrow-icon">→</span>
        </div>
        <div class="card-expand-body" onclick="event.stopPropagation()">
          <div class="meter-chips-grid">
            <button class="meter-btn selected" id="m-p1" onclick="setMeter('p1')">●●●●</button>
            <button class="meter-btn" id="m-p2" onclick="setMeter('p2')">●○●○</button>
            <button class="meter-btn" id="m-p3" onclick="setMeter('p3')">●○●●</button>
            <button class="meter-btn" id="m-p4" onclick="setMeter('p4')">●●○●</button>
            <button class="meter-btn" id="m-p5" onclick="setMeter('p5')">●●●○</button>
          </div>
        </div>
      </div>

      <!-- 4단: 화이트 카드 (Intervals & Presets) -->
      <div class="stack-card card-white" id="cardWhite" onclick="toggleIntervalCard()">
        <div class="card-header-bar">
          <div class="card-header-left">
            <div class="card-header-title">
              <span>Intervals & Presets</span>
              <!-- 펼쳐졌을 때만 노출되는 복사 버튼 -->
              <button class="header-copy-btn" onclick="event.stopPropagation(); duplicateSelectedStep();" title="선택된 구간 복제">복사 ⧉</button>
            </div>
            <!-- 요청된 3개 분리 뱃지 요약 박스: #1, zone3, 0:00:00 -->
            <div class="summary-badge-group">
              <span class="summary-box" id="sumBoxSlot">#1</span>
              <span class="summary-box" id="sumBoxZone">zone 1</span>
              <span class="summary-box" id="sumBoxTime">0:01:00</span>
            </div>
          </div>
          <span class="card-arrow-icon">→</span>
        </div>
        <div class="card-expand-body" onclick="event.stopPropagation()">
          <div class="steps-list-wrap" id="stepsListWrap"></div>
          <div style="font-size:0.68rem; color:#8e8e93; font-weight:700; margin-bottom:6px;">PRESET SET SLOTS</div>
          <div class="preset-scroll-row" id="presetScrollRow"></div>
        </div>
      </div>

    </div>

    <!-- 하단 START RUN 버튼 -->
    <button class="start-run-bar" id="startRunBtn">START RUN ▶</button>

  </div>

  <script>
    let bpm = 180;
    let basePitch = 600;
    let masterGain = 0.8;
    let soundType = 'wood';
    let meterMode = 'p1';
    let durationSec = 60;
    let selectedStepIndex = 0;
    let currentRoutineSlot = 0;

    let audioCtx = null;
    let testTimer = null;
    let sliderSoundDebounce = null;

    const METERS = {
      'p1': { label: '●●●●', pattern: [1, 1, 1, 1] },
      'p2': { label: '●○●○', pattern: [1, 0, 1, 0] },
      'p3': { label: '●○●●', pattern: [1, 0, 1, 1] },
      'p4': { label: '●●○●', pattern: [1, 1, 0, 1] },
      'p5': { label: '●●●○', pattern: [1, 1, 1, 0] }
    };

    let routine = [
      { durationSec: 60, bpm: 180, pitch: 600, vol: 0.8, sound: 'wood', meter: 'p1' }
    ];

    const cardBlack = document.getElementById('cardBlack');
    const cardOrange = document.getElementById('cardOrange');
    const cardMint = document.getElementById('cardMint');
    const cardWhite = document.getElementById('cardWhite');

    const bpmDisplay = document.getElementById('bpmDisplay');
    const bpmDialWrap = document.getElementById('bpmDialWrap');
    const durationSecInput = document.getElementById('durationSecInput');
    const stepsListWrap = document.getElementById('stepsListWrap');
    const presetScrollRow = document.getElementById('presetScrollRow');
    const activeSlotBadge = document.getElementById('activeSlotBadge');
    const testToneBtn = document.getElementById('testToneBtn');

    const summaryCadence = document.getElementById('summaryCadence');
    const summarySound = document.getElementById('summarySound');
    const summaryMeter = document.getElementById('summaryMeter');

    // 4단 요약 분리 박스들
    const sumBoxSlot = document.getElementById('sumBoxSlot');
    const sumBoxZone = document.getElementById('sumBoxZone');
    const sumBoxTime = document.getElementById('sumBoxTime');

    function triggerHaptic(ms = 20) {
      if (navigator.vibrate) navigator.vibrate(ms);
    }

    function formatTotalTimeHMS(totalSeconds) {
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      const mm = String(minutes).padStart(2, '0');
      const ss = String(seconds).padStart(2, '0');
      return `${hours}:${mm}:${ss}`;
    }

    function updateSummaries() {
      summaryCadence.textContent = `${bpm} BPM · ${durationSec}s`;
      summarySound.textContent = `${soundType.toUpperCase()} · P${basePitch} · V${Math.round(masterGain * 100)}%`;
      summaryMeter.textContent = METERS[meterMode] ? METERS[meterMode].label : '●●●●';

      const totalSec = routine.reduce((acc, cur) => acc + (parseInt(cur.durationSec) || 0), 0);
      const totalTimeFormatted = formatTotalTimeHMS(totalSec);

      // 개별 박스에 값 배정: #1, zone3, 0:00:00
      sumBoxSlot.textContent = `#${currentRoutineSlot + 1}`;
      sumBoxZone.textContent = `zone ${routine.length}`;
      sumBoxTime.textContent = totalTimeFormatted;
    }

    function openCadenceManually() {
      if (!cardBlack.classList.contains('expanded')) {
        triggerHaptic(15);
        cardBlack.classList.add('expanded');
        cardWhite.classList.remove('expanded');
        updateSummaries();
      }
    }

    function toggleSubCard(cardId) {
      triggerHaptic(15);
      const targetCard = document.getElementById(cardId);
      const isExpanded = targetCard.classList.contains('expanded');

      cardOrange.classList.remove('expanded');
      cardMint.classList.remove('expanded');

      if (!isExpanded) {
        targetCard.classList.add('expanded');
      }
      updateSummaries();
    }

    function toggleIntervalCard() {
      triggerHaptic(15);
      const isExpanded = cardWhite.classList.contains('expanded');

      if (!isExpanded) {
        cardWhite.classList.add('expanded');
        cardBlack.classList.remove('expanded');
        cardOrange.classList.remove('expanded');
        cardMint.classList.remove('expanded');
      } else {
        cardWhite.classList.remove('expanded');
        cardBlack.classList.add('expanded');
      }
      updateSummaries();
    }

    function initAudio() {
      if (!audioCtx) {
        const AudioClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioClass({ latencyHint: 'interactive' });
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    // 1박 테스트 사운드 (피치, 볼륨 조절 시 호출)
    function playBeepSound() {
      initAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;

      if (soundType === 'drum') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(Math.max(basePitch * 0.35, 120), now);
        osc.frequency.exponentialRampToValueAtTime(38, now + 0.08);
        gain.gain.setValueAtTime(masterGain * 1.2, now);
        gain.gain.linearRampToValueAtTime(0.0001, now + 0.09);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.09);
        return;
      }

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      let dur = 0.05;
      let startFreq = basePitch;
      let wave = 'triangle';

      if (soundType === 'bass') { wave = 'sine'; startFreq = basePitch * 0.3; dur = 0.08; }
      else if (soundType === 'wood') { wave = 'triangle'; startFreq = basePitch; dur = 0.04; }
      else if (soundType === 'beep') { wave = 'sine'; startFreq = basePitch; dur = 0.06; }
      else { wave = 'square'; startFreq = basePitch; dur = 0.02; }

      osc.type = wave;
      osc.frequency.setValueAtTime(startFreq, now);
      gain.gain.setValueAtTime(masterGain * 0.8, now);
      gain.gain.linearRampToValueAtTime(0.0001, now + dur);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + dur);
    }

    // 슬라이더 조작 시 1박 테스트 사운드 디바운스 트리거
    function triggerSliderTone() {
      if (sliderSoundDebounce) clearTimeout(sliderSoundDebounce);
      sliderSoundDebounce = setTimeout(() => {
        playBeepSound();
        triggerHaptic(10);
      }, 40);
    }

    // 4박자 완주 테스트
    function runTestFourBeats() {
      if (testTimer) {
        clearInterval(testTimer);
        testTimer = null;
      }

      initAudio();
      const activeMeter = METERS[meterMode] || METERS['p1'];
      let count = 0;
      const intervalMs = (60 / bpm) * 1000;

      testToneBtn.classList.add('playing');
      testToneBtn.textContent = '1/4';

      const playBeat = () => {
        if (count >= 4) {
          clearInterval(testTimer);
          testTimer = null;
          testToneBtn.classList.remove('playing');
          testToneBtn.textContent = 'TEST ♪';
          return;
        }

        testToneBtn.textContent = `${count + 1}/4`;
        if (activeMeter.pattern[count] === 1) {
          playBeepSound();
          triggerHaptic(15);
        }

        count++;
      };

      playBeat();
      testTimer = setInterval(playBeat, intervalMs);
    }

    // BPM 다이얼 조작
    let isRolling = false;
    let startY = 0;
    let startBpm = 180;
    const SENSITIVITY = 4.5;

    function setBpm(val) {
      const clamped = Math.min(Math.max(Math.round(val), 40), 260);
      if (clamped !== bpm) {
        bpm = clamped;
        bpmDisplay.textContent = bpm;
        updateSummaries();
        triggerHaptic(8);
      }
    }

    bpmDialWrap.addEventListener('mousedown', (e) => {
      isRolling = true; startY = e.clientY; startBpm = bpm;
    });
    window.addEventListener('mousemove', (e) => {
      if (!isRolling) return;
      setBpm(startBpm + Math.round((startY - e.clientY) / SENSITIVITY));
    });
    window.addEventListener('mouseup', () => isRolling = false);

    bpmDialWrap.addEventListener('touchstart', (e) => {
      isRolling = true; startY = e.touches[0].clientY; startBpm = bpm;
    }, { passive: true });
    window.addEventListener('touchmove', (e) => {
      if (!isRolling) return;
      setBpm(startBpm + Math.round((startY - e.touches[0].clientY) / SENSITIVITY));
    }, { passive: true });
    window.addEventListener('touchend', () => isRolling = false);

    // 하단 12개 원형 프리셋 슬라이더
    for (let i = 0; i < 12; i++) {
      const dot = document.createElement('div');
      dot.className = `preset-chip-dot ${i === 0 ? 'active' : ''}`;
      dot.textContent = i + 1;
      dot.onclick = () => selectPreset(i);
      presetScrollRow.appendChild(dot);
    }

    function selectPreset(idx) {
      triggerHaptic(20);
      currentRoutineSlot = idx;
      activeSlotBadge.textContent = `ROUTINE #${idx + 1}`;
      try {
        localStorage.setItem('matempa_active_slot', idx);
        const saved = localStorage.getItem(`matempa_routine_slot_${idx}`);
        routine = saved ? JSON.parse(saved) : (idx === 0 ? [{ durationSec: 60, bpm: 180, pitch: 600, vol: 0.8, sound: 'wood', meter: 'p1' }] : []);
      } catch (e) { routine = []; }
      
      selectedStepIndex = 0;
      if (routine.length > 0) applyStepData(routine[0]);
      renderSteps();

      const dots = presetScrollRow.querySelectorAll('.preset-chip-dot');
      dots.forEach((d, i) => d.classList.toggle('active', i === idx));
      updateSummaries();
    }

    // 선택된 구간 복제 (헤더 버튼 전용)
    window.duplicateSelectedStep = function() {
      if (routine.length === 0 || selectedStepIndex === null || !routine[selectedStepIndex]) {
        alert("복사할 구간을 먼저 목록에서 선택해주세요.");
        return;
      }
      triggerHaptic(25);
      const source = routine[selectedStepIndex];
      const cloned = JSON.parse(JSON.stringify(source));
      
      routine.splice(selectedStepIndex + 1, 0, cloned);
      selectedStepIndex = selectedStepIndex + 1;
      saveRoutine();
    };

    let dragSrcIndex = null;
    let longPressTimer = null;
    let isLongPressActive = false;

    function renderSteps() {
      stepsListWrap.innerHTML = '';
      if (routine.length === 0) {
        stepsListWrap.innerHTML = '<div style="color:#8e8e93; font-size:0.75rem; padding:8px 0;">구간이 없습니다. 상단에서 [+ 추가]를 누르세요.</div>';
        updateSummaries();
        return;
      }

      routine.forEach((step, idx) => {
        const item = document.createElement('div');
        item.className = `step-card-item ${idx === selectedStepIndex ? 'selected' : ''}`;
        item.dataset.index = idx;

        item.innerHTML = `
          <div style="flex: 1;">
            <b>${idx + 1}구간</b>: ${step.durationSec}초 (${step.bpm} BPM)
            <span style="color:#8e8e93; font-size:0.68rem; margin-left:4px;">${step.sound.toUpperCase()} | ${METERS[step.meter] ? METERS[step.meter].label : ''}</span>
          </div>
          <div class="step-btn-group">
            <span class="step-icon-btn delete" title="구간 삭제" onclick="event.stopPropagation(); removeStep(${idx});">&times;</span>
          </div>
        `;

        item.onclick = () => {
          if (!isLongPressActive) {
            triggerHaptic(15);
            selectedStepIndex = idx;
            applyStepData(routine[idx]);
            renderSteps();
          }
        };

        const startLongPress = (clientX, clientY) => {
          isLongPressActive = false;
          longPressTimer = setTimeout(() => {
            isLongPressActive = true;
            dragSrcIndex = idx;
            item.classList.add('dragging-active');
            item.setAttribute('draggable', 'true');
            triggerHaptic(40);
          }, 350);
        };

        const clearLongPress = () => {
          if (longPressTimer) {
            clearTimeout(longPressTimer);
            longPressTimer = null;
          }
        };

        item.addEventListener('mousedown', (e) => startLongPress(e.clientX, e.clientY));
        item.addEventListener('mouseup', () => {
          clearLongPress();
          setTimeout(() => { isLongPressActive = false; }, 50);
        });
        item.addEventListener('mouseleave', clearLongPress);

        item.addEventListener('touchstart', (e) => {
          startLongPress(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: true });

        item.addEventListener('touchend', (e) => {
          clearLongPress();
          if (isLongPressActive && dragSrcIndex !== null) {
            const changedTouch = e.changedTouches[0];
            const targetEl = document.elementFromPoint(changedTouch.clientX, changedTouch.clientY);
            const targetStep = targetEl ? targetEl.closest('.step-card-item') : null;
            if (targetStep && targetStep.dataset.index !== undefined) {
              const targetIdx = parseInt(targetStep.dataset.index);
              reorderSteps(dragSrcIndex, targetIdx);
            }
          }
          cleanupDragClasses();
        });

        item.addEventListener('touchmove', (e) => {
          if (!isLongPressActive) {
            clearLongPress();
          } else {
            e.preventDefault();
            const touch = e.touches[0];
            const targetEl = document.elementFromPoint(touch.clientX, touch.clientY);
            const targetStep = targetEl ? targetEl.closest('.step-card-item') : null;
            document.querySelectorAll('.step-card-item').forEach(el => el.classList.remove('drag-over-target'));
            if (targetStep && targetStep !== item) {
              targetStep.classList.add('drag-over-target');
            }
          }
        }, { passive: false });

        item.addEventListener('dragstart', (e) => {
          dragSrcIndex = idx;
          e.dataTransfer.setData('text/plain', idx);
        });
        item.addEventListener('dragover', (e) => {
          e.preventDefault();
          item.classList.add('drag-over-target');
        });
        item.addEventListener('dragleave', () => item.classList.remove('drag-over-target'));
        item.addEventListener('drop', (e) => {
          e.preventDefault();
          const fromIdx = parseInt(e.dataTransfer.getData('text/plain'));
          reorderSteps(fromIdx, idx);
          cleanupDragClasses();
        });

        stepsListWrap.appendChild(item);
      });
      updateSummaries();
    }

    function cleanupDragClasses() {
      isLongPressActive = false;
      dragSrcIndex = null;
      document.querySelectorAll('.step-card-item').forEach(el => {
        el.classList.remove('dragging-active', 'drag-over-target');
        el.removeAttribute('draggable');
      });
    }

    function reorderSteps(fromIdx, toIdx) {
      if (fromIdx === toIdx || fromIdx === null || toIdx === null) return;
      triggerHaptic(30);
      const movedItem = routine.splice(fromIdx, 1)[0];
      routine.splice(toIdx, 0, movedItem);

      if (selectedStepIndex === fromIdx) selectedStepIndex = toIdx;
      else if (fromIdx < selectedStepIndex && toIdx >= selectedStepIndex) selectedStepIndex--;
      else if (fromIdx > selectedStepIndex && toIdx <= selectedStepIndex) selectedStepIndex++;

      saveRoutine();
    }

    function applyStepData(step) {
      bpm = step.bpm;
      bpmDisplay.textContent = bpm;
      basePitch = step.pitch;
      document.getElementById('pitchSlider').value = basePitch;
      masterGain = step.vol;
      document.getElementById('volSlider').value = masterGain;
      soundType = step.sound;
      meterMode = step.meter;
      setQuickTime(step.durationSec);

      ['wood', 'bass', 'drum', 'beep', 'click'].forEach(s => {
        document.getElementById(`s-${s}`).classList.toggle('selected', s === soundType);
      });
      ['p1', 'p2', 'p3', 'p4', 'p5'].forEach(p => {
        document.getElementById(`m-${p}`).classList.toggle('selected', p === meterMode);
      });
      updateSummaries();
    }

    function saveRoutine() {
      try {
        localStorage.setItem(`matempa_routine_slot_${currentRoutineSlot}`, JSON.stringify(routine));
      } catch (e) {}
      renderSteps();
    }

    function setQuickTime(sec) {
      triggerHaptic(15);
      durationSec = sec;
      durationSecInput.value = sec;
      ['t-60', 't-300', 't-600'].forEach(id => document.getElementById(id).classList.remove('selected'));
      const btn = document.getElementById(`t-${sec}`);
      if (btn) btn.classList.add('selected');
      updateSummaries();
    }

    durationSecInput.addEventListener('input', (e) => {
      durationSec = parseInt(e.target.value) || 60;
      ['t-60', 't-300', 't-600'].forEach(id => document.getElementById(id).classList.remove('selected'));
      const btn = document.getElementById(`t-${durationSec}`);
      if (btn) btn.classList.add('selected');
      updateSummaries();
    });

    function setSound(type) {
      triggerHaptic(15);
      soundType = type;
      ['wood', 'bass', 'drum', 'beep', 'click'].forEach(s => {
        document.getElementById(`s-${s}`).classList.toggle('selected', s === type);
      });
      updateSummaries();
      playBeepSound();
    }

    function setMeter(meter) {
      triggerHaptic(15);
      meterMode = meter;
      ['p1', 'p2', 'p3', 'p4', 'p5'].forEach(m => {
        document.getElementById(`m-${m}`).classList.toggle('selected', m === meter);
      });
      updateSummaries();
    }

    function removeStep(idx) {
      triggerHaptic(20);
      routine.splice(idx, 1);
      selectedStepIndex = Math.max(0, selectedStepIndex - 1);
      saveRoutine();
    }

    testToneBtn.onclick = () => {
      triggerHaptic(20);
      runTestFourBeats();
    };

    document.getElementById('addStepBtn').onclick = () => {
      triggerHaptic(25);
      const sec = parseInt(durationSecInput.value) || 60;
      routine.push({
        durationSec: sec,
        bpm: bpm,
        pitch: basePitch,
        vol: masterGain,
        sound: soundType,
        meter: meterMode
      });
      selectedStepIndex = routine.length - 1;
      saveRoutine();

      cardWhite.classList.add('expanded');
      updateSummaries();
    };

    document.getElementById('updateStepBtn').onclick = () => {
      triggerHaptic(20);
      if (!routine[selectedStepIndex]) return;
      routine[selectedStepIndex] = {
        durationSec: parseInt(durationSecInput.value) || 60,
        bpm: bpm,
        pitch: basePitch,
        vol: masterGain,
        sound: soundType,
        meter: meterMode
      };
      saveRoutine();

      cardWhite.classList.add('expanded');
      updateSummaries();
    };

    document.getElementById('resetBtn').onclick = () => {
      triggerHaptic(30);
      bpm = 180;
      bpmDisplay.textContent = bpm;
      setQuickTime(60);
      setSound('wood');
      setMeter('p1');
    };

    // 피치 조절 시 1박 사운드 재생
    document.getElementById('pitchSlider').oninput = (e) => {
      basePitch = parseFloat(e.target.value);
      updateSummaries();
      triggerSliderTone();
    };

    // 볼륨 조절 시 1박 사운드 재생
    document.getElementById('volSlider').oninput = (e) => {
      masterGain = parseFloat(e.target.value);
      updateSummaries();
      triggerSliderTone();
    };

    document.getElementById('startRunBtn').onclick = () => {
      triggerHaptic(30);
      if (routine.length === 0) {
        alert('최소 1개 이상의 구간을 등록해주세요.');
        return;
      }
      try {
        localStorage.setItem('matempa_active_slot', currentRoutineSlot);
      } catch (e) {}
      window.location.href = 'run.html';
    };

    selectPreset(0);
    updateSummaries();
  </script>
</body>
</html>
