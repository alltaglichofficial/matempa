<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MA.TEMPA - RUN</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0b0b0c">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: #0b0b0c;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 100vh;
      padding: 1.2rem 1.2rem 2.2rem 1.2rem;
      user-select: none;
      -webkit-user-select: none;
      letter-spacing: -0.3px;
    }

    .app-screen {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: space-between;
      align-items: center;
      position: relative;
    }

    /* 상단 헤더 */
    .run-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.6rem;
    }
    .routine-name-badge {
      font-size: 0.85rem;
      font-weight: 800;
      color: #8e8e93;
      letter-spacing: 0.5px;
    }

    .auto-pause-toggle-btn {
      background: rgba(255, 255, 255, 0.08);
      color: #8e8e93;
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 6px 10px;
      border-radius: 12px;
      font-size: 0.7rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s ease;
    }
    .auto-pause-toggle-btn.active {
      background: rgba(52, 199, 89, 0.16);
      color: #34c759;
      border-color: rgba(52, 199, 89, 0.35);
    }
    .auto-pause-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #8e8e93;
    }
    .auto-pause-toggle-btn.active .auto-pause-dot {
      background: #34c759;
      box-shadow: 0 0 6px rgba(52, 199, 89, 0.8);
    }

    /* 대형 워치 메인 페이스 */
    .watch-display-large {
      width: 100%;
      height: 505px;
      background: linear-gradient(180deg, #161618 0%, #0d0d0e 100%);
      border-radius: 46px;
      padding: 18px 16px 16px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 24px 50px -10px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.15);
      position: relative;
    }

    .top-stat-row {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      color: #8e8e93;
      font-weight: 700;
      padding: 0 4px;
    }
    .zone-indicator-pill {
      background: rgba(52, 199, 89, 0.15);
      color: #34c759;
      padding: 3px 10px;
      border-radius: 8px;
      font-weight: 800;
    }
    .auto-pause-status-pill {
      display: none;
      background: rgba(255, 149, 0, 0.18);
      color: #ff9500;
      padding: 3px 10px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 0.68rem;
      letter-spacing: 0.5px;
      animation: blink 1s infinite alternate;
    }
    @keyframes blink { from { opacity: 0.5; } to { opacity: 1; } }

    /* 화면 인라인 사운드 조절 바 */
    .inline-sound-control-card {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 4px;
    }
    .sound-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .sound-label {
      font-size: 0.65rem;
      font-weight: 800;
      color: #8e8e93;
      min-width: 44px;
    }
    .sound-value-text {
      font-size: 0.65rem;
      font-weight: 800;
      color: #34c759;
      min-width: 32px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .inline-slider {
      -webkit-appearance: none;
      flex: 1;
      height: 4px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.16);
      outline: none;
    }
    .inline-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #ffffff;
      cursor: pointer;
      box-shadow: 0 1px 4px rgba(0,0,0,0.5);
    }

    /* 케이던스 및 페이스 3열 비교 그리드 */
    .cadence-comparison-grid {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 0.1rem;
      padding: 0 4px;
    }

    .cadence-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
    }
    .cadence-num {
      font-size: 2.6rem;
      font-weight: 900;
      line-height: 0.95;
      font-variant-numeric: tabular-nums;
      letter-spacing: -1.5px;
    }
    .cadence-num.target {
      color: #ffffff;
      filter: drop-shadow(0 4px 12px rgba(255, 255, 255, 0.1));
    }
    .cadence-num.live {
      color: #34c759;
      filter: drop-shadow(0 4px 12px rgba(52, 199, 89, 0.25));
    }
    .cadence-num.pace {
      color: #ff9f0a;
      font-size: 2.35rem;
      letter-spacing: -1px;
      filter: drop-shadow(0 4px 12px rgba(255, 159, 10, 0.25));
    }

    .cadence-col-label {
      font-size: 0.58rem;
      font-weight: 800;
      letter-spacing: 0.8px;
      margin-top: 4px;
      color: #8e8e93;
      white-space: nowrap;
    }
    .cadence-divider {
      width: 1px;
      height: 42px;
      background: rgba(255, 255, 255, 0.12);
    }

    /* 대형 메인 이동 거리(KM) */
    .distance-hero-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0.1rem 0;
    }
    .distance-hero-num {
      font-size: 3.4rem;
      font-weight: 900;
      line-height: 0.9;
      color: #007aff;
      font-variant-numeric: tabular-nums;
      letter-spacing: -1.8px;
      filter: drop-shadow(0 6px 16px rgba(0, 122, 255, 0.35));
    }
    .distance-hero-unit {
      font-size: 0.72rem;
      font-weight: 900;
      color: #8e8e93;
      letter-spacing: 1.5px;
      margin-top: 3px;
    }

    .step-progress-text {
      font-size: 0.76rem;
      color: #a0a0a5;
      font-weight: 600;
    }

    .timer-capsule-large {
      background: rgba(255, 255, 255, 0.06);
      width: 220px;
      height: 40px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 1.25rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: 1px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.3);
    }

    .watch-indicators { display: flex; gap: 8px; margin-bottom: 2px; }
    .watch-ind-step {
      width: 24px;
      height: 4px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.1);
      transition: background 0.08s, box-shadow 0.08s;
    }
    .watch-ind-step.active {
      background: #34c759;
      box-shadow: 0 0 12px rgba(52, 199, 89, 0.9);
    }

    /* 하단 러닝 제어 영역 */
    .controls-wrapper {
      width: 100%;
      height: 76px;
      margin-top: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 러닝 중 단일 탭 일시정지 바 */
    .running-bar {
      width: 100%;
      display: flex;
    }
    .single-tap-pause-btn {
      width: 100%;
      height: 58px;
      background: #ffffff;
      color: #111111;
      border: none;
      border-radius: 29px;
      font-size: 1.05rem;
      font-weight: 900;
      letter-spacing: 0.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 20px rgba(255, 255, 255, 0.12);
      transition: transform 0.12s ease;
    }
    .single-tap-pause-btn:active { transform: scale(0.96); }

    /* 일시정지 중 2분할 제어 바 */
    .paused-split-bar {
      width: 100%;
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .btn-quick-resume {
      flex: 1.2;
      height: 58px;
      background: #34c759;
      color: #ffffff;
      border: none;
      border-radius: 29px;
      font-size: 0.95rem;
      font-weight: 900;
      letter-spacing: 0.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 20px rgba(52, 199, 89, 0.25);
      transition: transform 0.12s ease;
    }
    .btn-quick-resume:active { transform: scale(0.95); }

    .finish-hold-wrap {
      position: relative;
      width: 68px;
      height: 68px;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }
    .finish-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
      pointer-events: none;
    }
    .finish-track {
      fill: none;
      stroke: rgba(255, 255, 255, 0.12);
      stroke-width: 4;
    }
    .finish-progress {
      fill: none;
      stroke: #ff3b30;
      stroke-width: 4;
      stroke-linecap: round;
      stroke-dasharray: 188.49;
      stroke-dashoffset: 188.49;
      transition: stroke-dashoffset 0.04s linear;
    }
    .finish-core-btn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 1px solid rgba(255, 59, 48, 0.4);
      background: rgba(255, 59, 48, 0.18);
      color: #ff3b30;
      font-size: 0.72rem;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
      transition: transform 0.1s ease;
    }
    .finish-core-btn:active { transform: scale(0.92); }
    .finish-sub-text {
      font-size: 0.5rem;
      opacity: 0.8;
      margin-top: 1px;
    }
  </style>
</head>
<body>

  <div class="app-screen">

    <!-- 상단 헤더 -->
    <div class="run-header">
      <div class="header-left-wrap">
        <span class="routine-name-badge" id="runRoutineTitle">ROUTINE #1</span>
      </div>
      <button class="auto-pause-toggle-btn active" id="autoPauseToggleBtn" onclick="toggleAutoPauseOption()">
        <span class="auto-pause-dot"></span>
        <span id="autoPauseText">AUTO PAUSE ON</span>
      </button>
    </div>

    <!-- 대형 워치 메인 페이스 -->
    <div class="watch-display-large">
      <div class="top-stat-row">
        <span class="zone-indicator-pill" id="runZoneBadge">ZONE.1</span>
        <span class="auto-pause-status-pill" id="autoPauseStatusPill">⏸ AUTO PAUSED</span>
        <span id="runSoundAndMeter">WOOD | ●●●●</span>
      </div>

      <!-- 인라인 실시간 사운드 조절 바 -->
      <div class="inline-sound-control-card">
        <div class="sound-row">
          <span class="sound-label">VOL</span>
          <input type="range" class="inline-slider" id="inlineVolSlider" min="0" max="100" value="100" oninput="updateInlineSound()">
          <span class="sound-value-text" id="inlineVolText">100%</span>
        </div>
        <div class="sound-row">
          <span class="sound-label">PITCH</span>
          <input type="range" class="inline-slider" id="inlinePitchSlider" min="50" max="150" value="100" oninput="updateInlineSound()">
          <span class="sound-value-text" id="inlinePitchText">1.0x</span>
        </div>
      </div>

      <!-- 케이던스 및 페이스 3열 비교 그리드 -->
      <div class="cadence-comparison-grid">
        <div class="cadence-col">
          <div class="cadence-num target" id="targetBpmDisplay">180</div>
          <span class="cadence-col-label">TARGET</span>
        </div>
        <div class="cadence-divider"></div>
        <div class="cadence-col">
          <div class="cadence-num live" id="liveCadenceDisplay">--</div>
          <span class="cadence-col-label">SPM</span>
        </div>
        <div class="cadence-divider"></div>
        <div class="cadence-col">
          <div class="cadence-num pace" id="livePaceDisplay">--'--"</div>
          <span class="cadence-col-label">PACE /KM</span>
        </div>
      </div>

      <!-- 대형 메인 이동 거리(KM) -->
      <div class="distance-hero-wrap">
        <div class="distance-hero-num" id="liveDistanceDisplay">0.00</div>
        <div class="distance-hero-unit">KILOMETERS</div>
      </div>

      <!-- 구간 남은 시간 및 전체 타이머 -->
      <div class="step-progress-text" id="stepRemainingText">남은 시간 계산 중...</div>
      <div class="timer-capsule-large" id="runTimerDisplay">0:00:00:00</div>

      <div class="watch-indicators">
        <div class="watch-ind-step" id="ind-0"></div>
        <div class="watch-ind-step" id="ind-1"></div>
        <div class="watch-ind-step" id="ind-2"></div>
        <div class="watch-ind-step" id="ind-3"></div>
      </div>
    </div>

    <!-- 하단 러닝 제어 인터페이스 -->
    <div class="controls-wrapper">
      <!-- 1. 러닝 중: 원클릭 일시정지 -->
      <div class="running-bar" id="runningBar">
        <button class="single-tap-pause-btn" id="singleTapPauseBtn" onclick="onSingleTapPause()">PAUSE ||</button>
      </div>

      <!-- 2. 일시정지 중: 좌(즉시 진행) / 우(1.25s 홀드 완료) -->
      <div class="paused-split-bar" id="pausedSplitBar">
        <button class="btn-quick-resume" onclick="onQuickResume()">RESUME ▶</button>
        
        <div class="finish-hold-wrap" id="finishHoldWrap">
          <svg class="finish-svg" viewBox="0 0 68 68">
            <circle class="finish-track" cx="34" cy="34" r="30"></circle>
            <circle class="finish-progress" id="finishHoldProgress" cx="34" cy="34" r="30"></circle>
          </svg>
          <button class="finish-core-btn" id="finishHoldBtn">
            <span>FINISH</span>
            <span class="finish-sub-text">1.25s</span>
          </button>
        </div>
      </div>
    </div>

  </div>

  <audio id="silentBackgroundAudio" loop playsinline style="display: none;"></audio>

  <script>
    let activeSlot = 0;
    let routine = [];
    let isRunning = false;
    let isSystemInterrupted = false;

    // 실시간 사운드 계수
    let runVolumeMultiplier = 1.0;
    let runPitchMultiplier = 1.0;

    let isAutoPauseEnabled = true;
    let isAutoPausedNow = false;

    // 3초 거리 무변동 오토포즈 필터
    const AUTO_PAUSE_FREEZE_LIMIT_MS = 3000;
    let lastDistanceChangeTime = 0;
    let lastTrackedDistance = 0;
    let pauseAnchorCoords = null;

    const MIN_VALID_RUN_SPEED = 0.7; 
    const RESUME_GPS_DISTANCE_M = 4.0;

    let currentStepIndex = 0;
    let currentBeatIndex = 0;

    let startTimeMs = 0;
    let baseOffsetMs = 0;
    let elapsedMs = 0;
    let lastSecondReported = -1;

    let audioCtx = null;
    let beatTimer = null;
    let clockTimer = null;
    let currentStepData = null;

    let totalDistanceMeters = 0;
    let lastDistanceTickTime = 0;
    let currentCalculatedSpeed = 0;

    // --- [1km 스플릿 및 런 세션 데이터 추적 변수] ---
    let runSessionStartTime = null; 
    let splits = [];                
    let lastSplitDistanceM = 0;     
    let lastSplitTimeMs = 0;        

    // 모션 센서 윈도우 필터
    let recentStepTimes = [];
    let lastStepTime = 0;
    let lastAccelMagnitude = 0;
    const STEP_THRESHOLD = 12.5;
    const MIN_STEP_INTERVAL_MS = 240;
    let currentCalculatedSpm = 0;

    let geoWatchId = null;
    let recentSpeeds = [];
    let lastGpsUpdateTime = 0;
    let lastCoords = null;

    const METERS = {
      'p1': { label: '●●●●', pattern: [1, 1, 1, 1] },
      'p2': { label: '●○●○', pattern: [1, 0, 1, 0] },
      'p3': { label: '●○●●', pattern: [1, 0, 1, 1] },
      'p4': { label: '●●○●', pattern: [1, 1, 0, 1] },
      'p5': { label: '●●●○', pattern: [1, 1, 1, 0] }
    };

    const runRoutineTitle = document.getElementById('runRoutineTitle');
    const autoPauseToggleBtn = document.getElementById('autoPauseToggleBtn');
    const autoPauseText = document.getElementById('autoPauseText');
    const autoPauseStatusPill = document.getElementById('autoPauseStatusPill');

    const runZoneBadge = document.getElementById('runZoneBadge');
    const liveDistanceDisplay = document.getElementById('liveDistanceDisplay');
    const runSoundAndMeter = document.getElementById('runSoundAndMeter');
    const targetBpmDisplay = document.getElementById('targetBpmDisplay');
    const liveCadenceDisplay = document.getElementById('liveCadenceDisplay');
    const livePaceDisplay = document.getElementById('livePaceDisplay');
    const stepRemainingText = document.getElementById('stepRemainingText');
    const runTimerDisplay = document.getElementById('runTimerDisplay');
    const silentAudioEl = document.getElementById('silentBackgroundAudio');

    const runningBar = document.getElementById('runningBar');
    const pausedSplitBar = document.getElementById('pausedSplitBar');
    const finishHoldBtn = document.getElementById('finishHoldBtn');
    const finishHoldProgress = document.getElementById('finishHoldProgress');

    const inlineVolSlider = document.getElementById('inlineVolSlider');
    const inlinePitchSlider = document.getElementById('inlinePitchSlider');
    const inlineVolText = document.getElementById('inlineVolText');
    const inlinePitchText = document.getElementById('inlinePitchText');

    function triggerHaptic(duration = 20) {
      if (navigator.vibrate) navigator.vibrate(duration);
    }

    function updateInlineSound() {
      const vol = parseInt(inlineVolSlider.value);
      const pitch = parseInt(inlinePitchSlider.value);

      runVolumeMultiplier = vol / 100;
      runPitchMultiplier = pitch / 100;

      inlineVolText.textContent = `${vol}%`;
      inlinePitchText.textContent = `${(pitch / 100).toFixed(1)}x`;

      try {
        localStorage.setItem('matempa_run_vol', runVolumeMultiplier);
        localStorage.setItem('matempa_run_pitch', runPitchMultiplier);
      } catch(e) {}
    }

    function loadSavedSoundSettings() {
      try {
        const savedVol = localStorage.getItem('matempa_run_vol');
        const savedPitch = localStorage.getItem('matempa_run_pitch');
        if (savedVol !== null) {
          runVolumeMultiplier = parseFloat(savedVol);
          inlineVolSlider.value = Math.round(runVolumeMultiplier * 100);
          inlineVolText.textContent = `${inlineVolSlider.value}%`;
        }
        if (savedPitch !== null) {
          runPitchMultiplier = parseFloat(savedPitch);
          inlinePitchSlider.value = Math.round(runPitchMultiplier * 100);
          inlinePitchText.textContent = `${runPitchMultiplier.toFixed(1)}x`;
        }
      } catch(e) {}
    }

    function toggleAutoPauseOption() {
      triggerHaptic(15);
      isAutoPauseEnabled = !isAutoPauseEnabled;
      autoPauseToggleBtn.classList.toggle('active', isAutoPauseEnabled);
      autoPauseText.textContent = isAutoPauseEnabled ? 'AUTO PAUSE ON' : 'AUTO PAUSE OFF';

      if (!isAutoPauseEnabled && isAutoPausedNow) {
        resumeFromAutoPause();
      }
    }

    function triggerAutoPause() {
      if (!isAutoPauseEnabled || isAutoPausedNow || !isRunning) return;
      isAutoPausedNow = true;
      pauseAnchorCoords = lastCoords ? { ...lastCoords } : null;
      autoPauseStatusPill.style.display = 'inline-block';
      pauseTimingAndBeats();
      showPausedControlsUI();
    }

    function resumeFromAutoPause() {
      if (!isAutoPausedNow || !isRunning) return;
      isAutoPausedNow = false;
      pauseAnchorCoords = null;
      autoPauseStatusPill.style.display = 'none';
      lastDistanceChangeTime = performance.now();
      lastTrackedDistance = totalDistanceMeters;
      resumeTimingAndBeats();
      showRunningControlsUI();
    }

    // 거리 누적 및 1km 단위 스플릿 자동 감지
    function addDistance(meters) {
      if (meters <= 0.05) return;
      totalDistanceMeters += meters;
      updateDistanceUI();
      lastDistanceChangeTime = performance.now();

      // 1km(1000m) 통과 감지
      const currentKmMarker = Math.floor(totalDistanceMeters / 1000);
      const recordedKmMarker = Math.floor(lastSplitDistanceM / 1000);

      if (currentKmMarker > recordedKmMarker) {
        const splitDistance = totalDistanceMeters - lastSplitDistanceM;
        const splitTimeMs = elapsedMs - lastSplitTimeMs;
        const splitSec = splitTimeMs / 1000;
        const splitPaceSec = (splitSec / (splitDistance / 1000));

        splits.push({
          km: currentKmMarker,
          splitDistanceM: Math.round(splitDistance),
          splitTimeSec: Math.round(splitSec),
          paceFormatted: formatPace(splitPaceSec),
          avgSpm: currentCalculatedSpm || targetBpmDisplay.textContent
        });

        lastSplitDistanceM = totalDistanceMeters;
        lastSplitTimeMs = elapsedMs;
        triggerHaptic(30);
      }
    }

    function updateDistanceUI() {
      const km = totalDistanceMeters / 1000;
      liveDistanceDisplay.textContent = km.toFixed(2);
    }

    function calculateDistanceMeters(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    function startSilentAudio() {
      if (!silentAudioEl.src) {
        silentAudioEl.src = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQQAAAAAAP8A/w==';
      }
      silentAudioEl.play().catch(() => {});
    }

    function stopSilentAudio() {
      silentAudioEl.pause();
    }

    function initAudio() {
      if (!audioCtx) {
        const AudioClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioClass({ latencyHint: 'interactive' });

        audioCtx.onstatechange = () => {
          if (!isRunning) return;
          if (audioCtx.state === 'interrupted' || audioCtx.state === 'suspended') {
            if (!isSystemInterrupted) {
              isSystemInterrupted = true;
              pauseTimingAndBeats();
            }
          } else if (audioCtx.state === 'running') {
            if (isSystemInterrupted) {
              isSystemInterrupted = false;
              if (!isAutoPausedNow) resumeTimingAndBeats();
            }
          }
        };
      }

      if (audioCtx && audioCtx.state === 'suspended' && !isSystemInterrupted) {
        audioCtx.resume().catch(() => {});
      }
    }

    function formatPace(secPerKm) {
      if (!secPerKm || !isFinite(secPerKm) || secPerKm <= 0 || secPerKm > 1200) {
        return `--'--"`;
      }
      const min = Math.floor(secPerKm / 60);
      const sec = Math.round(secPerKm % 60);
      return `${min}'${String(sec).padStart(2, '0')}"`;
    }

    function initGeolocation() {
      if ('geolocation' in navigator && geoWatchId === null) {
        geoWatchId = navigator.geolocation.watchPosition(
          (position) => {
            if (!isRunning) return;
            const coords = position.coords;
            const now = performance.now();
            lastGpsUpdateTime = now;

            if (coords.accuracy && coords.accuracy > 20) return;
            const speed = coords.speed !== null && !isNaN(coords.speed) ? coords.speed : 0;

            if (isAutoPausedNow) {
              let canResume = false;
              if (pauseAnchorCoords) {
                const moved = calculateDistanceMeters(
                  pauseAnchorCoords.latitude, pauseAnchorCoords.longitude,
                  coords.latitude, coords.longitude
                );
                if (moved >= RESUME_GPS_DISTANCE_M && speed >= MIN_VALID_RUN_SPEED) {
                  canResume = true;
                }
              } else if (speed >= MIN_VALID_RUN_SPEED) {
                canResume = true;
              }

              if (canResume) resumeFromAutoPause();
              else return;
            }

            if (lastCoords) {
              const dist = calculateDistanceMeters(
                lastCoords.latitude, lastCoords.longitude,
                coords.latitude, coords.longitude
              );
              if (dist >= 1.5 && dist <= 50.0 && speed >= 0.4) {
                addDistance(dist);
              }
            }

            if (speed >= MIN_VALID_RUN_SPEED) {
              recentSpeeds.push(speed);
              if (recentSpeeds.length > 5) recentSpeeds.shift();
              currentCalculatedSpeed = recentSpeeds.reduce((a, b) => a + b, 0) / recentSpeeds.length;
              const secPerKm = 1000 / currentCalculatedSpeed;
              livePaceDisplay.textContent = formatPace(secPerKm);
            } else {
              recentSpeeds = [];
              currentCalculatedSpeed = 0;
              livePaceDisplay.textContent = `--'--"`;
            }

            lastCoords = { latitude: coords.latitude, longitude: coords.longitude };
          },
          (err) => {},
          { enableHighAccuracy: true, maximumAge: 1000, timeout: 5000 }
        );
      }
    }

    function stopGeolocation() {
      if (geoWatchId !== null) {
        navigator.geolocation.clearWatch(geoWatchId);
        geoWatchId = null;
      }
      recentSpeeds = [];
      lastCoords = null;
      pauseAnchorCoords = null;
    }

    function initMotionSensor() {
      if (typeof DeviceMotionEvent !== 'undefined') {
        if (typeof DeviceMotionEvent.requestPermission === 'function') {
          DeviceMotionEvent.requestPermission()
            .then(response => {
              if (response === 'granted') {
                window.addEventListener('devicemotion', handleDeviceMotion);
              }
            })
            .catch(() => {});
        } else {
          window.addEventListener('devicemotion', handleDeviceMotion);
        }
      }
    }

    function handleDeviceMotion(event) {
      if (!isRunning) return;
      const acc = event.accelerationIncludingGravity;
      if (!acc || acc.x === null) return;

      const magnitude = Math.sqrt(acc.x * acc.x + acc.y * acc.y + acc.z * acc.z);
      const now = performance.now();

      if (magnitude > STEP_THRESHOLD && lastAccelMagnitude <= STEP_THRESHOLD) {
        if (now - lastStepTime > MIN_STEP_INTERVAL_MS) {
          lastStepTime = now;
          recentStepTimes.push(now);
          recentStepTimes = recentStepTimes.filter(t => now - t <= 3500);

          if (recentStepTimes.length >= 3) {
            const timeSpanSec = (recentStepTimes[recentStepTimes.length - 1] - recentStepTimes[0]) / 1000;
            const stepsCount = recentStepTimes.length - 1;
            const spm = Math.round((stepsCount / timeSpanSec) * 60);

            if (spm >= 110 && spm <= 240) {
              currentCalculatedSpm = spm;
              liveCadenceDisplay.textContent = spm;

              if (isAutoPausedNow) resumeFromAutoPause();

              if (!isAutoPausedNow && now - lastGpsUpdateTime > 3500) {
                const estimatedStride = Math.min(Math.max((spm / 180) * 0.95, 0.7), 1.25);
                currentCalculatedSpeed = (spm / 60) * estimatedStride;
                addDistance(estimatedStride);
                const secPerKm = 1000 / currentCalculatedSpeed;
                livePaceDisplay.textContent = formatPace(secPerKm);
              }
            }
          }
        }
      }

      if (now - lastStepTime > 2500) {
        liveCadenceDisplay.textContent = '--';
        currentCalculatedSpm = 0;
        recentStepTimes = [];
      }

      lastAccelMagnitude = magnitude;
    }

    function formatSecToMinSec(totalSec) {
      const m = Math.floor(totalSec / 60);
      const s = totalSec % 60;
      if (m > 0 && s > 0) return `${m}분 ${s}초`;
      if (m > 0) return `${m}분`;
      return `${s}초`;
    }

    function formatPrecisionTimer(ms) {
      const totalCentis = Math.floor(ms / 10);
      const cs = String(totalCentis % 100).padStart(2, '0');
      const totalSec = Math.floor(ms / 1000);
      const s = String(totalSec % 60).padStart(2, '0');
      const totalMin = Math.floor(totalSec / 60);
      const m = String(totalMin % 60).padStart(2, '0');
      const h = Math.floor(totalMin / 60);
      return `${h}:${m}:${s}:${cs}`;
    }

    function playCueSound(type) {
      initAudio();
      if (!audioCtx || isSystemInterrupted || isAutoPausedNow) return;
      const now = audioCtx.currentTime;
      const vol = (currentStepData ? currentStepData.vol : 0.8) * runVolumeMultiplier;
      const pitchFactor = runPitchMultiplier;

      if (type === 'countdown') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(900 * pitchFactor, now);
        gain.gain.setValueAtTime(vol * 0.9, now);
        gain.gain.linearRampToValueAtTime(0.0001, now + 0.08);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.08);
      } else if (type === 'next_step') {
        [ { f: 880, t: 0 }, { f: 1320, t: 0.12 } ].forEach(tone => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(tone.f * pitchFactor, now + tone.t);
          gain.gain.setValueAtTime(vol * 0.9, now + tone.t);
          gain.gain.linearRampToValueAtTime(0.0001, now + tone.t + 0.22);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + tone.t);
          osc.stop(now + tone.t + 0.22);
        });
      } else if (type === 'complete') {
        [ { f: 659.25, t: 0 }, { f: 880, t: 0.15 }, { f: 1318.5, t: 0.3 } ].forEach(tone => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(tone.f * pitchFactor, now + tone.t);
          gain.gain.setValueAtTime(vol * 1.0, now + tone.t);
          gain.gain.linearRampToValueAtTime(0.0001, now + tone.t + 0.4);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + tone.t);
          osc.stop(now + tone.t + 0.4);
        });
      }
    }

    function playBeep() {
      initAudio();
      if (!audioCtx || !currentStepData || isSystemInterrupted || isAutoPausedNow) return;
      const now = audioCtx.currentTime;
      const vol = currentStepData.vol * runVolumeMultiplier;
      const basePitch = currentStepData.pitch * runPitchMultiplier;
      const soundType = currentStepData.sound;

      if (soundType === 'drum') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(Math.max(basePitch * 0.35, 120), now);
        osc.frequency.exponentialRampToValueAtTime(38, now + 0.08);
        gain.gain.setValueAtTime(vol * 1.2, now);
        gain.gain.linearRampToValueAtTime(0.0001, now + 0.09);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.09);

        const clickOsc = audioCtx.createOscillator();
        const clickGain = audioCtx.createGain();
        clickOsc.type = 'triangle';
        clickOsc.frequency.setValueAtTime(800 * runPitchMultiplier, now);
        clickOsc.frequency.exponentialRampToValueAtTime(100, now + 0.02);
        clickGain.gain.setValueAtTime(vol * 0.7, now);
        clickGain.gain.linearRampToValueAtTime(0.0001, now + 0.02);
        clickOsc.connect(clickGain);
        clickGain.connect(audioCtx.destination);
        clickOsc.start(now);
        clickOsc.stop(now + 0.02);
        return;
      }

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      let dur = 0.05;
      let startFreq = basePitch;
      let wave = 'triangle';

      if (soundType === 'bass') { wave = 'sine'; startFreq = basePitch * 0.3; dur = 0.08; }
      else if (soundType === 'wood') { wave = 'triangle'; startFreq = basePitch; dur = 0.04; }
      else if (soundType === 'beep') { wave = 'sine'; startFreq = basePitch; dur = 0.06; }
      else { wave = 'square'; startFreq = basePitch; dur = 0.02; }

      osc.type = wave;
      osc.frequency.setValueAtTime(startFreq, now);
      gain.gain.setValueAtTime(vol * 0.8, now);
      gain.gain.linearRampToValueAtTime(0.0001, now + dur);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + dur);
    }

    function shouldPlaySoundInPattern(beatIdx) {
      if (!currentStepData) return true;
      const activeMeter = METERS[currentStepData.meter] || METERS['p1'];
      return activeMeter.pattern[beatIdx % 4] === 1;
    }

    function updateStepIndicator(activeIdx, isSounding) {
      for (let i = 0; i < 4; i++) {
        const el = document.getElementById(`ind-${i}`);
        if (!el) continue;
        el.className = 'watch-ind-step';
        if (i === activeIdx && isSounding) el.classList.add('active');
      }
    }

    function triggerStep() {
      if (!isRunning || isSystemInterrupted || isAutoPausedNow) return;
      const stepInCycle = currentBeatIndex % 4;
      const playSound = shouldPlaySoundInPattern(stepInCycle);
      if (playSound) playBeep();
      updateStepIndicator(stepInCycle, playSound);
      currentBeatIndex = (currentBeatIndex + 1) % 4;
    }

    function clearAllTimers() {
      if (beatTimer) { clearInterval(beatTimer); beatTimer = null; }
      if (clockTimer) { clearInterval(clockTimer); clockTimer = null; }
    }

    function syncBpmTimer() {
      if (beatTimer) clearInterval(beatTimer);
      if (isRunning && !isSystemInterrupted && !isAutoPausedNow && currentStepData) {
        beatTimer = setInterval(triggerStep, (60 / currentStepData.bpm) * 1000);
      }
    }

    function applyCurrentStepToView(step, stepIdx) {
      currentStepData = step;
      targetBpmDisplay.textContent = step.bpm;
      runZoneBadge.textContent = `ZONE.${stepIdx + 1}`;
      const meterInfo = METERS[step.meter] || METERS['p1'];
      runSoundAndMeter.textContent = `${step.sound.toUpperCase()} | ${meterInfo.label}`;
    }

    function evaluateRoutine(currentSec) {
      if (!routine || routine.length === 0) return;
      let accumulatedSec = 0;
      for (let i = 0; i < routine.length; i++) {
        accumulatedSec += routine[i].durationSec;
        if (currentSec < accumulatedSec) {
          const remainingSec = accumulatedSec - currentSec;
          stepRemainingText.textContent = `${i + 1}구간 진행 중 (${formatSecToMinSec(remainingSec)} 남음)`;

          if (remainingSec <= 3 && remainingSec > 0 && currentSec !== lastSecondReported) {
            playCueSound('countdown');
            lastSecondReported = currentSec;
          }

          if (currentStepIndex !== i) {
            currentStepIndex = i;
            applyCurrentStepToView(routine[i], i);
            playCueSound('next_step');
            syncBpmTimer();
          }
          return;
        }
      }
      playCueSound('complete');
      finishRun();
    }

    function pauseTimingAndBeats() {
      baseOffsetMs = elapsedMs;
      clearAllTimers();
      for (let i = 0; i < 4; i++) document.getElementById(`ind-${i}`).className = 'watch-ind-step';
    }

    function resumeTimingAndBeats() {
      startTimeMs = performance.now();
      lastDistanceTickTime = performance.now();
      clockTimer = setInterval(() => {
        const now = performance.now();
        elapsedMs = baseOffsetMs + (now - startTimeMs);
        runTimerDisplay.textContent = formatPrecisionTimer(elapsedMs);
        evaluateRoutine(Math.floor(elapsedMs / 1000));
        processDeadReckoningDistance(now);
        checkDistanceAutoPause(now);
      }, 50);
      syncBpmTimer();
    }

    function processDeadReckoningDistance(currentTimeMs) {
      if (!isRunning || isAutoPausedNow) {
        lastDistanceTickTime = currentTimeMs;
        return;
      }
      const deltaSec = (currentTimeMs - lastDistanceTickTime) / 1000;
      lastDistanceTickTime = currentTimeMs;

      if (currentTimeMs - lastGpsUpdateTime > 3000 && deltaSec > 0 && deltaSec < 5.0) {
        if (currentCalculatedSpm >= 120) {
          const estimatedStride = Math.min(Math.max((currentCalculatedSpm / 180) * 0.95, 0.7), 1.25);
          const activeSpeed = (currentCalculatedSpm / 60) * estimatedStride;
          addDistance(activeSpeed * deltaSec);
        }
      }
    }

    function checkDistanceAutoPause(now) {
      if (!isAutoPauseEnabled || !isRunning) return;

      if (totalDistanceMeters - lastTrackedDistance >= 0.5) {
        lastTrackedDistance = totalDistanceMeters;
        lastDistanceChangeTime = now;
      } else {
        if (!isAutoPausedNow && (now - lastDistanceChangeTime >= AUTO_PAUSE_FREEZE_LIMIT_MS)) {
          triggerAutoPause();
        }
      }
    }

    function showRunningControlsUI() {
      runningBar.style.display = 'flex';
      pausedSplitBar.style.display = 'none';
    }

    function showPausedControlsUI() {
      runningBar.style.display = 'none';
      pausedSplitBar.style.display = 'flex';
    }

    function startRunLoop() {
      initAudio();
      startSilentAudio();
      initMotionSensor();
      initGeolocation();
      isRunning = true;
      isSystemInterrupted = false;
      isAutoPausedNow = false;
      autoPauseStatusPill.style.display = 'none';

      if (!runSessionStartTime) {
        runSessionStartTime = new Date();
      }

      showRunningControlsUI();

      const now = performance.now();
      startTimeMs = now;
      lastDistanceTickTime = now;
      lastDistanceChangeTime = now;
      lastTrackedDistance = totalDistanceMeters;

      clockTimer = setInterval(() => {
        const currentNow = performance.now();
        elapsedMs = baseOffsetMs + (currentNow - startTimeMs);
        runTimerDisplay.textContent = formatPrecisionTimer(elapsedMs);
        evaluateRoutine(Math.floor(elapsedMs / 1000));
        processDeadReckoningDistance(currentNow);
        checkDistanceAutoPause(currentNow);
      }, 50);

      syncBpmTimer();
    }

    function pauseRun() {
      isRunning = false;
      baseOffsetMs = elapsedMs;
      clearAllTimers();
      stopSilentAudio();
      stopGeolocation();
      for (let i = 0; i < 4; i++) document.getElementById(`ind-${i}`).className = 'watch-ind-step';
      if (audioCtx && audioCtx.state === 'running') audioCtx.suspend().catch(() => {});
      showPausedControlsUI();
    }

    function onSingleTapPause() {
      triggerHaptic(20);
      pauseRun();
    }

    function onQuickResume() {
      triggerHaptic(20);
      startRunLoop();
    }

    // --- [러닝 종료 및 report.html로 데이터 저장 전달] ---
    function finishRun() {
      triggerHaptic([40, 60, 40]);
      pauseRun();

      // 마지막 잔여 거리 스플릿 추가
      const remainingDistM = totalDistanceMeters - lastSplitDistanceM;
      if (remainingDistM > 50) {
        const splitTimeMs = elapsedMs - lastSplitTimeMs;
        const splitSec = splitTimeMs / 1000;
        const splitPaceSec = (splitSec / (remainingDistM / 1000));

        splits.push({
          km: (totalDistanceMeters / 1000).toFixed(2),
          splitDistanceM: Math.round(remainingDistM),
          splitTimeSec: Math.round(splitSec),
          paceFormatted: formatPace(splitPaceSec),
          avgSpm: currentCalculatedSpm || targetBpmDisplay.textContent,
          isFinalPartial: true
        });
      }

      // 전체 평균 페이스 계산
      const totalKm = totalDistanceMeters / 1000;
      const totalElapsedSec = elapsedMs / 1000;
      const avgPaceSec = totalKm > 0 ? (totalElapsedSec / totalKm) : 0;

      const now = runSessionStartTime || new Date();
      const runRecord = {
        id: 'run_' + Date.now(),
        date: `${now.getFullYear()}.${String(now.getMonth() + 1).padStart(2, '0')}.${String(now.getDate()).padStart(2, '0')}`,
        startTime: `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`,
        routineTitle: runRoutineTitle.textContent,
        totalDistanceKm: (totalDistanceMeters / 1000).toFixed(2),
        totalElapsedMs: elapsedMs,
        totalDurationFormatted: runTimerDisplay.textContent,
        avgPaceFormatted: formatPace(avgPaceSec),
        routineZones: routine.length,
        splits: splits
      };

      try {
        const existing = localStorage.getItem('matempa_run_history');
        const history = existing ? JSON.parse(existing) : [];
        history.unshift(runRecord);
        localStorage.setItem('matempa_run_history', JSON.stringify(history));
        localStorage.setItem('matempa_last_completed_id', runRecord.id);
      } catch (e) {
        console.error("데이터 저장 실패", e);
      }

      window.location.href = 'report.html';
    }

    // FINISH 1.25초 홀드 제어
    const FINISH_CIRCUMFERENCE = 2 * Math.PI * 30; 
    const FINISH_HOLD_DURATION_MS = 1250; 

    function setupFinishHoldButton(buttonEl, progressEl, onCompleteCallback) {
      let holdTimer = null;
      let holdStartTime = 0;

      const setProgress = (percent) => {
        const offset = FINISH_CIRCUMFERENCE - (percent / 100) * FINISH_CIRCUMFERENCE;
        progressEl.style.strokeDashoffset = offset;
      };

      const updateProgress = (timestamp) => {
        const elapsed = timestamp - holdStartTime;
        const percent = Math.min((elapsed / FINISH_HOLD_DURATION_MS) * 100, 100);
        setProgress(percent);

        if (percent < 100) {
          holdTimer = requestAnimationFrame(updateProgress);
        } else {
          cancelHold();
          triggerHaptic([30, 40, 30]);
          onCompleteCallback();
        }
      };

      const startHold = (e) => {
        e.preventDefault();
        triggerHaptic(15);
        holdStartTime = performance.now();
        holdTimer = requestAnimationFrame(updateProgress);
      };

      const cancelHold = () => {
        if (holdTimer) {
          cancelAnimationFrame(holdTimer);
          holdTimer = null;
        }
        setProgress(0);
      };

      buttonEl.addEventListener('pointerdown', startHold);
      buttonEl.addEventListener('pointerup', cancelHold);
      buttonEl.addEventListener('pointerleave', cancelHold);
      buttonEl.addEventListener('pointercancel', cancelHold);
    }

    setupFinishHoldButton(finishHoldBtn, finishHoldProgress, () => {
      finishRun();
    });

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) {
        lastDistanceTickTime = performance.now();
        if (isRunning && audioCtx && audioCtx.state === 'suspended' && !isSystemInterrupted && !isAutoPausedNow) {
          audioCtx.resume().catch(() => {});
        }
      }
    });

    window.onload = () => {
      loadSavedSoundSettings();

      try {
        const slot = localStorage.getItem('matempa_active_slot');
        if (slot !== null) activeSlot = parseInt(slot);

        const customTitle = localStorage.getItem(`matempa_routine_name_${activeSlot}`);
        runRoutineTitle.textContent = customTitle ? customTitle : `ROUTINE #${activeSlot + 1}`;

        const saved = localStorage.getItem(`matempa_routine_slot_${activeSlot}`);
        if (saved) routine = JSON.parse(saved);
        else routine = [];
      } catch (e) {
        routine = [];
      }

      if (!routine || routine.length === 0) {
        alert("등록된 구간 데이터가 없습니다. 설정 화면으로 돌아갑니다.");
        window.location.href = 'main.html';
        return;
      }

      currentStepIndex = 0;
      applyCurrentStepToView(routine[0], 0);
      playCueSound('next_step');
      startRunLoop();
    };
  </script>
</body>
</html>
