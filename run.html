<!-- 원형 게이지 홀드 버튼 구조 -->
<div class="hold-btn-wrapper" id="holdBtnWrapper">
  <svg class="hold-svg" viewBox="0 0 100 100">
    <circle class="hold-track" cx="50" cy="50" r="44"></circle>
    <circle class="hold-progress" id="holdProgress" cx="50" cy="50" r="44"></circle>
  </svg>
  <button class="hold-core-btn" id="holdCoreBtn">
    <span id="holdBtnLabel">PAUSE</span>
  </button>
</div>

<style>
  .hold-btn-wrapper {
    position: relative;
    width: 84px;
    height: 84px;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    -webkit-user-select: none;
  }

  .hold-svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    transform: rotate(-90deg); /* 12시 방향부터 채워지도록 회전 */
    pointer-events: none;
  }

  .hold-track {
    fill: none;
    stroke: rgba(255, 255, 255, 0.12);
    stroke-width: 5;
  }

  .hold-progress {
    fill: none;
    stroke: #34c759; /* 러닝 재개 시 #34c759, 일시정지 시 #ff9500 */
    stroke-width: 5;
    stroke-linecap: round;
    stroke-dasharray: 276.46; /* 2 * PI * 44 */
    stroke-dashoffset: 276.46;
    transition: stroke-dashoffset 0.05s linear;
  }

  .hold-core-btn {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    border: none;
    background: #ffffff;
    color: #111111;
    font-size: 0.8rem;
    font-weight: 900;
    letter-spacing: 0.5px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.4);
    transition: transform 0.1s ease;
  }

  .hold-core-btn:active {
    transform: scale(0.92);
  }
</style>
