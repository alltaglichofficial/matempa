<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MA.TEMPA - RUN</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0b0b0c">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: #0b0b0c;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 100vh;
      padding: 1.2rem 1.2rem 2.2rem 1.2rem;
      user-select: none;
      -webkit-user-select: none;
      letter-spacing: -0.3px;
    }

    .app-screen {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: space-between;
      align-items: center;
      position: relative;
    }

    .run-header { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.8rem; }
    .routine-name-badge { font-size: 0.95rem; font-weight: 800; color: #8e8e93; letter-spacing: 0.5px; }

    .auto-pause-toggle-btn {
      background: rgba(255, 255, 255, 0.08); color: #8e8e93; border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 6px 12px; border-radius: 12px; font-size: 0.72rem; font-weight: 800; cursor: pointer;
      display: flex; align-items: center; gap: 6px; transition: all 0.2s ease;
    }
    .auto-pause-toggle-btn.active { background: rgba(52, 199, 89, 0.16); color: #34c759; border-color: rgba(52, 199, 89, 0.35); }
    .auto-pause-dot { width: 6px; height: 6px; border-radius: 50%; background: #8e8e93; }
    .auto-pause-toggle-btn.active .auto-pause-dot { background: #34c759; box-shadow: 0 0 6px rgba(52, 199, 89, 0.8); }

    .watch-display-large {
      width: 100%; height: 500px; background: linear-gradient(180deg, #161618 0%, #0d0d0e 100%);
      border-radius: 46px; padding: 20px 18px 18px 18px; display: flex; flex-direction: column;
      justify-content: space-between; align-items: center; box-shadow: 0 24px 50px -10px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.15);
      position: relative;
    }

    .top-stat-row { width: 100%; display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; color: #8e8e93; font-weight: 700; padding: 0 4px; }
    .zone-indicator-pill { background: rgba(52, 199, 89, 0.15); color: #34c759; padding: 3px 10px; border-radius: 8px; font-weight: 800; }
    .auto-pause-status-pill {
      display: none; background: rgba(255, 149, 0, 0.18); color: #ff9500; padding: 3px 10px;
      border-radius: 8px; font-weight: 800; font-size: 0.68rem; letter-spacing: 0.5px; animation: blink 1s infinite alternate;
    }
    @keyframes blink { from { opacity: 0.5; } to { opacity: 1; } }

    .cadence-comparison-grid { width: 100%; display: flex; align-items: center; justify-content: space-between; margin-top: 0.2rem; padding: 0 4px; }
    .cadence-col { display: flex; flex-direction: column; align-items: center; flex: 1; }
    .cadence-num { font-size: 2.6rem; font-weight: 900; line-height: 0.95; font-variant-numeric: tabular-nums; letter-spacing: -1.5px; }
    .cadence-num.target { color: #ffffff; filter: drop-shadow(0 4px 12px rgba(255, 255, 255, 0.1)); }
    .cadence-num.live { color: #34c759; filter: drop-shadow(0 4px 12px rgba(52, 199, 89, 0.25)); }
    .cadence-num.pace { color: #ff9f0a; font-size: 2.35rem; letter-spacing: -1px; filter: drop-shadow(0 4px 12px rgba(255, 159, 10, 0.25)); }
    .cadence-col-label { font-size: 0.58rem; font-weight: 800; letter-spacing: 0.8px; margin-top: 4px; color: #8e8e93; white-space: nowrap; }
    .cadence-divider { width: 1px; height: 42px; background: rgba(255, 255, 255, 0.12); }

    .distance-hero-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0.2rem 0; }
    .distance-hero-num { font-size: 3.6rem; font-weight: 900; line-height: 0.9; color: #007aff; font-variant-numeric: tabular-nums; letter-spacing: -1.8px; filter: drop-shadow(0 6px 16px rgba(0, 122, 255, 0.35)); }
    .distance-hero-unit { font-size: 0.75rem; font-weight: 900; color: #8e8e93; letter-spacing: 1.5px; margin-top: 4px; }

    .step-progress-text { font-size: 0.78rem; color: #a0a0a5; font-weight: 600; }
    .timer-capsule-large {
      background: rgba(255, 255, 255, 0.06); width: 220px; height: 42px; border-radius: 21px;
      display: flex; align-items: center; justify-content: center; color: #ffffff; font-size: 1.28rem;
      font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: 1px; border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.3);
    }

    .watch-indicators { display: flex; gap: 8px; margin-bottom: 4px; }
    .watch-ind-step { width: 24px; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.1); transition: background 0.08s, box-shadow 0.08s; }
    .watch-ind-step.active { background: #34c759; box-shadow: 0 0 12px rgba(52, 199, 89, 0.9); }

    .inline-sound-control-card { width: 100%; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 18px; padding: 8px 12px; display: flex; flex-direction: column; gap: 6px; }
    .sound-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .sound-label { font-size: 0.65rem; font-weight: 800; color: #8e8e93; min-width: 44px; }
    .sound-value-text { font-size: 0.65rem; font-weight: 800; color: #34c759; min-width: 32px; text-align: right; font-variant-numeric: tabular-nums; }
    .inline-slider { -webkit-appearance: none; flex: 1; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.16); outline: none; }
    .inline-slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #ffffff; cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,0.5); }

    .controls-wrapper { width: 100%; height: 76px; margin-top: 0.8rem; display: flex; align-items: center; justify-content: center; }
    .running-bar { width: 100%; display: flex; }
    .single-tap-pause-btn { width: 100%; height: 58px; background: #ffffff; color: #111111; border: none; border-radius: 29px; font-size: 1.05rem; font-weight: 900; letter-spacing: 0.5px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 20px rgba(255, 255, 255, 0.12); transition: transform 0.12s ease; }
    .single-tap-pause-btn:active { transform: scale(0.96); }

    .paused-split-bar { width: 100%; display: none; align-items: center; justify-content: space-between; gap: 12px; }
    .btn-quick-resume { flex: 1.2; height: 58px; background: #34c759; color: #ffffff; border: none; border-radius: 29px; font-size: 0.95rem; font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 20px rgba(52, 199, 89, 0.25); transition: transform 0.12s ease; }
    .btn-quick-resume:active { transform: scale(0.95); }

    .finish-hold-wrap { position: relative; width: 68px; height: 68px; display: flex; align-items: center; justify-content: center; touch-action: none; }
    .finish-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: rotate(-90deg); pointer-events: none; }
    .finish-track { fill: none; stroke: rgba(255, 255, 255, 0.12); stroke-width: 4; }
    .finish-progress { fill: none; stroke: #ff3b30; stroke-width: 4; stroke-linecap: round; stroke-dasharray: 188.49; stroke-dashoffset: 188.49; transition: stroke-dashoffset 0.04s linear; }
    .finish-core-btn { width: 56px; height: 56px; border-radius: 50%; border: 1px solid rgba(255, 59, 48, 0.4); background: rgba(255, 59, 48, 0.18); color: #ff3b30; font-size: 0.72rem; font-weight: 900; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: transform 0.1s ease; }
    .finish-core-btn:active { transform: scale(0.92); }
    .finish-sub-text { font-size: 0.5rem; opacity: 0.8; margin-top: 1px; }

    .confirm-modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); z-index: 1000; align-items: center; justify-content: center; padding: 1.5rem; }
    .confirm-modal-box { width: 100%; max-width: 310px; background: #1c1c1e; border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 24px; padding: 1.5rem 1.2rem 1.2rem 1.2rem; text-align: center; display: flex; flex-direction: column; gap: 1.2rem; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6); }
    .confirm-modal-title { font-size: 1.05rem; font-weight: 800; color: #ffffff; line-height: 1.4; }
    .confirm-modal-btn-group { display: flex; gap: 8px; }
    .modal-btn { flex: 1; height: 46px; border-radius: 23px; border: none; font-size: 0.9rem; font-weight: 800; cursor: pointer; transition: transform 0.1s ease; }
    .modal-btn:active { transform: scale(0.95); }
    .btn-modal-cancel { background: #34c759; color: #ffffff; }
    .btn-modal-confirm { background: rgba(255, 59, 48, 0.2); color: #ff3b30; border: 1px solid rgba(255, 59, 48, 0.4); }
  </style>
</head>
<body>

  <div class="app-screen">

    <div class="run-header">
      <div class="header-left-wrap">
        <span class="routine-name-badge" id="runRoutineTitle">ROUTINE #1</span>
      </div>
      <button class="auto-pause-toggle-btn active" id="autoPauseToggleBtn" onclick="toggleAutoPauseOption()">
        <span class="auto-pause-dot"></span>
        <span id="autoPauseText">AUTO PAUSE ON</span>
      </button>
    </div>

    <div class="watch-display-large">
      <div class="top-stat-row">
        <span class="zone-indicator-pill" id="runZoneBadge">ZONE.1</span>
        <span class="auto-pause-status-pill" id="autoPauseStatusPill">⏸ AUTO PAUSED</span>
        <span id="runSoundAndMeter">WOOD | ●●●●</span>
      </div>

      <div class="cadence-comparison-grid">
        <div class="cadence-col">
          <div class="cadence-num target" id="targetBpmDisplay">180</div>
          <span class="cadence-col-label">TARGET</span>
        </div>
        <div class="cadence-divider"></div>
        <div class="cadence-col">
          <div class="cadence-num live" id="liveCadenceDisplay">--</div>
          <span class="cadence-col-label">SPM</span>
        </div>
        <div class="cadence-divider"></div>
        <div class="cadence-col">
          <div class="cadence-num pace" id="livePaceDisplay">--'--"</div>
          <span class="cadence-col-label">PACE /KM</span>
        </div>
      </div>

      <div class="distance-hero-wrap">
        <div class="distance-hero-num" id="liveDistanceDisplay">0.00</div>
        <div class="distance-hero-unit">KILOMETERS</div>
      </div>

      <div class="step-progress-text" id="stepRemainingText">남은 시간 계산 중...</div>
      <div class="timer-capsule-large" id="runTimerDisplay">0:00:00:00</div>

      <div class="watch-indicators">
        <div class="watch-ind-step" id="ind-0"></div>
        <div class="watch-ind-step" id="ind-1"></div>
        <div class="watch-ind-step" id="ind-2"></div>
        <div class="watch-ind-step" id="ind-3"></div>
      </div>

      <div class="inline-sound-control-card">
        <div class="sound-row">
          <span class="sound-label">VOL</span>
          <input type="range" class="inline-slider" id="inlineVolSlider" min="0" max="100" value="100" oninput="updateInlineSound()">
          <span class="sound-value-text" id="inlineVolText">100%</span>
        </div>
        <div class="sound-row">
          <span class="sound-label">PITCH</span>
          <input type="range" class="inline-slider" id="inlinePitchSlider" min="50" max="150" value="100" oninput="updateInlineSound()">
          <span class="sound-value-text" id="inlinePitchText">1.0x</span>
        </div>
      </div>
    </div>

    <div class="controls-wrapper">
      <div class="running-bar" id="runningBar">
        <button class="single-tap-pause-btn" id="singleTapPauseBtn" onclick="onSingleTapPause()">PAUSE ||</button>
      </div>
      <div class="paused-split-bar" id="pausedSplitBar">
        <button class="btn-quick-resume" onclick="onQuickResume()">RESUME ▶</button>
        <div class="finish-hold-wrap" id="finishHoldWrap">
          <svg class="finish-svg" viewBox="0 0 68 68">
            <circle class="finish-track" cx="34" cy="34" r="30"></circle>
            <circle class="finish-progress" id="finishHoldProgress" cx="34" cy="34" r="30"></circle>
          </svg>
          <button class="finish-core-btn" id="finishHoldBtn">
            <span>FINISH</span>
            <span class="finish-sub-text">1.25s</span>
          </button>
        </div>
      </div>
    </div>

    <div class="confirm-modal-overlay" id="deleteConfirmModal">
      <div class="confirm-modal-box">
        <div class="confirm-modal-title">기록을 어떻게 할까요?</div>
        <div class="confirm-modal-btn-group">
          <button class="modal-btn btn-modal-confirm" onclick="onDiscardRun()">취소 (삭제)</button>
          <button class="modal-btn btn-modal-cancel" onclick="onSaveRun()">확인 (저장)</button>
        </div>
      </div>
    </div>

  </div>

  <audio id="silentBackgroundAudio" loop playsinline style="display: none;"></audio>

  <script>
    // ==========================================
    // MA.TEMPA RUN ENGINE
    // WEB GPS + RESPONSIVE CADENCE ENGINE
    // ==========================================

    let isRunning = false;
    let isUserPaused = false;
    let isAutoPauseEnabled = true;
    let isAutoPausedNow = false;

    // ==========================================
    // DOM
    // ==========================================

    const runRoutineTitle = document.getElementById('runRoutineTitle');
    const autoPauseToggleBtn = document.getElementById('autoPauseToggleBtn');
    const autoPauseText = document.getElementById('autoPauseText');
    const autoPauseStatusPill = document.getElementById('autoPauseStatusPill');

    const runZoneBadge = document.getElementById('runZoneBadge');
    const runSoundAndMeter = document.getElementById('runSoundAndMeter');
    const targetBpmDisplay = document.getElementById('targetBpmDisplay');
    const liveCadenceDisplay = document.getElementById('liveCadenceDisplay');
    const livePaceDisplay = document.getElementById('livePaceDisplay');
    const liveDistanceDisplay = document.getElementById('liveDistanceDisplay');
    const stepRemainingText = document.getElementById('stepRemainingText');
    const runTimerDisplay = document.getElementById('runTimerDisplay');
    const silentAudioEl = document.getElementById('silentBackgroundAudio');

    const inlineVolSlider = document.getElementById('inlineVolSlider');
    const inlinePitchSlider = document.getElementById('inlinePitchSlider');
    const inlineVolText = document.getElementById('inlineVolText');
    const inlinePitchText = document.getElementById('inlinePitchText');

    // ==========================================
    // ROUTINE / AUDIO STATE
    // ==========================================

    let activeSlot = 0;
    let routine = [];
    let currentStepIndex = 0;
    let currentBeatIndex = 0;
    let currentStepData = null;

    let runVolumeMultiplier = 1.0;
    let runPitchMultiplier = 1.0;
    let lastSecondReported = -1;

    let audioCtx = null;
    let beatTimer = null;
    let clockTimer = null;
    let startTimeMs = 0;
    let baseOffsetMs = 0;
    let elapsedMs = 0;

    const METERS = {
      'p1': { label: '●●●●', pattern: [1, 1, 1, 1] },
      'p2': { label: '●○●○', pattern: [1, 0, 1, 0] },
      'p3': { label: '●○●●', pattern: [1, 0, 1, 1] },
      'p4': { label: '●●○●', pattern: [1, 1, 0, 1] },
      'p5': { label: '●●●○', pattern: [1, 1, 1, 0] }
    };

    // ==========================================
    // DISTANCE ENGINE
    // GPS 우선 / GPS 끊김 시 보폭 fallback
    // ==========================================

    let distanceMeters = 0;
    let gpsDistanceMeters = 0;
    let stepDerivedDistance = 0;
    let distanceMode = 'gps';
    let runStartWallTime = 0;

    let lastLat = null;
    let lastLon = null;
    let lastGpsTime = null;
    let gpsWatchId = null;
    let currentSpeedMs = 0;
    let gpsAccuracy = Infinity;
    let lastGoodGpsTime = 0;

    const GPS_MAX_ACCURACY = 35;
    const GPS_GOOD_ACCURACY = 20;
    const GPS_STALE_MS = 4500;
    const GPS_MIN_DISTANCE = 1.5;
    const GPS_MAX_SPEED = 8.5; // 약 30.6 km/h
    const STRIDE_LENGTH = 0.75;

    // ==========================================
    // RESPONSIVE CADENCE ENGINE
    // ==========================================

    let dynamicGravity = 9.8;
    let prevAccSignal = 0;
    let smoothedAccSignal = 0;
    let isSignalRising = false;

    let lastStepTime = 0;
    let lastValidStepTime = 0;
    let totalSteps = 0;
    let stepsInLastSec = 0;

    let currentSPM = 0;
    let cadenceIntervals = [];

    // 240 SPM = 250ms 간격. 실제 검출 안정성을 위해 약간 여유를 둠.
    const MIN_STEP_INTERVAL = 250;
    const MAX_STEP_INTERVAL = 1100;

    // 최근 3개 interval의 median을 사용하되, EMA는 사용하지 않음.
    // 그래서 180 SPM에 도달하면 점진적으로 올라가지 않고 바로 180 근처로 표시됨.
    const CADENCE_SAMPLE_COUNT = 3;

    // 마지막 걸음 후 이 시간이 지나면 화면을 0으로 처리
    const CADENCE_TIMEOUT_MS = 1600;

    // 센서별 오차를 고려한 발구름 검출 기준
    const BASE_PEAK_THRESHOLD = 0.75;
    const MAX_PEAK_THRESHOLD = 2.6;

    // 오토포즈는 cadence 숫자 자체가 아니라 실제 마지막 움직임으로 판단
    const AUTO_PAUSE_DELAY_MS = 1800;
    const AUTO_RESUME_STEP_COUNT = 1;

    // ==========================================
    // AUDIO ENGINE
    // ==========================================

    function initAudio() {
      if (!audioCtx) {
        const AudioClass = window.AudioContext || window.webkitAudioContext;
        if (AudioClass) {
          try {
            audioCtx = new AudioClass({ latencyHint: 'interactive' });
          } catch (e) {
            audioCtx = new AudioClass();
          }

          audioCtx.onstatechange = () => {
            if (isRunning && !isUserPaused && !isAutoPausedNow) {
              if (audioCtx.state === 'suspended' || audioCtx.state === 'interrupted') {
                audioCtx.resume().catch(() => {});
              }
            }
          };
        }
      }

      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
      }
    }

    function playBeep() {
      initAudio();
      if (!audioCtx || !currentStepData || isAutoPausedNow || !isRunning || isUserPaused) return;

      const now = audioCtx.currentTime;
      const vol = (currentStepData.vol !== undefined ? currentStepData.vol : 0.8) * runVolumeMultiplier;
      const basePitch = (currentStepData.pitch !== undefined ? currentStepData.pitch : 440) * runPitchMultiplier;
      const soundType = currentStepData.sound || 'wood';

      if (soundType === 'drum') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(Math.max(basePitch * 0.35, 120), now);
        osc.frequency.exponentialRampToValueAtTime(38, now + 0.08);
        gain.gain.setValueAtTime(vol * 1.2, now);
        gain.gain.linearRampToValueAtTime(0.0001, now + 0.09);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(now); osc.stop(now + 0.09);

        const clickOsc = audioCtx.createOscillator();
        const clickGain = audioCtx.createGain();
        clickOsc.type = 'triangle';
        clickOsc.frequency.setValueAtTime(800 * runPitchMultiplier, now);
        clickOsc.frequency.exponentialRampToValueAtTime(100, now + 0.02);
        clickGain.gain.setValueAtTime(vol * 0.7, now);
        clickGain.gain.linearRampToValueAtTime(0.0001, now + 0.02);
        clickOsc.connect(clickGain); clickGain.connect(audioCtx.destination);
        clickOsc.start(now); clickOsc.stop(now + 0.02);
        return;
      }

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      let dur = 0.05, startFreq = basePitch, wave = 'triangle';

      if (soundType === 'bass') { wave = 'sine'; startFreq = basePitch * 0.3; dur = 0.08; }
      else if (soundType === 'wood') { wave = 'triangle'; startFreq = basePitch; dur = 0.04; }
      else if (soundType === 'beep') { wave = 'sine'; startFreq = basePitch; dur = 0.06; }
      else { wave = 'square'; startFreq = basePitch; dur = 0.02; }

      osc.type = wave;
      osc.frequency.setValueAtTime(startFreq, now);
      gain.gain.setValueAtTime(vol * 0.8, now);
      gain.gain.linearRampToValueAtTime(0.0001, now + dur);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now); osc.stop(now + dur);
    }

    function playCueSound(type) {
      initAudio();
      if (!audioCtx || isAutoPausedNow || !isRunning || isUserPaused) return;

      const now = audioCtx.currentTime;
      const vol = 0.8 * runVolumeMultiplier;
      const pitchFactor = runPitchMultiplier;

      if (type === 'countdown') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(900 * pitchFactor, now);
        gain.gain.setValueAtTime(vol * 0.9, now);
        gain.gain.linearRampToValueAtTime(0.0001, now + 0.08);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(now); osc.stop(now + 0.08);
      } else if (type === 'next_step') {
        [{ f: 880, t: 0 }, { f: 1320, t: 0.12 }].forEach(tone => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(tone.f * pitchFactor, now + tone.t);
          gain.gain.setValueAtTime(vol * 0.9, now + tone.t);
          gain.gain.linearRampToValueAtTime(0.0001, now + tone.t + 0.22);
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(now + tone.t); osc.stop(now + tone.t + 0.22);
        });
      } else if (type === 'complete') {
        [{ f: 659.25, t: 0 }, { f: 880, t: 0.15 }, { f: 1318.5, t: 0.3 }].forEach(tone => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(tone.f * pitchFactor, now + tone.t);
          gain.gain.setValueAtTime(vol, now + tone.t);
          gain.gain.linearRampToValueAtTime(0.0001, now + tone.t + 0.4);
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(now + tone.t); osc.stop(now + tone.t + 0.4);
        });
      }
    }

    function shouldPlaySoundInPattern(beatIdx) {
      if (!currentStepData) return true;
      const activeMeter = METERS[currentStepData.meter] || METERS['p1'];
      return activeMeter.pattern[beatIdx % 4] === 1;
    }

    function triggerStep() {
      if (!isRunning || isAutoPausedNow || isUserPaused) return;

      const stepInCycle = currentBeatIndex % 4;
      const playSound = shouldPlaySoundInPattern(stepInCycle);

      if (playSound) playBeep();

      for (let i = 0; i < 4; i++) {
        const el = document.getElementById(`ind-${i}`);
        if (el) {
          el.className = 'watch-ind-step';
          if (i === stepInCycle && playSound) el.classList.add('active');
        }
      }

      currentBeatIndex = (currentBeatIndex + 1) % 4;
    }

    function syncBpmTimer(playImmediate = true) {
      if (beatTimer) {
        clearInterval(beatTimer);
        beatTimer = null;
      }

      if (
        isRunning &&
        !isAutoPausedNow &&
        !isUserPaused &&
        currentStepData &&
        currentStepData.bpm > 0
      ) {
        // 재개 시 첫 비트를 바로 재생.
        // 루틴 구간 전환에서는 next_step cue와 중복되지 않도록 false를 넘길 수 있음.
        if (playImmediate) triggerStep();

        beatTimer = setInterval(
          triggerStep,
          (60 / currentStepData.bpm) * 1000
        );
      }
    }

    // ==========================================
    // ROUTINE
    // ==========================================

    function applyCurrentStepToView(step, stepIdx) {
      currentStepData = step;
      targetBpmDisplay.textContent = step.bpm;
      runZoneBadge.textContent = `ZONE.${stepIdx + 1}`;

      const meterInfo = METERS[step.meter] || METERS['p1'];
      runSoundAndMeter.textContent = `${(step.sound || 'wood').toUpperCase()} | ${meterInfo.label}`;
    }

    function formatSecToMinSec(totalSec) {
      const safeSec = Math.max(0, Math.floor(totalSec));
      const m = Math.floor(safeSec / 60);
      const s = safeSec % 60;
      return m > 0 && s > 0
        ? `${m}분 ${s}초`
        : (m > 0 ? `${m}분` : `${s}초`);
    }

    function evaluateRoutine(currentSec) {
      if (!routine || routine.length === 0) return;

      let accumulatedSec = 0;

      for (let i = 0; i < routine.length; i++) {
        accumulatedSec += routine[i].durationSec;

        if (currentSec < accumulatedSec) {
          const remainingSec = accumulatedSec - currentSec;

          stepRemainingText.textContent =
            `${i + 1}구간 진행 중 (${formatSecToMinSec(remainingSec)} 남음)`;

          if (
            remainingSec <= 3 &&
            remainingSec > 0 &&
            currentSec !== lastSecondReported
          ) {
            playCueSound('countdown');
            lastSecondReported = currentSec;
          }

          if (currentStepIndex !== i) {
            currentStepIndex = i;
            applyCurrentStepToView(routine[i], i);
            playCueSound('next_step');
            syncBpmTimer(false);
          }

          return;
        }
      }

      playCueSound('complete');
      onSingleTapPause();
      document.getElementById('deleteConfirmModal').style.display = 'flex';
    }

    // ==========================================
    // CADENCE HELPERS
    // ==========================================

    function median(values) {
      if (!values || values.length === 0) return 0;

      const sorted = [...values].sort((a, b) => a - b);
      const mid = Math.floor(sorted.length / 2);

      if (sorted.length % 2 === 0) {
        return (sorted[mid - 1] + sorted[mid]) / 2;
      }

      return sorted[mid];
    }

    function calculateCadenceFromIntervals() {
      if (cadenceIntervals.length === 0) return 0;

      // 1개만 잡혀도 바로 표시해서 0 → 목표 케이던스 전환 지연을 없앰
      const representativeInterval = median(cadenceIntervals);

      if (
        representativeInterval < MIN_STEP_INTERVAL ||
        representativeInterval > MAX_STEP_INTERVAL
      ) {
        return 0;
      }

      return Math.max(
        40,
        Math.min(240, 60000 / representativeInterval)
      );
    }

    function updateCadenceDisplay() {
      const now = Date.now();

      if (
        !lastValidStepTime ||
        now - lastValidStepTime > CADENCE_TIMEOUT_MS ||
        isAutoPausedNow ||
        isUserPaused
      ) {
        currentSPM = 0;
        liveCadenceDisplay.textContent = '--';
        return;
      }

      const calculated = calculateCadenceFromIntervals();

      if (calculated > 0) {
        currentSPM = calculated;
        liveCadenceDisplay.textContent = Math.round(calculated);
      } else {
        liveCadenceDisplay.textContent = '--';
      }
    }

    function resetCadenceReference() {
      lastStepTime = 0;
      lastValidStepTime = 0;
      cadenceIntervals = [];
      currentSPM = 0;
      liveCadenceDisplay.textContent = '--';
    }

    function registerStep(timestamp) {
      const interval = lastStepTime > 0
        ? timestamp - lastStepTime
        : 0;

      // 첫 발은 cadence 계산 없이 기준점만 저장
      if (interval === 0) {
        lastStepTime = timestamp;
        lastValidStepTime = timestamp;
        totalSteps++;
        stepsInLastSec++;
        return;
      }

      if (
        interval < MIN_STEP_INTERVAL ||
        interval > MAX_STEP_INTERVAL
      ) {
        // 너무 빠른 중복 피크는 무시.
        // 너무 긴 공백 뒤에는 새 기준점으로만 사용.
        if (interval > MAX_STEP_INTERVAL) {
          cadenceIntervals = [];
        }

        lastStepTime = timestamp;
        lastValidStepTime = timestamp;
        totalSteps++;
        stepsInLastSec++;
        return;
      }

      cadenceIntervals.push(interval);
      if (cadenceIntervals.length > CADENCE_SAMPLE_COUNT) {
        cadenceIntervals.shift();
      }

      lastStepTime = timestamp;
      lastValidStepTime = timestamp;
      totalSteps++;
      stepsInLastSec++;

      currentSPM = calculateCadenceFromIntervals();
      updateCadenceDisplay();
    }

    // ==========================================
    // MOTION SENSOR
    // ==========================================

    window.addEventListener('devicemotion', (event) => {
      if (!isRunning || isUserPaused) return;

      // 가능하면 중력 제거가 끝난 acceleration을 우선 사용.
      // 일부 WebView에서는 acceleration이 비어 있으므로 그 경우
      // accelerationIncludingGravity를 사용해 중력 성분을 제거한다.
      const linearAcc = event.acceleration;
      const gravityAcc = event.accelerationIncludingGravity;

      let rawMagnitude = null;
      let highPassSignal = null;

      if (
        linearAcc &&
        linearAcc.x != null &&
        linearAcc.y != null &&
        linearAcc.z != null
      ) {
        rawMagnitude = Math.sqrt(
          linearAcc.x * linearAcc.x +
          linearAcc.y * linearAcc.y +
          linearAcc.z * linearAcc.z
        );

        // 이미 선형가속도인 경우 별도의 중력 보정이 필요 없다.
        highPassSignal = rawMagnitude;
      } else {
        if (
          !gravityAcc ||
          gravityAcc.x == null ||
          gravityAcc.y == null ||
          gravityAcc.z == null
        ) return;

        rawMagnitude = Math.sqrt(
          gravityAcc.x * gravityAcc.x +
          gravityAcc.y * gravityAcc.y +
          gravityAcc.z * gravityAcc.z
        );

        dynamicGravity =
          dynamicGravity * 0.90 +
          rawMagnitude * 0.10;

        highPassSignal =
          Math.abs(rawMagnitude - dynamicGravity);
      }

      // 센서 잔떨림은 최소한만 줄여 반응 지연을 막는다.
      smoothedAccSignal =
        smoothedAccSignal * 0.55 +
        highPassSignal * 0.45;

      const signal = smoothedAccSignal;
      const now = Date.now();

      // 현재 신호가 상승 중인지 기록
      if (signal > prevAccSignal) {
        isSignalRising = true;
      } else if (isSignalRising && signal < prevAccSignal) {
        isSignalRising = false;

        // 너무 작은 잔떨림만 제외. 실제 발구름은 바로 반영한다.
        const adaptiveThreshold = Math.min(
          MAX_PEAK_THRESHOLD,
          Math.max(BASE_PEAK_THRESHOLD, dynamicGravity > 0 ? BASE_PEAK_THRESHOLD : 0)
        );

        if (
          signal >= adaptiveThreshold &&
          (now - lastStepTime >= MIN_STEP_INTERVAL || lastStepTime === 0)
        ) {
          // 자동 일시정지 중에도 센서 이벤트는 받아서 재개 조건으로 사용
          if (isAutoPausedNow) {
            lastValidStepTime = now;

            // 실제 발구름이 다시 들어오면 자동 재개
            resumeFromAutoPauseByMotion(now);
          } else {
            registerStep(now);
          }
        }
      }

      prevAccSignal = signal;
    });

    // ==========================================
    // GPS
    // ==========================================

    function updateGpsUI(accuracy, speed, status) {
      const gpsDot = document.getElementById('gpsDot');
      const gpsStateText = document.getElementById('gpsStateText');
      const gpsAccSpeed = document.getElementById('gpsAccSpeed');

      if (!gpsDot || !gpsStateText || !gpsAccSpeed) return;

      if (status === 'good') {
        gpsDot.className = accuracy <= GPS_GOOD_ACCURACY ? 'gps-dot ok' : 'gps-dot';
        gpsStateText.textContent = accuracy <= GPS_GOOD_ACCURACY ? 'GPS 양호' : 'GPS 연결됨';
        gpsAccSpeed.textContent = `±${accuracy.toFixed(0)}m / ${(speed * 3.6).toFixed(1)} km/h`;
      } else if (status === 'searching') {
        gpsDot.className = 'gps-dot';
        gpsStateText.textContent = 'GPS 연결 중...';
        gpsAccSpeed.textContent = accuracy < Infinity ? `±${accuracy.toFixed(0)}m / 보정 중` : '-- m / --';
      } else if (status === 'error') {
        gpsDot.className = 'gps-dot bad';
        gpsStateText.textContent = 'GPS 사용 불가';
        gpsAccSpeed.textContent = '걸음 센서로 측정 중';
      }
    }

    function handleGPSPosition(pos) {
      if (!isRunning || isUserPaused) return;

      const coords = pos.coords;
      const lat = Number(coords.latitude);
      const lon = Number(coords.longitude);
      const accuracy = Number(coords.accuracy);
      const now = Date.now();

      if (
        !Number.isFinite(lat) ||
        !Number.isFinite(lon) ||
        !Number.isFinite(accuracy)
      ) {
        return;
      }

      let speed = Number(coords.speed);
      if (!Number.isFinite(speed) || speed < 0) speed = 0;

      gpsAccuracy = accuracy;
      currentSpeedMs = speed;

      if (accuracy > GPS_MAX_ACCURACY) {
        updateGpsUI(accuracy, speed, 'searching');

        // 기준 좌표는 지우지 않는다.
        // GPS가 잠깐 나빠졌다가 돌아와도 기준점이 깨지지 않게 함.
        if (now - lastGoodGpsTime > GPS_STALE_MS) {
          distanceMode = 'step';
        }

        return;
      }

      updateGpsUI(accuracy, speed, 'good');
      lastGoodGpsTime = now;

      // step fallback에서 GPS로 돌아올 때 첫 좌표는 새 기준점으로만 사용
      if (
        distanceMode === 'step' ||
        lastLat === null ||
        lastLon === null ||
        lastGpsTime === null
      ) {
        lastLat = lat;
        lastLon = lon;
        lastGpsTime = now;
        distanceMode = 'gps';
        return;
      }

      const dist = calculateDistance(lastLat, lastLon, lat, lon);
      const elapsedSec = Math.max((now - lastGpsTime) / 1000, 0.1);
      const calculatedSpeed = dist / elapsedSec;

      // GPS 튐 방지
      if (
        dist >= GPS_MIN_DISTANCE &&
        calculatedSpeed <= GPS_MAX_SPEED
      ) {
        if (!isAutoPausedNow) {
          gpsDistanceMeters += dist;
          distanceMeters = gpsDistanceMeters;
        }

        lastLat = lat;
        lastLon = lon;
        lastGpsTime = now;
      }

      // 정확한 GPS가 있고 최근에 속도가 확인되면 이동 중으로 간주
      if (
        accuracy <= GPS_MAX_ACCURACY &&
        speed >= 0.8 &&
        !isAutoPausedNow
      ) {
        lastMovementTime = now;
      }
    }

    function handleGPSError(err) {
      if (err && err.code === 1) {
        updateGpsUI(Infinity, 0, 'error');
      } else {
        updateGpsUI(gpsAccuracy, 0, 'searching');
      }
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const rLat1 = lat1 * Math.PI / 180;
      const rLat2 = lat2 * Math.PI / 180;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;

      const a =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(rLat1) *
        Math.cos(rLat2) *
        Math.sin(dLon / 2) ** 2;

      return R * 2 * Math.atan2(
        Math.sqrt(a),
        Math.sqrt(1 - a)
      );
    }

    function startGPS() {
      if (!navigator.geolocation) {
        handleGPSError({ code: 2 });
        return;
      }

      updateGpsUI(Infinity, 0, 'searching');

      gpsWatchId = navigator.geolocation.watchPosition(
        handleGPSPosition,
        handleGPSError,
        {
          enableHighAccuracy: true,
          maximumAge: 1000,
          timeout: 10000
        }
      );
    }

    // ==========================================
    // MOVEMENT / AUTO PAUSE
    // ==========================================

    let lastMovementTime = 0;

    function resumeFromAutoPauseByMotion(now) {
      if (!isAutoPausedNow || isUserPaused) return;

      // 센서 1회로 바로 재개하되, 현재 좌표는 새 기준점으로 시작
      isAutoPausedNow = false;
      autoPauseStatusPill.style.display = 'none';

      lastLat = null;
      lastLon = null;
      lastGpsTime = null;
      lastGoodGpsTime = now;

      lastMovementTime = now;
      resetCadenceReference();
      resumeRoutineTimers();

      if (navigator.vibrate) navigator.vibrate(20);
    }

    function triggerAutoPause() {
      if (isAutoPausedNow || isUserPaused) return;

      isAutoPausedNow = true;
      autoPauseStatusPill.style.display = 'inline-block';
      pauseRoutineTimers();

      if (navigator.vibrate) navigator.vibrate(30);
    }

    // ==========================================
    // 1 SECOND MAIN LOOP
    // ==========================================

    setInterval(() => {
      if (!isRunning || isUserPaused) return;

      const now = Date.now();

      // ----------------------------------------
      // 1. CADENCE TIMEOUT
      // ----------------------------------------

      updateCadenceDisplay();

      // ----------------------------------------
      // 2. DISTANCE FALLBACK
      // ----------------------------------------

      if (
        (lastGoodGpsTime === 0 && now - runStartWallTime > GPS_STALE_MS) ||
        (lastGoodGpsTime > 0 && now - lastGoodGpsTime > GPS_STALE_MS)
      ) {
        const stepIncrement = stepsInLastSec * STRIDE_LENGTH;
        if (stepIncrement > 0 && !isAutoPausedNow) {
          stepDerivedDistance += stepIncrement;
          distanceMeters = gpsDistanceMeters + stepDerivedDistance;
        }
      }

      stepsInLastSec = 0;
      liveDistanceDisplay.textContent =
        (distanceMeters / 1000).toFixed(2);

      // ----------------------------------------
      // 3. PACE
      // ----------------------------------------

      let effectiveSpeed = 0;

      if (currentSpeedMs > 0.5) {
        effectiveSpeed = currentSpeedMs;
      } else if (currentSPM > 0) {
        effectiveSpeed =
          (currentSPM / 60) * STRIDE_LENGTH;
      }

      if (
        !isAutoPausedNow &&
        effectiveSpeed >= 0.7
      ) {
        const secPerKm = 1000 / effectiveSpeed;
        const min = Math.floor(secPerKm / 60);
        const sec = Math.round(secPerKm % 60);

        livePaceDisplay.textContent =
          `${min}'${sec.toString().padStart(2, '0')}"`;
      } else {
        livePaceDisplay.textContent = '--\'--"';
      }

      // ----------------------------------------
      // 4. AUTO PAUSE
      // ----------------------------------------

      if (isAutoPauseEnabled && !isAutoPausedNow) {
        const lastStepElapsed =
          lastValidStepTime > 0
            ? now - lastValidStepTime
            : Infinity;

        const gpsRecentlyMoving =
          now - lastGoodGpsTime < GPS_STALE_MS &&
          currentSpeedMs >= 0.8;

        const hasMovement =
          lastStepElapsed < AUTO_PAUSE_DELAY_MS ||
          gpsRecentlyMoving;

        if (hasMovement) {
          lastMovementTime = now;
        }

        if (
          lastMovementTime > 0 &&
          now - lastMovementTime >= AUTO_PAUSE_DELAY_MS
        ) {
          triggerAutoPause();
        }
      }

    }, 1000);

    // ==========================================
    // CONTROLS
    // ==========================================

    function toggleAutoPauseOption() {
      isAutoPauseEnabled = !isAutoPauseEnabled;

      autoPauseToggleBtn.classList.toggle(
        'active',
        isAutoPauseEnabled
      );

      autoPauseText.textContent =
        isAutoPauseEnabled
          ? 'AUTO PAUSE ON'
          : 'AUTO PAUSE OFF';

      if (!isAutoPauseEnabled && isAutoPausedNow) {
        isAutoPausedNow = false;
        autoPauseStatusPill.style.display = 'none';
        resetCadenceReference();
        resumeRoutineTimers();
      }

      if (navigator.vibrate) navigator.vibrate(15);
    }

    function onSingleTapPause() {
      if (isUserPaused) return;

      isUserPaused = true;
      pauseRunUI();
    }

    function onQuickResume() {
      isUserPaused = false;
      resumeRunUI();
    }

    function pauseRunUI() {
      isRunning = false;
      pauseRoutineTimers();

      document.getElementById('runningBar').style.display = 'none';
      document.getElementById('pausedSplitBar').style.display = 'flex';

      lastLat = null;
      lastLon = null;
      lastGpsTime = null;

      if (silentAudioEl) silentAudioEl.pause();
      if (audioCtx && audioCtx.state === 'running') {
        audioCtx.suspend().catch(() => {});
      }
    }

    function resumeRunUI() {
      initAudio();

      isRunning = true;
      isUserPaused = false;
      isAutoPausedNow = false;
      autoPauseStatusPill.style.display = 'none';

      // 수동 일시정지 후 새 GPS 구간 시작
      lastLat = null;
      lastLon = null;
      lastGpsTime = null;
      lastGoodGpsTime = 0;
      currentSpeedMs = 0;
      runStartWallTime = Date.now();

      resetCadenceReference();
      lastMovementTime = Date.now();

      document.getElementById('runningBar').style.display = 'flex';
      document.getElementById('pausedSplitBar').style.display = 'none';

      resumeRoutineTimers();

      if (silentAudioEl && !silentAudioEl.src) {
        silentAudioEl.src = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQQAAAAAAP8A/w==';
      }

      if (silentAudioEl) {
        silentAudioEl.play().catch(() => {});
      }
    }

    // ==========================================
    // TIMERS
    // ==========================================

    function pauseRoutineTimers() {
      baseOffsetMs = elapsedMs;

      if (beatTimer) {
        clearInterval(beatTimer);
        beatTimer = null;
      }

      if (clockTimer) {
        clearInterval(clockTimer);
        clockTimer = null;
      }

      for (let i = 0; i < 4; i++) {
        const el = document.getElementById(`ind-${i}`);
        if (el) el.className = 'watch-ind-step';
      }
    }

    function resumeRoutineTimers() {
      if (!isRunning || isAutoPausedNow || isUserPaused) return;

      if (clockTimer) {
        clearInterval(clockTimer);
      }

      startTimeMs = performance.now();

      clockTimer = setInterval(() => {
        elapsedMs =
          baseOffsetMs +
          (performance.now() - startTimeMs);

        const cs = String(
          Math.floor(elapsedMs / 10) % 100
        ).padStart(2, '0');

        const ts = Math.floor(elapsedMs / 1000);
        const s = String(ts % 60).padStart(2, '0');
        const m = String(
          Math.floor(ts / 60) % 60
        ).padStart(2, '0');
        const h = Math.floor(ts / 3600);

        runTimerDisplay.textContent =
          `${h}:${m}:${s}:${cs}`;

        evaluateRoutine(ts);
      }, 50);

      syncBpmTimer();
    }

    function handleAppResume() {
      if (!isUserPaused && isRunning) {
        initAudio();

        if (silentAudioEl) {
          silentAudioEl.play().catch(() => {});
        }

        syncBpmTimer(false);
      }
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        handleAppResume();
      }
    });

    window.addEventListener('focus', () => {
      handleAppResume();
    });

    // ==========================================
    // FINISH HOLD
    // ==========================================

    const finishHoldBtn = document.getElementById('finishHoldBtn');
    const finishHoldProgress = document.getElementById('finishHoldProgress');
    const deleteConfirmModal = document.getElementById('deleteConfirmModal');

    let holdTimer = null;
    let holdStartTime = 0;

    finishHoldBtn.addEventListener('pointerdown', (e) => {
      e.preventDefault();

      if (navigator.vibrate) navigator.vibrate(15);

      holdStartTime = performance.now();
      holdTimer = requestAnimationFrame(updateHold);
    });

    const cancelHold = () => {
      if (holdTimer) {
        cancelAnimationFrame(holdTimer);
        holdTimer = null;
      }

      finishHoldProgress.style.strokeDashoffset = 188.49;
    };

    ['pointerup', 'pointerleave', 'pointercancel'].forEach(evt => {
      finishHoldBtn.addEventListener(evt, cancelHold);
    });

    function updateHold(timestamp) {
      const pct = Math.min(
        ((timestamp - holdStartTime) / 1250) * 100,
        100
      );

      finishHoldProgress.style.strokeDashoffset =
        188.49 - (pct / 100) * 188.49;

      if (pct < 100) {
        holdTimer = requestAnimationFrame(updateHold);
      } else {
        cancelHold();
        onSingleTapPause();
        deleteConfirmModal.style.display = 'flex';
      }
    }

    // ==========================================
    // SAVE / DISCARD
    // ==========================================

    function stopGPS() {
      if (
        gpsWatchId !== null &&
        navigator.geolocation
      ) {
        navigator.geolocation.clearWatch(gpsWatchId);
        gpsWatchId = null;
      }
    }

    function onDiscardRun() {
      stopGPS();
      window.location.href = 'main.html';
    }

    function onSaveRun() {
      stopGPS();

      try {
        const runResult = {
          date: new Date().toISOString(),
          distanceKm: (distanceMeters / 1000).toFixed(2),
          durationMs: elapsedMs,
          durationFormatted: runTimerDisplay.textContent,
          avgSpm: Math.round(currentSPM),
          totalSteps: totalSteps
        };

        localStorage.setItem(
          'matempa_latest_run',
          JSON.stringify(runResult)
        );
      } catch (e) {
        console.error('러닝 결과 저장 오류:', e);
      }

      window.location.href = 'report.html';
    }

    // ==========================================
    // SOUND SETTINGS
    // ==========================================

    function updateInlineSound() {
      const vol = inlineVolSlider.value;
      const pitch = inlinePitchSlider.value;

      runVolumeMultiplier = parseInt(vol, 10) / 100;
      runPitchMultiplier = parseInt(pitch, 10) / 100;

      inlineVolText.textContent = `${vol}%`;
      inlinePitchText.textContent =
        `${(parseInt(pitch, 10) / 100).toFixed(1)}x`;

      try {
        localStorage.setItem(
          'matempa_run_vol',
          runVolumeMultiplier
        );

        localStorage.setItem(
          'matempa_run_pitch',
          runPitchMultiplier
        );
      } catch (e) {}
    }

    function loadSavedSoundSettings() {
      try {
        const savedVol = localStorage.getItem('matempa_run_vol');
        const savedPitch = localStorage.getItem('matempa_run_pitch');

        if (savedVol !== null) {
          runVolumeMultiplier = parseFloat(savedVol);
          inlineVolSlider.value = Math.round(
            runVolumeMultiplier * 100
          );
          inlineVolText.textContent =
            `${inlineVolSlider.value}%`;
        }

        if (savedPitch !== null) {
          runPitchMultiplier = parseFloat(savedPitch);
          inlinePitchSlider.value = Math.round(
            runPitchMultiplier * 100
          );
          inlinePitchText.textContent =
            `${runPitchMultiplier.toFixed(1)}x`;
        }
      } catch (e) {}
    }

    // ==========================================
    // MOTION PERMISSION
    // iOS Safari/WebView 대응. Android에서는 바로 true.
    // ==========================================

    async function requestMotionPermissionIfNeeded() {
      try {
        if (
          typeof DeviceMotionEvent !== 'undefined' &&
          typeof DeviceMotionEvent.requestPermission === 'function'
        ) {
          const result = await DeviceMotionEvent.requestPermission();
          return result === 'granted';
        }
      } catch (e) {
        console.warn('Motion permission:', e);
      }

      return true;
    }

    // ==========================================
    // START
    // ==========================================

    window.onload = () => {
      loadSavedSoundSettings();

      try {
        const slot = localStorage.getItem('matempa_active_slot');
        if (slot !== null) {
          activeSlot = parseInt(slot, 10);
        }

        const customTitle =
          localStorage.getItem(`matempa_routine_name_${activeSlot}`);

        runRoutineTitle.textContent =
          customTitle
            ? customTitle
            : `ROUTINE #${activeSlot + 1}`;

        const saved =
          localStorage.getItem(`matempa_routine_slot_${activeSlot}`);

        routine = saved ? JSON.parse(saved) : [];
      } catch (e) {
        routine = [];
      }

      if (!routine || routine.length === 0) {
        routine = [
          {
            bpm: 180,
            durationSec: 300,
            sound: 'wood',
            meter: 'p1',
            vol: 0.9,
            pitch: 800
          },
          {
            bpm: 165,
            durationSec: 300,
            sound: 'wood',
            meter: 'p1',
            vol: 0.9,
            pitch: 800
          }
        ];
      }

      currentStepIndex = 0;
      currentBeatIndex = 0;
      elapsedMs = 0;
      baseOffsetMs = 0;
      lastSecondReported = -1;

      distanceMeters = 0;
      gpsDistanceMeters = 0;
      stepDerivedDistance = 0;
      distanceMode = 'gps';

      resetCadenceReference();

      applyCurrentStepToView(routine[0], 0);

      const unlockAudio = () => {
        initAudio();
        requestMotionPermissionIfNeeded();
        document.removeEventListener('pointerdown', unlockAudio);
      };

      document.addEventListener(
        'pointerdown',
        unlockAudio,
        { once: true }
      );

      startGPS();
      resumeRunUI();
    };
  </script>
</body>
