<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MA.TEMPA - RUN (JS HYBRID SENSOR)</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0b0b0c">

  <style>
    /* 기존의 아름다운 UI 디자인 100% 유지 */
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: #0b0b0c; color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Roboto, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: space-between;
      min-height: 100vh; padding: 1.2rem 1.2rem 2.2rem 1.2rem; user-select: none;
      -webkit-user-select: none; letter-spacing: -0.3px;
    }
    .app-screen { width: 100%; max-width: 360px; display: flex; flex-direction: column; flex: 1; justify-content: space-between; align-items: center; position: relative; }
    
    .run-header { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.6rem; }
    .routine-name-badge { font-size: 0.85rem; font-weight: 800; color: #8e8e93; letter-spacing: 0.5px; }
    .auto-pause-toggle-btn { background: rgba(255, 255, 255, 0.08); color: #8e8e93; border: 1px solid rgba(255, 255, 255, 0.12); padding: 6px 10px; border-radius: 12px; font-size: 0.7rem; font-weight: 800; cursor: pointer; display: flex; align-items: center; gap: 5px; }
    .auto-pause-toggle-btn.active { background: rgba(52, 199, 89, 0.16); color: #34c759; border-color: rgba(52, 199, 89, 0.35); }
    .auto-pause-dot { width: 6px; height: 6px; border-radius: 50%; background: #8e8e93; }
    .auto-pause-toggle-btn.active .auto-pause-dot { background: #34c759; box-shadow: 0 0 6px rgba(52, 199, 89, 0.8); }

    .gps-diag-banner { width: 100%; background: rgba(28, 28, 30, 0.95); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 14px; padding: 8px 12px; margin-bottom: 8px; display: flex; flex-direction: column; gap: 4px; font-size: 0.68rem; font-family: monospace; }
    .gps-diag-header { display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
    .gps-status-indicator { display: flex; align-items: center; gap: 5px; }
    .gps-dot { width: 8px; height: 8px; border-radius: 50%; background: #ff9500; }
    .gps-dot.ok { background: #34c759; box-shadow: 0 0 6px #34c759; }
    .gps-dot.bad { background: #ff3b30; }
    .gps-diag-row { display: flex; justify-content: space-between; color: #8e8e93; }
    .gps-diag-row span:last-child { color: #ffffff; font-weight: 700; }

    .watch-display-large { width: 100%; height: 485px; background: linear-gradient(180deg, #161618 0%, #0d0d0e 100%); border-radius: 46px; padding: 18px 16px 16px 16px; display: flex; flex-direction: column; justify-content: space-between; align-items: center; box-shadow: 0 24px 50px -10px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.15); }
    .top-stat-row { width: 100%; display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; color: #8e8e93; font-weight: 700; padding: 0 4px; }
    .zone-indicator-pill { background: rgba(52, 199, 89, 0.15); color: #34c759; padding: 3px 10px; border-radius: 8px; font-weight: 800; }
    .auto-pause-status-pill { display: none; background: rgba(255, 149, 0, 0.18); color: #ff9500; padding: 3px 10px; border-radius: 8px; font-weight: 800; font-size: 0.68rem; animation: blink 1s infinite alternate; }
    @keyframes blink { from { opacity: 0.5; } to { opacity: 1; } }

    .cadence-comparison-grid { width: 100%; display: flex; align-items: center; justify-content: space-between; margin-top: 0.1rem; padding: 0 4px; }
    .cadence-col { display: flex; flex-direction: column; align-items: center; flex: 1; }
    .cadence-num { font-size: 2.6rem; font-weight: 900; line-height: 0.95; font-variant-numeric: tabular-nums; letter-spacing: -1.5px; }
    .cadence-num.target { color: #ffffff; }
    .cadence-num.live { color: #34c759; }
    .cadence-num.pace { color: #ff9f0a; font-size: 2.35rem; }
    .cadence-col-label { font-size: 0.58rem; font-weight: 800; margin-top: 4px; color: #8e8e93; }
    .cadence-divider { width: 1px; height: 42px; background: rgba(255, 255, 255, 0.12); }

    .distance-hero-wrap { display: flex; flex-direction: column; align-items: center; margin: 0.1rem 0; }
    .distance-hero-num { font-size: 3.4rem; font-weight: 900; line-height: 0.9; color: #007aff; font-variant-numeric: tabular-nums; letter-spacing: -1.8px; }
    .distance-hero-unit { font-size: 0.72rem; font-weight: 900; color: #8e8e93; letter-spacing: 1.5px; margin-top: 3px; }

    .step-progress-text { font-size: 0.76rem; color: #a0a0a5; font-weight: 600; }
    .timer-capsule-large { background: rgba(255, 255, 255, 0.06); width: 220px; height: 40px; border-radius: 20px; display: flex; align-items: center; justify-content: center; color: #ffffff; font-size: 1.25rem; font-weight: 800; font-variant-numeric: tabular-nums; border: 1px solid rgba(255, 255, 255, 0.08); }
    .watch-indicators { display: flex; gap: 8px; margin-bottom: 2px; }
    .watch-ind-step { width: 24px; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.1); }
    .watch-ind-step.active { background: #34c759; box-shadow: 0 0 12px rgba(52, 199, 89, 0.9); }

    .inline-sound-control-card { width: 100%; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 18px; padding: 8px 12px; display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
    .sound-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .sound-label { font-size: 0.65rem; font-weight: 800; color: #8e8e93; min-width: 44px; }
    .sound-value-text { font-size: 0.65rem; font-weight: 800; color: #34c759; min-width: 32px; text-align: right; }
    .inline-slider { -webkit-appearance: none; flex: 1; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.16); outline: none; }
    .inline-slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #ffffff; cursor: pointer; }

    .controls-wrapper { width: 100%; height: 76px; margin-top: 0.8rem; display: flex; align-items: center; justify-content: center; }
    .running-bar { width: 100%; display: flex; }
    .single-tap-pause-btn { width: 100%; height: 58px; background: #ffffff; color: #111111; border: none; border-radius: 29px; font-size: 1.05rem; font-weight: 900; cursor: pointer; box-shadow: 0 6px 20px rgba(255, 255, 255, 0.12); }
    .paused-split-bar { width: 100%; display: none; align-items: center; justify-content: space-between; gap: 12px; }
    .btn-quick-resume { flex: 1.2; height: 58px; background: #34c759; color: #ffffff; border: none; border-radius: 29px; font-size: 0.95rem; font-weight: 900; cursor: pointer; }
    .finish-hold-wrap { position: relative; width: 68px; height: 68px; display: flex; align-items: center; justify-content: center; touch-action: none; }
    .finish-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: rotate(-90deg); pointer-events: none; }
    .finish-track { fill: none; stroke: rgba(255, 255, 255, 0.12); stroke-width: 4; }
    .finish-progress { fill: none; stroke: #ff3b30; stroke-width: 4; stroke-linecap: round; stroke-dasharray: 188.49; stroke-dashoffset: 188.49; }
    .finish-core-btn { width: 56px; height: 56px; border-radius: 50%; border: 1px solid rgba(255, 59, 48, 0.4); background: rgba(255, 59, 48, 0.18); color: #ff3b30; font-size: 0.72rem; font-weight: 900; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .finish-sub-text { font-size: 0.5rem; opacity: 0.8; margin-top: 1px; }

    .confirm-modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(8px); z-index: 1000; align-items: center; justify-content: center; padding: 1.5rem; }
    .confirm-modal-box { width: 100%; max-width: 310px; background: #1c1c1e; border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 24px; padding: 1.5rem; text-align: center; display: flex; flex-direction: column; gap: 1.2rem; }
    .confirm-modal-title { font-size: 1.05rem; font-weight: 800; color: #ffffff; }
    .confirm-modal-btn-group { display: flex; gap: 8px; }
    .modal-btn { flex: 1; height: 46px; border-radius: 23px; border: none; font-size: 0.9rem; font-weight: 800; cursor: pointer; }
    .btn-modal-cancel { background: #34c759; color: #ffffff; }
    .btn-modal-confirm { background: rgba(255, 59, 48, 0.2); color: #ff3b30; border: 1px solid rgba(255, 59, 48, 0.4); }
  </style>
</head>
<body>

  <div class="app-screen">
    <div class="run-header">
      <span class="routine-name-badge" id="runRoutineTitle">ROUTINE #1</span>
      <button class="auto-pause-toggle-btn active" id="autoPauseToggleBtn" onclick="toggleAutoPauseOption()">
        <span class="auto-pause-dot"></span><span id="autoPauseText">AUTO PAUSE ON</span>
      </button>
    </div>

    <!-- 웹 JS 자체 센서 모니터 -->
    <div class="gps-diag-banner" id="gpsDiagBanner">
      <div class="gps-diag-header">
        <div class="gps-status-indicator">
          <span class="gps-dot" id="gpsDot"></span>
          <span id="gpsStateText">JS 센서 엔진 가동 준비...</span>
        </div>
      </div>
      <div class="gps-diag-row">
        <span>정확도 / 모드:</span>
        <span id="gpsAccSpeed">-- m / --</span>
      </div>
    </div>

    <div class="watch-display-large">
      <div class="top-stat-row">
        <span class="zone-indicator-pill" id="runZoneBadge">ZONE.1</span>
        <span class="auto-pause-status-pill" id="autoPauseStatusPill">⏸ AUTO PAUSED</span>
        <span id="runSoundAndMeter">WOOD | ●●●●</span>
      </div>

      <div class="cadence-comparison-grid">
        <div class="cadence-col">
          <div class="cadence-num target" id="targetBpmDisplay">180</div>
          <span class="cadence-col-label">TARGET</span>
        </div>
        <div class="cadence-divider"></div>
        <div class="cadence-col">
          <div class="cadence-num live" id="liveCadenceDisplay">--</div>
          <span class="cadence-col-label">SPM</span>
        </div>
        <div class="cadence-divider"></div>
        <div class="cadence-col">
          <div class="cadence-num pace" id="livePaceDisplay">--'--"</div>
          <span class="cadence-col-label">PACE /KM</span>
        </div>
      </div>

      <div class="distance-hero-wrap">
        <div class="distance-hero-num" id="liveDistanceDisplay">0.00</div>
        <div class="distance-hero-unit">KILOMETERS</div>
      </div>

      <div class="step-progress-text" id="stepRemainingText">남은 시간 계산 중...</div>
      <div class="timer-capsule-large" id="runTimerDisplay">0:00:00:00</div>

      <div class="watch-indicators">
        <div class="watch-ind-step" id="ind-0"></div><div class="watch-ind-step" id="ind-1"></div>
        <div class="watch-ind-step" id="ind-2"></div><div class="watch-ind-step" id="ind-3"></div>
      </div>

      <div class="inline-sound-control-card">
        <div class="sound-row">
          <span class="sound-label">VOL</span>
          <input type="range" class="inline-slider" id="inlineVolSlider" min="0" max="100" value="100" oninput="updateInlineSound()">
          <span class="sound-value-text" id="inlineVolText">100%</span>
        </div>
        <div class="sound-row">
          <span class="sound-label">PITCH</span>
          <input type="range" class="inline-slider" id="inlinePitchSlider" min="50" max="150" value="100" oninput="updateInlineSound()">
          <span class="sound-value-text" id="inlinePitchText">1.0x</span>
        </div>
      </div>
    </div>

    <div class="controls-wrapper">
      <div class="running-bar" id="runningBar">
        <button class="single-tap-pause-btn" onclick="onSingleTapPause()">PAUSE ||</button>
      </div>
      <div class="paused-split-bar" id="pausedSplitBar">
        <button class="btn-quick-resume" onclick="onQuickResume()">RESUME ▶</button>
        <div class="finish-hold-wrap">
          <svg class="finish-svg" viewBox="0 0 68 68">
            <circle class="finish-track" cx="34" cy="34" r="30"></circle>
            <circle class="finish-progress" id="finishHoldProgress" cx="34" cy="34" r="30"></circle>
          </svg>
          <button class="finish-core-btn" id="finishHoldBtn">
            <span>FINISH</span><span class="finish-sub-text">1.25s</span>
          </button>
        </div>
      </div>
    </div>

    <div class="confirm-modal-overlay" id="deleteConfirmModal">
      <div class="confirm-modal-box">
        <div class="confirm-modal-title">기록을 저장/종료 할까요?</div>
        <div class="confirm-modal-btn-group">
          <button class="modal-btn btn-modal-confirm" onclick="onDiscardRun()">취소 (삭제)</button>
          <button class="modal-btn btn-modal-cancel" onclick="onSaveRun()">확인 (저장)</button>
        </div>
      </div>
    </div>
  </div>

  <audio id="silentBackgroundAudio" loop playsinline style="display: none;"></audio>

  <script>
    // ==========================================
    // 🧠 1. JS 독립 센서 엔진 (Accelerometer & GPS)
    // ==========================================
    let isRunning = false;
    let isAutoPauseEnabled = true;
    let isAutoPausedNow = false;
    
    // 모션 센서 (SPM 계산용)
    let smoothedAcc = 9.8; 
    let lastPeakTime = 0;
    let recentStepTimes = []; // 최근 걸음 발생 시간 기록
    let currentSPM = 0;
    let totalSteps = 0;
    
    // GPS & 하이브리드 거리 연산
    let distanceMeters = 0;
    let lastLat = null;
    let lastLon = null;
    let gpsWatchId = null;
    let currentSpeedMs = 0;
    let sensorMode = "대기중";
    const STRIDE_LENGTH = 0.75; // 실내 모드 75cm 보폭

    // 가속도 센서(DeviceMotion) 파동 계산 로직
    window.addEventListener('devicemotion', (event) => {
      if (!isRunning || isAutoPausedNow) return;
      
      const acc = event.accelerationIncludingGravity;
      if (!acc) return;
      
      // X, Y, Z축 벡터의 크기(충격량) 계산
      const magnitude = Math.sqrt(acc.x*acc.x + acc.y*acc.y + acc.z*acc.z);
      
      // 로우패스 필터 (미세한 떨림 제거, 부드럽게)
      smoothedAcc = smoothedAcc * 0.8 + magnitude * 0.2;
      
      // 피크(발구름) 감지 임계값
      const PEAK_THRESHOLD = 11.2; 
      const now = Date.now();
      
      // 충격이 크고, 이전 걸음과 250ms(1/4초) 이상 차이날 때만 1걸음 인정
      if (smoothedAcc > PEAK_THRESHOLD && (now - lastPeakTime) > 250) {
        lastPeakTime = now;
        recentStepTimes.push(now);
        totalSteps++;
        
        // 실내 모드(GPS 불가)일 경우 걸음 수로 거리 누적
        if (sensorMode === "실내 (만보기)") {
          distanceMeters += STRIDE_LENGTH;
        }
      }
    });

    // GPS 위치 추적 로직 (Haversine Formula)
    function startGPS() {
      if (navigator.geolocation) {
        gpsWatchId = navigator.geolocation.watchPosition((pos) => {
          if (!isRunning) return;
          
          const accuracy = pos.coords.accuracy;
          const lat = pos.coords.latitude;
          const lon = pos.coords.longitude;
          currentSpeedMs = pos.coords.speed || 0;

          if (accuracy < 20) {
            sensorMode = "야외 GPS";
            gpsDot.className = 'gps-dot ok';
            gpsStateText.textContent = 'GPS 양호';
            gpsAccSpeed.textContent = `±${accuracy.toFixed(0)}m / ${(currentSpeedMs * 3.6).toFixed(1)} km/h`;

            if (!isAutoPausedNow) {
              if (lastLat !== null && lastLon !== null) {
                const dist = calculateDistance(lastLat, lastLon, lat, lon);
                if (dist > 1 && dist < 30) distanceMeters += dist; // 튐 방지
              }
            }
            lastLat = lat;
            lastLon = lon;
          } else {
            sensorMode = "실내 (만보기)";
            gpsDot.className = 'gps-dot bad';
            gpsStateText.textContent = '실내 모드 작동중';
            gpsAccSpeed.textContent = `오차큼 / 폰 흔들기 감지`;
            lastLat = null; lastLon = null;
          }
        }, (err) => {
          sensorMode = "실내 (만보기)";
          gpsDot.className = 'gps-dot bad';
          gpsStateText.textContent = 'GPS 권한 없음 (실내 모드)';
        }, { enableHighAccuracy: true, maximumAge: 0 });
      }
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const r1 = lat1 * Math.PI/180, r2 = lat2 * Math.PI/180;
      const dLat = (lat2-lat1) * Math.PI/180;
      const dLon = (lon2-lon1) * Math.PI/180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(r1) * Math.cos(r2) * Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    // ==========================================
    // 📊 2. 1초마다 화면 업데이트 (엔진 연산 루프)
    // ==========================================
    setInterval(() => {
      if (!isRunning) return;

      const now = Date.now();
      
      // 1. SPM (케이던스) 계산: 최근 5초간의 걸음수로 정밀 계산
      recentStepTimes = recentStepTimes.filter(t => (now - t) < 5000);
      let stepsIn5Sec = recentStepTimes.length;
      let rawSpm = stepsIn5Sec * 12; // 5초 걸음 * 12 = 1분(60초)
      
      if (isAutoPausedNow) {
        currentSPM = 0;
      } else {
        // 부드러운 애니메이션을 위한 지수 이동 평균(EMA)
        currentSPM = currentSPM === 0 ? rawSpm : (currentSPM * 0.7 + rawSpm * 0.3);
      }
      liveCadenceDisplay.textContent = currentSPM > 15 ? Math.round(currentSPM) : "--";

      // 2. 오토포즈 (자동 일시정지) 판단
      let isMoving = false;
      if (sensorMode === "야외 GPS") {
        isMoving = currentSpeedMs > 0.8;
      } else {
        isMoving = recentStepTimes.length > 2; // 실내에선 발구름이 있으면 이동중
      }

      if (isAutoPauseEnabled) {
        if (!isMoving && !isAutoPausedNow) {
          isAutoPausedNow = true;
          autoPauseStatusPill.style.display = 'inline-block';
          pauseRoutineTimers();
        } else if (isMoving && isAutoPausedNow) {
          isAutoPausedNow = false;
          autoPauseStatusPill.style.display = 'none';
          resumeRoutineTimers();
        }
      }

      // 3. 거리 및 페이스 업데이트 화면 표시
      liveDistanceDisplay.textContent = (distanceMeters / 1000).toFixed(2);
      
      let paceStr = "--'--\"";
      if (!isAutoPausedNow) {
        let speedForPace = sensorMode === "야외 GPS" ? currentSpeedMs : (stepsIn5Sec / 5) * STRIDE_LENGTH;
        if (speedForPace > 0.8) {
          let secPerKm = 1000 / speedForPace;
          let min = Math.floor(secPerKm / 60);
          let sec = Math.round(secPerKm % 60);
          paceStr = `${min}'${sec.toString().padStart(2, '0')}"`;
        }
      }
      livePaceDisplay.textContent = paceStr;

    }, 1000);

    // ==========================================
    // 🎛️ 3. UI 및 타이머 컨트롤 (기존 로직 유지)
    // ==========================================
    // (기존의 메트로놈 소리, UI 업데이트, 루틴 로직은 완전히 동일하게 유지됩니다)
    let activeSlot = 0; let routine = [];
    let runVolumeMultiplier = 1.0; let runPitchMultiplier = 1.0;
    let currentStepIndex = 0; let currentBeatIndex = 0; let startTimeMs = 0; let baseOffsetMs = 0; let elapsedMs = 0;
    let audioCtx = null; let beatTimer = null; let clockTimer = null; let currentStepData = null;

    // DOM 요소
    const autoPauseToggleBtn = document.getElementById('autoPauseToggleBtn');
    const autoPauseText = document.getElementById('autoPauseText');
    const autoPauseStatusPill = document.getElementById('autoPauseStatusPill');
    const gpsDot = document.getElementById('gpsDot');
    const gpsStateText = document.getElementById('gpsStateText');
    const gpsAccSpeed = document.getElementById('gpsAccSpeed');
    const liveCadenceDisplay = document.getElementById('liveCadenceDisplay');
    const livePaceDisplay = document.getElementById('livePaceDisplay');
    const liveDistanceDisplay = document.getElementById('liveDistanceDisplay');
    const runTimerDisplay = document.getElementById('runTimerDisplay');
    const silentAudioEl = document.getElementById('silentBackgroundAudio');

    function toggleAutoPauseOption() {
      if(navigator.vibrate) navigator.vibrate(15);
      isAutoPauseEnabled = !isAutoPauseEnabled;
      autoPauseToggleBtn.classList.toggle('active', isAutoPauseEnabled);
      autoPauseText.textContent = isAutoPauseEnabled ? 'AUTO PAUSE ON' : 'AUTO PAUSE OFF';
    }

    function onSingleTapPause() { pauseRunUI(); }
    function onQuickResume() { resumeRunUI(); }
    
    function showRunningControlsUI() { document.getElementById('runningBar').style.display = 'flex'; document.getElementById('pausedSplitBar').style.display = 'none'; }
    function showPausedControlsUI() { document.getElementById('runningBar').style.display = 'none'; document.getElementById('pausedSplitBar').style.display = 'flex'; }

    function resumeRunUI() {
      isRunning = true; isAutoPausedNow = false;
      autoPauseStatusPill.style.display = 'none';
      if(navigator.vibrate) navigator.vibrate(20);
      showRunningControlsUI();
      resumeRoutineTimers();
      if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      silentAudioEl.play().catch(()=>{});
    }

    function pauseRunUI() {
      isRunning = false;
      pauseRoutineTimers();
      showPausedControlsUI();
      if(navigator.vibrate) navigator.vibrate(20);
    }

    function pauseRoutineTimers() {
      baseOffsetMs = elapsedMs;
      if (clockTimer) clearInterval(clockTimer); clockTimer = null;
    }

    function resumeRoutineTimers() {
      startTimeMs = performance.now();
      clockTimer = setInterval(() => {
        elapsedMs = baseOffsetMs + (performance.now() - startTimeMs);
        let cs = String(Math.floor(elapsedMs / 10) % 100).padStart(2, '0');
        let ts = Math.floor(elapsedMs / 1000);
        let s = String(ts % 60).padStart(2, '0');
        let m = String(Math.floor(ts / 60) % 60).padStart(2, '0');
        let h = Math.floor(ts / 3600);
        runTimerDisplay.textContent = `${h}:${m}:${s}:${cs}`;
      }, 50);
    }

    // 롱프레스(FINISH) 로직
    const finishHoldBtn = document.getElementById('finishHoldBtn');
    const finishHoldProgress = document.getElementById('finishHoldProgress');
    const deleteConfirmModal = document.getElementById('deleteConfirmModal');
    let holdTimer = null, holdStartTime = 0;
    
    finishHoldBtn.addEventListener('pointerdown', (e) => { 
      e.preventDefault(); if(navigator.vibrate) navigator.vibrate(15);
      holdStartTime = performance.now();
      holdTimer = requestAnimationFrame(updateHold);
    });
    
    const cancelHold = () => { if(holdTimer) cancelAnimationFrame(holdTimer); finishHoldProgress.style.strokeDashoffset = 188.49; };
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(evt => finishHoldBtn.addEventListener(evt, cancelHold));
    
    function updateHold(timestamp) {
      const pct = Math.min(((timestamp - holdStartTime) / 1250) * 100, 100);
      finishHoldProgress.style.strokeDashoffset = 188.49 - (pct / 100) * 188.49;
      if (pct < 100) holdTimer = requestAnimationFrame(updateHold);
      else { cancelHold(); pauseRunUI(); deleteConfirmModal.style.display = 'flex'; if(navigator.vibrate) navigator.vibrate([30,50,40]); }
    }

    function onDiscardRun() { window.location.href = 'main.html'; }
    function onSaveRun() { window.location.href = 'report.html'; } // 저장 시 리포트 페이지로

    window.onload = () => {
      // 오디오 트릭 (백그라운드 방지)
      if (!silentAudioEl.src) silentAudioEl.src = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQQAAAAAAP8A/w==';
      
      // 시작!
      startGPS();
      resumeRunUI();
    };
  </script>
</body>
