<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MA.TEMPA - RUN (JS HYBRID SENSOR)</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0b0b0c">

  <style>
    /* CSS 스타일은 기존의 아름다운 디자인을 100% 그대로 유지합니다 */
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: #0b0b0c;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 100vh;
      padding: 1.2rem 1.2rem 2.2rem 1.2rem;
      user-select: none;
      -webkit-user-select: none;
      letter-spacing: -0.3px;
    }

    .app-screen {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: space-between;
      align-items: center;
      position: relative;
    }

    .run-header { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.6rem; }
    .routine-name-badge { font-size: 0.85rem; font-weight: 800; color: #8e8e93; letter-spacing: 0.5px; }

    .auto-pause-toggle-btn {
      background: rgba(255, 255, 255, 0.08); color: #8e8e93; border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 6px 10px; border-radius: 12px; font-size: 0.7rem; font-weight: 800; cursor: pointer;
      display: flex; align-items: center; gap: 5px; transition: all 0.2s ease;
    }
    .auto-pause-toggle-btn.active { background: rgba(52, 199, 89, 0.16); color: #34c759; border-color: rgba(52, 199, 89, 0.35); }
    .auto-pause-dot { width: 6px; height: 6px; border-radius: 50%; background: #8e8e93; }
    .auto-pause-toggle-btn.active .auto-pause-dot { background: #34c759; box-shadow: 0 0 6px rgba(52, 199, 89, 0.8); }

    .gps-diag-banner {
      width: 100%; background: rgba(28, 28, 30, 0.95); border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px; padding: 8px 12px; margin-bottom: 8px; display: flex; flex-direction: column;
      gap: 4px; font-size: 0.68rem; font-family: monospace;
    }
    .gps-diag-header { display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
    .gps-status-indicator { display: flex; align-items: center; gap: 5px; }
    .gps-dot { width: 8px; height: 8px; border-radius: 50%; background: #ff9500; }
    .gps-dot.ok { background: #34c759; box-shadow: 0 0 6px #34c759; }
    .gps-dot.bad { background: #ff3b30; }
    .gps-diag-row { display: flex; justify-content: space-between; color: #8e8e93; }
    .gps-diag-row span:last-child { color: #ffffff; font-weight: 700; }

    .watch-display-large {
      width: 100%; height: 485px; background: linear-gradient(180deg, #161618 0%, #0d0d0e 100%);
      border-radius: 46px; padding: 18px 16px 16px 16px; display: flex; flex-direction: column;
      justify-content: space-between; align-items: center; box-shadow: 0 24px 50px -10px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.15);
      position: relative;
    }

    .top-stat-row { width: 100%; display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; color: #8e8e93; font-weight: 700; padding: 0 4px; }
    .zone-indicator-pill { background: rgba(52, 199, 89, 0.15); color: #34c759; padding: 3px 10px; border-radius: 8px; font-weight: 800; }
    .auto-pause-status-pill {
      display: none; background: rgba(255, 149, 0, 0.18); color: #ff9500; padding: 3px 10px;
      border-radius: 8px; font-weight: 800; font-size: 0.68rem; letter-spacing: 0.5px; animation: blink 1s infinite alternate;
    }
    @keyframes blink { from { opacity: 0.5; } to { opacity: 1; } }

    .cadence-comparison-grid { width: 100%; display: flex; align-items: center; justify-content: space-between; margin-top: 0.1rem; padding: 0 4px; }
    .cadence-col { display: flex; flex-direction: column; align-items: center; flex: 1; }
    .cadence-num { font-size: 2.6rem; font-weight: 900; line-height: 0.95; font-variant-numeric: tabular-nums; letter-spacing: -1.5px; }
    .cadence-num.target { color: #ffffff; filter: drop-shadow(0 4px 12px rgba(255, 255, 255, 0.1)); }
    .cadence-num.live { color: #34c759; filter: drop-shadow(0 4px 12px rgba(52, 199, 89, 0.25)); }
    .cadence-num.pace { color: #ff9f0a; font-size: 2.35rem; letter-spacing: -1px; filter: drop-shadow(0 4px 12px rgba(255, 159, 10, 0.25)); }
    .cadence-col-label { font-size: 0.58rem; font-weight: 800; letter-spacing: 0.8px; margin-top: 4px; color: #8e8e93; white-space: nowrap; }
    .cadence-divider { width: 1px; height: 42px; background: rgba(255, 255, 255, 0.12); }

    .distance-hero-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0.1rem 0; }
    .distance-hero-num { font-size: 3.4rem; font-weight: 900; line-height: 0.9; color: #007aff; font-variant-numeric: tabular-nums; letter-spacing: -1.8px; filter: drop-shadow(0 6px 16px rgba(0, 122, 255, 0.35)); }
    .distance-hero-unit { font-size: 0.72rem; font-weight: 900; color: #8e8e93; letter-spacing: 1.5px; margin-top: 3px; }

    .step-progress-text { font-size: 0.76rem; color: #a0a0a5; font-weight: 600; }
    .timer-capsule-large {
      background: rgba(255, 255, 255, 0.06); width: 220px; height: 40px; border-radius: 20px;
      display: flex; align-items: center; justify-content: center; color: #ffffff; font-size: 1.25rem;
      font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: 1px; border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.3);
    }

    .watch-indicators { display: flex; gap: 8px; margin-bottom: 2px; }
    .watch-ind-step { width: 24px; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.1); transition: background 0.08s, box-shadow 0.08s; }
    .watch-ind-step.active { background: #34c759; box-shadow: 0 0 12px rgba(52, 199, 89, 0.9); }

    .inline-sound-control-card { width: 100%; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 18px; padding: 8px 12px; display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
    .sound-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .sound-label { font-size: 0.65rem; font-weight: 800; color: #8e8e93; min-width: 44px; }
    .sound-value-text { font-size: 0.65rem; font-weight: 800; color: #34c759; min-width: 32px; text-align: right; font-variant-numeric: tabular-nums; }
    .inline-slider { -webkit-appearance: none; flex: 1; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.16); outline: none; }
    .inline-slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #ffffff; cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,0.5); }

    .controls-wrapper { width: 100%; height: 76px; margin-top: 0.8rem; display: flex; align-items: center; justify-content: center; }
    .running-bar { width: 100%; display: flex; }
    .single-tap-pause-btn { width: 100%; height: 58px; background: #ffffff; color: #111111; border: none; border-radius: 29px; font-size: 1.05rem; font-weight: 900; letter-spacing: 0.5px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 20px rgba(255, 255, 255, 0.12); transition: transform 0.12s ease; }
    .single-tap-pause-btn:active { transform: scale(0.96); }

    .paused-split-bar { width: 100%; display: none; align-items: center; justify-content: space-between; gap: 12px; }
    .btn-quick-resume { flex: 1.2; height: 58px; background: #34c759; color: #ffffff; border: none; border-radius: 29px; font-size: 0.95rem; font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 20px rgba(52, 199, 89, 0.25); transition: transform 0.12s ease; }
    .btn-quick-resume:active { transform: scale(0.95); }

    .finish-hold-wrap { position: relative; width: 68px; height: 68px; display: flex; align-items: center; justify-content: center; touch-action: none; }
    .finish-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: rotate(-90deg); pointer-events: none; }
    .finish-track { fill: none; stroke: rgba(255, 255, 255, 0.12); stroke-width: 4; }
    .finish-progress { fill: none; stroke: #ff3b30; stroke-width: 4; stroke-linecap: round; stroke-dasharray: 188.49; stroke-dashoffset: 188.49; transition: stroke-dashoffset 0.04s linear; }
    .finish-core-btn { width: 56px; height: 56px; border-radius: 50%; border: 1px solid rgba(255, 59, 48, 0.4); background: rgba(255, 59, 48, 0.18); color: #ff3b30; font-size: 0.72rem; font-weight: 900; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: transform 0.1s ease; }
    .finish-core-btn:active { transform: scale(0.92); }
    .finish-sub-text { font-size: 0.5rem; opacity: 0.8; margin-top: 1px; }

    .confirm-modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); z-index: 1000; align-items: center; justify-content: center; padding: 1.5rem; }
    .confirm-modal-box { width: 100%; max-width: 310px; background: #1c1c1e; border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 24px; padding: 1.5rem 1.2rem 1.2rem 1.2rem; text-align: center; display: flex; flex-direction: column; gap: 1.2rem; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6); }
    .confirm-modal-title { font-size: 1.05rem; font-weight: 800; color: #ffffff; line-height: 1.4; }
    .confirm-modal-btn-group { display: flex; gap: 8px; }
    .modal-btn { flex: 1; height: 46px; border-radius: 23px; border: none; font-size: 0.9rem; font-weight: 800; cursor: pointer; transition: transform 0.1s ease; }
    .modal-btn:active { transform: scale(0.95); }
    .btn-modal-cancel { background: #34c759; color: #ffffff; }
    .btn-modal-confirm { background: rgba(255, 59, 48, 0.2); color: #ff3b30; border: 1px solid rgba(255, 59, 48, 0.4); }
  </style>
</head>
<body>

  <div class="app-screen">

    <div class="run-header">
      <div class="header-left-wrap">
        <span class="routine-name-badge" id="runRoutineTitle">ROUTINE #1</span>
      </div>
      <button class="auto-pause-toggle-btn active" id="autoPauseToggleBtn" onclick="toggleAutoPauseOption()">
        <span class="auto-pause-dot"></span>
        <span id="autoPauseText">AUTO PAUSE ON</span>
      </button>
    </div>

    <!-- 네이티브 상태 모니터 -->
    <div class="gps-diag-banner" id="gpsDiagBanner">
      <div class="gps-diag-header">
        <div class="gps-status-indicator">
          <span class="gps-dot" id="gpsDot"></span>
          <span id="gpsStateText">센서 엔진 가동 대기중...</span>
        </div>
      </div>
      <div class="gps-diag-row">
        <span>정확도 / 속도:</span>
        <span id="gpsAccSpeed">-- m / -- km/h</span>
      </div>
    </div>

    <div class="watch-display-large">
      <div class="top-stat-row">
        <span class="zone-indicator-pill" id="runZoneBadge">ZONE.1</span>
        <span class="auto-pause-status-pill" id="autoPauseStatusPill">⏸ AUTO PAUSED</span>
        <span id="runSoundAndMeter">WOOD | ●●●●</span>
      </div>

      <div class="cadence-comparison-grid">
        <div class="cadence-col">
          <div class="cadence-num target" id="targetBpmDisplay">180</div>
          <span class="cadence-col-label">TARGET</span>
        </div>
        <div class="cadence-divider"></div>
        <div class="cadence-col">
          <div class="cadence-num live" id="liveCadenceDisplay">--</div>
          <span class="cadence-col-label">SPM</span>
        </div>
        <div class="cadence-divider"></div>
        <div class="cadence-col">
          <div class="cadence-num pace" id="livePaceDisplay">--'--"</div>
          <span class="cadence-col-label">PACE /KM</span>
        </div>
      </div>

      <div class="distance-hero-wrap">
        <div class="distance-hero-num" id="liveDistanceDisplay">0.00</div>
        <div class="distance-hero-unit">KILOMETERS</div>
      </div>

      <div class="step-progress-text" id="stepRemainingText">남은 시간 계산 중...</div>
      <div class="timer-capsule-large" id="runTimerDisplay">0:00:00:00</div>

      <div class="watch-indicators">
        <div class="watch-ind-step" id="ind-0"></div>
        <div class="watch-ind-step" id="ind-1"></div>
        <div class="watch-ind-step" id="ind-2"></div>
        <div class="watch-ind-step" id="ind-3"></div>
      </div>

      <div class="inline-sound-control-card">
        <div class="sound-row">
          <span class="sound-label">VOL</span>
          <input type="range" class="inline-slider" id="inlineVolSlider" min="0" max="100" value="100" oninput="updateInlineSound()">
          <span class="sound-value-text" id="inlineVolText">100%</span>
        </div>
        <div class="sound-row">
          <span class="sound-label">PITCH</span>
          <input type="range" class="inline-slider" id="inlinePitchSlider" min="50" max="150" value="100" oninput="updateInlineSound()">
          <span class="sound-value-text" id="inlinePitchText">1.0x</span>
        </div>
      </div>
    </div>

    <div class="controls-wrapper">
      <div class="running-bar" id="runningBar">
        <button class="single-tap-pause-btn" id="singleTapPauseBtn" onclick="onSingleTapPause()">PAUSE ||</button>
      </div>
      <div class="paused-split-bar" id="pausedSplitBar">
        <button class="btn-quick-resume" onclick="onQuickResume()">RESUME ▶</button>
        <div class="finish-hold-wrap" id="finishHoldWrap">
          <svg class="finish-svg" viewBox="0 0 68 68">
            <circle class="finish-track" cx="34" cy="34" r="30"></circle>
            <circle class="finish-progress" id="finishHoldProgress" cx="34" cy="34" r="30"></circle>
          </svg>
          <button class="finish-core-btn" id="finishHoldBtn">
            <span>FINISH</span>
            <span class="finish-sub-text">1.25s</span>
          </button>
        </div>
      </div>
    </div>

    <div class="confirm-modal-overlay" id="deleteConfirmModal">
      <div class="confirm-modal-box">
        <div class="confirm-modal-title">기록을 어떻게 할까요?</div>
        <div class="confirm-modal-btn-group">
          <button class="modal-btn btn-modal-confirm" onclick="onDiscardRun()">취소 (삭제)</button>
          <button class="modal-btn btn-modal-cancel" onclick="onSaveRun()">확인 (저장)</button>
        </div>
      </div>
    </div>

  </div>

  <audio id="silentBackgroundAudio" loop playsinline style="display: none;"></audio>

  <script>
    // ==========================================
    // MA.TEMPA RUN ENGINE
    // Web GPS + Motion Sensor Hybrid
    // ==========================================

    let isRunning = false;
    let isAutoPauseEnabled = true;
    let isAutoPausedNow = false;

    // ==========================================
    // 1. DOM
    // ==========================================
    const autoPauseToggleBtn = document.getElementById('autoPauseToggleBtn');
    const autoPauseText = document.getElementById('autoPauseText');
    const autoPauseStatusPill = document.getElementById('autoPauseStatusPill');

    const gpsDot = document.getElementById('gpsDot');
    const gpsStateText = document.getElementById('gpsStateText');
    const gpsAccSpeed = document.getElementById('gpsAccSpeed');

    const liveCadenceDisplay = document.getElementById('liveCadenceDisplay');
    const livePaceDisplay = document.getElementById('livePaceDisplay');
    const liveDistanceDisplay = document.getElementById('liveDistanceDisplay');
    const runTimerDisplay = document.getElementById('runTimerDisplay');

    const silentAudioEl = document.getElementById('silentBackgroundAudio');

    // ==========================================
    // 2. RUN STATE
    // ==========================================
    let distanceMeters = 0;

    // 마지막으로 "유효하다고 인정한" GPS
    let lastLat = null;
    let lastLon = null;
    let lastGpsTime = null;

    // GPS 상태
    let gpsWatchId = null;
    let gpsHasFix = false;
    let gpsAccuracy = Infinity;
    let currentSpeedMs = 0;

    let lastGpsReceivedTime = 0;
    let gpsBadSince = null;

    // 실제 이동 판단
    let movingScore = 0;
    let lastMovingTime = 0;

    // GPS 설정
    const GPS_MAX_ACCURACY = 35;      // 35m까지 허용
    const GPS_GOOD_ACCURACY = 20;     // 20m 이하 = 매우 양호
    const MIN_DISTANCE_STEP = 2.0;    // 2m 이하 GPS 떨림 무시
    const MAX_REASONABLE_SPEED = 8.5; // 약 30.6km/h
    const AUTO_PAUSE_DELAY = 5000;    // 5초 이상 정지하면 자동 일시정지
    const AUTO_RESUME_DELAY = 1200;   // 1.2초 이상 움직이면 재개

    // ==========================================
    // 3. MOTION SENSOR / CADENCE
    // ==========================================
    let smoothedAcc = 9.8;
    let lastPeakTime = 0;
    let recentStepTimes = [];
    let currentSPM = 0;
    let totalSteps = 0;

    window.addEventListener('devicemotion', (event) => {
      if (!isRunning || isAutoPausedNow) return;

      const acc = event.accelerationIncludingGravity;
      if (!acc || acc.x == null || acc.y == null || acc.z == null) return;

      const magnitude = Math.sqrt(acc.x * acc.x + acc.y * acc.y + acc.z * acc.z);
      smoothedAcc = smoothedAcc * 0.8 + magnitude * 0.2;

      const PEAK_THRESHOLD = 11.2;
      const now = Date.now();

      if (smoothedAcc > PEAK_THRESHOLD && (now - lastPeakTime) > 250) {
        lastPeakTime = now;
        recentStepTimes.push(now);
        totalSteps++;
      }
    });

    // ==========================================
    // 4. GPS START
    // ==========================================
    function startGPS() {
      if (!navigator.geolocation) {
        setGpsError('이 브라우저는 GPS를 지원하지 않습니다.');
        return;
      }
      setGpsWaiting();

      gpsWatchId = navigator.geolocation.watchPosition(
        handleGPSPosition,
        handleGPSError,
        {
          enableHighAccuracy: true,
          maximumAge: 1000,
          timeout: 10000
        }
      );
    }

    // ==========================================
    // 5. GPS POSITION
    // ==========================================
    function handleGPSPosition(pos) {
      if (!isRunning) return;

      const coords = pos.coords;
      const lat = coords.latitude;
      const lon = coords.longitude;
      const accuracy = Number(coords.accuracy);

      if (!Number.isFinite(lat) || !Number.isFinite(lon) || !Number.isFinite(accuracy)) return;

      gpsAccuracy = accuracy;
      const now = Date.now();
      lastGpsReceivedTime = now;

      let speed = Number(coords.speed);
      if (!Number.isFinite(speed) || speed < 0) speed = 0;
      currentSpeedMs = speed;

      if (accuracy > GPS_MAX_ACCURACY) {
        gpsHasFix = false;
        if (!gpsBadSince) gpsBadSince = now;

        gpsDot.className = 'gps-dot bad';
        gpsStateText.textContent = 'GPS 신호 보정 중';
        gpsAccSpeed.textContent = `±${accuracy.toFixed(0)}m / 보정 중`;
        return;
      }

      gpsHasFix = true;
      gpsBadSince = null;

      gpsDot.className = accuracy <= GPS_GOOD_ACCURACY ? 'gps-dot ok' : 'gps-dot';
      gpsStateText.textContent = accuracy <= GPS_GOOD_ACCURACY ? 'GPS 양호' : 'GPS 연결됨';
      gpsAccSpeed.textContent = `±${accuracy.toFixed(0)}m / ${(speed * 3.6).toFixed(1)} km/h`;

      if (lastLat === null || lastLon === null) {
        lastLat = lat;
        lastLon = lon;
        lastGpsTime = now;
        return;
      }

      const distance = calculateDistance(lastLat, lastLon, lat, lon);
      const elapsedSeconds = Math.max((now - lastGpsTime) / 1000, 0.1);
      const calculatedSpeed = distance / elapsedSeconds;

      if (distance < MIN_DISTANCE_STEP) {
        updateMovementState(speed, calculatedSpeed, now);
        return;
      }

      const allowedSpeed = Math.max(speed, calculatedSpeed);

      if (calculatedSpeed <= MAX_REASONABLE_SPEED && allowedSpeed <= MAX_REASONABLE_SPEED) {
        if (!isAutoPausedNow) {
          distanceMeters += distance;
        }
        lastLat = lat;
        lastLon = lon;
        lastGpsTime = now;
      } else {
        gpsStateText.textContent = 'GPS 위치 보정 중';
      }

      updateMovementState(speed, calculatedSpeed, now);
    }

    // ==========================================
    // 6. MOVEMENT DETECTION
    // ==========================================
    function updateMovementState(gpsSpeed, calculatedSpeed, now) {
      const effectiveSpeed = Math.max(
        Number.isFinite(gpsSpeed) ? gpsSpeed : 0,
        Number.isFinite(calculatedSpeed) ? calculatedSpeed : 0
      );

      const isMoving = effectiveSpeed >= 0.8;

      if (isMoving) {
        movingScore++;
        if (!lastMovingTime) lastMovingTime = now;
      } else {
        movingScore = Math.max(0, movingScore - 1);
        if (!isAutoPausedNow) {
          lastMovingTime = now;
        }
      }
    }

    // ==========================================
    // 7. GPS ERROR
    // ==========================================
    function handleGPSError(err) {
      gpsHasFix = false;
      gpsDot.className = 'gps-dot bad';

      if (err.code === 1) {
        gpsStateText.textContent = 'GPS 권한이 필요합니다';
        gpsAccSpeed.textContent = '위치 권한을 허용해주세요';
      } else if (err.code === 2) {
        gpsStateText.textContent = 'GPS 신호 없음';
        gpsAccSpeed.textContent = '위치 신호 검색 중';
      } else {
        gpsStateText.textContent = 'GPS 연결 지연';
        gpsAccSpeed.textContent = '다시 검색 중';
      }
    }

    function setGpsWaiting() {
      gpsDot.className = 'gps-dot';
      gpsStateText.textContent = 'GPS 연결 중...';
      gpsAccSpeed.textContent = '-- m / --';
    }

    function setGpsError(message) {
      gpsDot.className = 'gps-dot bad';
      gpsStateText.textContent = message;
      gpsAccSpeed.textContent = '--';
    }

    // ==========================================
    // 8. HAVERSINE
    // ==========================================
    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const rLat1 = lat1 * Math.PI / 180;
      const rLat2 = lat2 * Math.PI / 180;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) ** 2 + Math.cos(rLat1) * Math.cos(rLat2) * Math.sin(dLon / 2) ** 2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    // ==========================================
    // 9. 1 SECOND ENGINE
    // ==========================================
    setInterval(() => {
      if (!isRunning) return;

      const now = Date.now();

      // ========================================
      // SPM
      // ========================================
      recentStepTimes = recentStepTimes.filter(t => (now - t) < 5000);
      const stepsIn5Sec = recentStepTimes.length;
      const rawSpm = stepsIn5Sec * 12;

      if (isAutoPausedNow) {
        currentSPM = 0;
      } else {
        currentSPM = currentSPM === 0 ? rawSpm : currentSPM * 0.7 + rawSpm * 0.3;
      }

      liveCadenceDisplay.textContent = currentSPM > 15 ? Math.round(currentSPM) : '--';

      // ========================================
      // AUTO PAUSE
      // ========================================
      if (isAutoPauseEnabled && gpsHasFix) {
        const gpsIsMoving = currentSpeedMs >= 0.8 || movingScore >= 2;

        if (gpsIsMoving) {
          if (isAutoPausedNow) {
            if (!lastMovingTime) lastMovingTime = now;
            if (now - lastMovingTime >= AUTO_RESUME_DELAY) {
              resumeFromAutoPause();
            }
          }
        } else {
          if (!isAutoPausedNow) {
            if (!lastMovingTime) lastMovingTime = now;
            if (now - lastMovingTime >= AUTO_PAUSE_DELAY) {
              triggerAutoPause();
            }
          }
        }
      }

      // ========================================
      // DISTANCE
      // ========================================
      liveDistanceDisplay.textContent = (distanceMeters / 1000).toFixed(2);

      // ========================================
      // PACE
      // ========================================
      let paceStr = "--'--\"";
      if (!isAutoPausedNow && currentSpeedMs > 0.8) {
        const secPerKm = 1000 / currentSpeedMs;
        const min = Math.floor(secPerKm / 60);
        const sec = Math.round(secPerKm % 60);
        paceStr = `${min}'${sec.toString().padStart(2, '0')}"`;
      }
      livePaceDisplay.textContent = paceStr;

    }, 1000);

    // ==========================================
    // 10. AUTO PAUSE ACTIONS
    // ==========================================
    function triggerAutoPause() {
      if (isAutoPausedNow) return;
      isAutoPausedNow = true;
      autoPauseStatusPill.style.display = 'inline-block';
      pauseRoutineTimers();
      if (navigator.vibrate) navigator.vibrate(30);
    }

    function resumeFromAutoPause() {
      if (!isAutoPausedNow) return;
      lastLat = null;
      lastLon = null;
      lastGpsTime = null;
      isAutoPausedNow = false;
      autoPauseStatusPill.style.display = 'none';
      resumeRoutineTimers();
      if (navigator.vibrate) navigator.vibrate(20);
    }

    // ==========================================
    // 11. AUTO PAUSE TOGGLE
    // ==========================================
    function toggleAutoPauseOption() {
      if (navigator.vibrate) navigator.vibrate(15);
      isAutoPauseEnabled = !isAutoPauseEnabled;
      autoPauseToggleBtn.classList.toggle('active', isAutoPauseEnabled);
      autoPauseText.textContent = isAutoPauseEnabled ? 'AUTO PAUSE ON' : 'AUTO PAUSE OFF';

      if (!isAutoPauseEnabled && isAutoPausedNow) {
        isAutoPausedNow = false;
        autoPauseStatusPill.style.display = 'none';
        lastLat = null;
        lastLon = null;
        lastGpsTime = null;
        resumeRoutineTimers();
      }
    }

    // ==========================================
    // 12. MANUAL PAUSE / RESUME
    // ==========================================
    function onSingleTapPause() { pauseRunUI(); }
    function onQuickResume() { resumeRunUI(); }

    function showRunningControlsUI() {
      document.getElementById('runningBar').style.display = 'flex';
      document.getElementById('pausedSplitBar').style.display = 'none';
    }

    function showPausedControlsUI() {
      document.getElementById('runningBar').style.display = 'none';
      document.getElementById('pausedSplitBar').style.display = 'flex';
    }

    function pauseRunUI() {
      if (!isRunning) return;
      isRunning = false;
      pauseRoutineTimers();
      showPausedControlsUI();

      lastLat = null;
      lastLon = null;
      lastGpsTime = null;

      if (navigator.vibrate) navigator.vibrate(20);
    }

    function resumeRunUI() {
      isRunning = true;
      isAutoPausedNow = false;
      autoPauseStatusPill.style.display = 'none';
      lastLat = null;
      lastLon = null;
      lastGpsTime = null;
      lastMovingTime = Date.now();

      showRunningControlsUI();
      resumeRoutineTimers();

      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      silentAudioEl.play().catch(() => {});
      if (navigator.vibrate) navigator.vibrate(20);
    }

    // ==========================================
    // 13. TIMER
    // ==========================================
    let startTimeMs = 0;
    let baseOffsetMs = 0;
    let elapsedMs = 0;
    let clockTimer = null;

    function pauseRoutineTimers() {
      baseOffsetMs = elapsedMs;
      if (clockTimer) {
        clearInterval(clockTimer);
        clockTimer = null;
      }
    }

    function resumeRoutineTimers() {
      if (clockTimer) clearInterval(clockTimer);
      startTimeMs = performance.now();
      clockTimer = setInterval(() => {
        elapsedMs = baseOffsetMs + (performance.now() - startTimeMs);
        const cs = String(Math.floor(elapsedMs / 10) % 100).padStart(2, '0');
        const totalSeconds = Math.floor(elapsedMs / 1000);
        const s = String(totalSeconds % 60).padStart(2, '0');
        const m = String(Math.floor(totalSeconds / 60) % 60).padStart(2, '0');
        const h = Math.floor(totalSeconds / 3600);
        runTimerDisplay.textContent = `${h}:${m}:${s}:${cs}`;
      }, 50);
    }

    // ==========================================
    // 14. FINISH HOLD
    // ==========================================
    const finishHoldBtn = document.getElementById('finishHoldBtn');
    const finishHoldProgress = document.getElementById('finishHoldProgress');
    const deleteConfirmModal = document.getElementById('deleteConfirmModal');
    let holdTimer = null;
    let holdStartTime = 0;

    finishHoldBtn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      if (navigator.vibrate) navigator.vibrate(15);
      holdStartTime = performance.now();
      holdTimer = requestAnimationFrame(updateHold);
    });

    const cancelHold = () => {
      if (holdTimer) {
        cancelAnimationFrame(holdTimer);
        holdTimer = null;
      }
      finishHoldProgress.style.strokeDashoffset = 188.49;
    };

    ['pointerup', 'pointerleave', 'pointercancel'].forEach(evt => {
      finishHoldBtn.addEventListener(evt, cancelHold);
    });

    function updateHold(timestamp) {
      const pct = Math.min(((timestamp - holdStartTime) / 1250) * 100, 100);
      finishHoldProgress.style.strokeDashoffset = 188.49 - (pct / 100) * 188.49;
      if (pct < 100) {
        holdTimer = requestAnimationFrame(updateHold);
      } else {
        cancelHold();
        pauseRunUI();
        deleteConfirmModal.style.display = 'flex';
        if (navigator.vibrate) navigator.vibrate([30, 50, 40]);
      }
    }

    // ==========================================
    // 15. SAVE / DISCARD
    // ==========================================
    function onDiscardRun() {
      if (gpsWatchId !== null) {
        navigator.geolocation.clearWatch(gpsWatchId);
        gpsWatchId = null;
      }
      window.location.href = 'main.html';
    }

    function onSaveRun() {
      if (gpsWatchId !== null) {
        navigator.geolocation.clearWatch(gpsWatchId);
        gpsWatchId = null;
      }
      window.location.href = 'report.html';
    }

    // ==========================================
    // 16. SOUND (UI Placeholder)
    // ==========================================
    let audioCtx = null;
    function updateInlineSound() {
      const vol = document.getElementById('inlineVolSlider').value;
      const pitch = document.getElementById('inlinePitchSlider').value;
      document.getElementById('inlineVolText').textContent = `${vol}%`;
      document.getElementById('inlinePitchText').textContent = `${(pitch / 100).toFixed(1)}x`;
    }

    // ==========================================
    // 17. START
    // ==========================================
    window.onload = () => {
      if (!silentAudioEl.src) {
        silentAudioEl.src = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQQAAAAAAP8A/w==';
      }
      startGPS();
      resumeRunUI();
    };
  </script>
</body>
