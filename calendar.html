<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MA.TEMPA - CALENDAR</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f7f7f7">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #f7f7f7;
      color: #111111;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 1.2rem 1.2rem 2.8rem 1.2rem;
      user-select: none;
      -webkit-user-select: none;
      letter-spacing: -0.3px;
    }

    .app-screen {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
    }

    /* 상단 내비게이션 바 */
    .header-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.2rem;
    }

    .nav-circle-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #ffffff;
      border: 1px solid rgba(0, 0, 0, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      color: #111111;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      transition: transform 0.12s ease;
    }
    .nav-circle-btn:active { transform: scale(0.92); }

    .header-title {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    /* 달력 메인 카드 */
    .calendar-card {
      width: 100%;
      background: #ffffff;
      border-radius: 32px;
      padding: 1.4rem 1.2rem 1.2rem 1.2rem;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(0, 0, 0, 0.05);
      display: flex;
      flex-direction: column;
      margin-bottom: 1.2rem;
    }

    /* 월/연도 선택 헤더 */
    .cal-month-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.2rem;
      padding: 0 4px;
    }

    .cal-select-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .cal-select {
      background: #f2f3f5;
      border: none;
      font-size: 1.05rem;
      font-weight: 800;
      color: #111111;
      border-radius: 12px;
      padding: 5px 8px;
      outline: none;
      cursor: pointer;
      font-family: inherit;
    }

    .cal-nav-btn-group {
      display: flex;
      gap: 6px;
    }

    .cal-arrow-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #f2f3f5;
      border: none;
      font-size: 0.85rem;
      font-weight: 800;
      color: #111111;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.12s;
    }
    .cal-arrow-btn:active { background: #e2e4e8; }

    /* 요일 표시 행 */
    .cal-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-size: 0.72rem;
      font-weight: 800;
      color: #8e8e93;
      margin-bottom: 8px;
    }
    .cal-weekdays span:first-child { color: #ff3b30; } /* 일요일 */
    .cal-weekdays span:last-child { color: #007aff; }  /* 토요일 */

    /* 날짜 그리드 */
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      row-gap: 6px;
    }

    .cal-day-cell {
      height: 52px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 5px;
      border-radius: 16px;
      cursor: pointer;
      position: relative;
      transition: background 0.12s ease;
    }
    .cal-day-cell:active { background: #f2f3f5; }

    .cal-day-cell.other-month {
      opacity: 0.22;
      pointer-events: none;
    }

    .cal-day-num {
      font-size: 0.85rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: #111111;
    }

    .cal-day-cell.today .cal-day-num {
      background: #111111;
      color: #ffffff;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
    }

    .cal-day-cell.selected {
      outline: 2px solid #007aff;
      background: rgba(0, 122, 255, 0.06);
    }

    /* 러닝 기록 표시 뱃지 */
    .run-badge-km {
      font-size: 0.6rem;
      font-weight: 800;
      color: #34c759;
      background: rgba(52, 199, 89, 0.14);
      padding: 1px 4px;
      border-radius: 5px;
      margin-top: 3px;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.3px;
      white-space: nowrap;
    }

    /* 하단 선택된 날짜 상세 요약 카드 */
    .day-detail-card {
      width: 100%;
      background: #161618;
      color: #ffffff;
      border-radius: 28px;
      padding: 1.3rem 1.4rem;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
      cursor: pointer;
      transition: transform 0.12s ease;
    }
    .day-detail-card:active { transform: scale(0.98); }

    .detail-card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .detail-date-title {
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: -0.3px;
    }
    .detail-count-tag {
      font-size: 0.7rem;
      font-weight: 800;
      color: #34c759;
      background: rgba(52, 199, 89, 0.18);
      padding: 3px 8px;
      border-radius: 8px;
    }

    .detail-stats-grid {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }
    .detail-hero-dist {
      font-size: 2.2rem;
      font-weight: 900;
      color: #007aff;
      line-height: 0.95;
      font-variant-numeric: tabular-nums;
      letter-spacing: -1.5px;
    }
    .detail-hero-dist span {
      font-size: 0.8rem;
      font-weight: 800;
      color: #8e8e93;
      margin-left: 2px;
    }

    .detail-sub-group {
      display: flex;
      gap: 12px;
      text-align: right;
    }
    .detail-sub-item {
      display: flex;
      flex-direction: column;
    }
    .detail-sub-val {
      font-size: 0.92rem;
      font-weight: 800;
      color: #ffffff;
      font-variant-numeric: tabular-nums;
    }
    .detail-sub-lbl {
      font-size: 0.6rem;
      font-weight: 700;
      color: #8e8e93;
      margin-top: 1px;
    }

    .detail-view-more-hint {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.72rem;
      font-weight: 700;
      color: #8e8e93;
      padding-top: 6px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }
    .detail-view-more-hint span:last-child {
      color: #007aff;
      font-weight: 800;
    }

    /* 기록이 없는 날의 안내 박스 */
    .no-run-placeholder {
      width: 100%;
      background: #ffffff;
      border-radius: 28px;
      padding: 1.6rem;
      text-align: center;
      color: #8e8e93;
      font-size: 0.82rem;
      font-weight: 700;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.02);
      border: 1px solid rgba(0, 0, 0, 0.04);
    }
  </style>
</head>
<body>

  <div class="app-screen">

    <!-- 상단 내비 바 -->
    <div class="header-nav">
      <button class="nav-circle-btn" onclick="window.location.href='index.html'">←</button>
      <h1 class="header-title">RUN CALENDAR</h1>
      <button class="nav-circle-btn" onclick="goToToday()">●</button>
    </div>

    <!-- 달력 카드 -->
    <div class="calendar-card">
      <div class="cal-month-bar">
        <div class="cal-select-group">
          <!-- 2020년부터 선택 가능한 연도 드롭다운 -->
          <select class="cal-select" id="yearSelect" onchange="onSelectChange()"></select>
          <select class="cal-select" id="monthSelect" onchange="onSelectChange()"></select>
        </div>
        <div class="cal-nav-btn-group">
          <button class="cal-arrow-btn" onclick="changeMonth(-1)">◀</button>
          <button class="cal-arrow-btn" onclick="changeMonth(1)">▶</button>
        </div>
      </div>

      <div class="cal-weekdays">
        <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
      </div>

      <div class="cal-grid" id="calendarDaysGrid"></div>
    </div>

    <!-- 하단 선택된 날짜의 요약 카드 컨테이너 -->
    <div id="detailSection"></div>

  </div>

  <script>
    function triggerHaptic(duration = 15) {
      if (navigator.vibrate) navigator.vibrate(duration);
    }

    const yearSelect = document.getElementById('yearSelect');
    const monthSelect = document.getElementById('monthSelect');
    const calendarDaysGrid = document.getElementById('calendarDaysGrid');
    const detailSection = document.getElementById('detailSection');

    // 시스템 날짜 기준 초기화
    const now = new Date();
    let currentYear = now.getFullYear();
    let currentMonth = now.getMonth(); // 0 ~ 11
    let selectedDateString = `${currentYear}.${String(currentMonth + 1).padStart(2, '0')}.${String(now.getDate()).padStart(2, '0')}`;

    let runHistory = [];

    // 로컬 스토리지에서 기록 로드
    function loadHistory() {
      try {
        const saved = localStorage.getItem('matempa_run_history');
        runHistory = saved ? JSON.parse(saved) : [];
      } catch (e) {
        runHistory = [];
      }
    }

    // 2020년부터 연도 셀렉트 박스 채우기 (2020 ~ 현재 연도 + 2년)
    function populateYearSelect() {
      yearSelect.innerHTML = '';
      const startYear = 2020;
      const endYear = Math.max(now.getFullYear() + 2, 2028);

      for (let y = startYear; y <= endYear; y++) {
        const opt = document.createElement('option');
        opt.value = y;
        opt.textContent = `${y}년`;
        if (y === currentYear) opt.selected = true;
        yearSelect.appendChild(opt);
      }

      monthSelect.innerHTML = '';
      for (let m = 0; m < 12; m++) {
        const opt = document.createElement('option');
        opt.value = m;
        opt.textContent = `${m + 1}월`;
        if (m === currentMonth) opt.selected = true;
        monthSelect.appendChild(opt);
      }
    }

    function onSelectChange() {
      triggerHaptic(10);
      currentYear = parseInt(yearSelect.value);
      currentMonth = parseInt(monthSelect.value);
      renderCalendar();
    }

    function changeMonth(delta) {
      triggerHaptic(15);
      currentMonth += delta;
      if (currentMonth < 0) {
        currentMonth = 11;
        currentYear--;
      } else if (currentMonth > 11) {
        currentMonth = 0;
        currentYear++;
      }
      yearSelect.value = currentYear;
      monthSelect.value = currentMonth;
      renderCalendar();
    }

    function goToToday() {
      triggerHaptic(20);
      const t = new Date();
      currentYear = t.getFullYear();
      currentMonth = t.getMonth();
      yearSelect.value = currentYear;
      monthSelect.value = currentMonth;
      selectedDateString = `${currentYear}.${String(currentMonth + 1).padStart(2, '0')}.${String(t.getDate()).padStart(2, '0')}`;
      renderCalendar();
    }

    // 특정 날짜(YYYY.MM.DD)의 기록 추출
    function getRunsForDate(dateStr) {
      return runHistory.filter(r => r.date === dateStr);
    }

    // 달력 렌더링
    function renderCalendar() {
      calendarDaysGrid.innerHTML = '';

      const firstDayIndex = new Date(currentYear, currentMonth, 1).getDay();
      const lastDayDate = new Date(currentYear, currentMonth + 1, 0).getDate();
      const prevMonthLastDay = new Date(currentYear, currentMonth, 0).getDate();

      const todayStr = `${now.getFullYear()}.${String(now.getMonth() + 1).padStart(2, '0')}.${String(now.getDate()).padStart(2, '0')}`;

      // 1. 이전 달 날짜 칸
      for (let i = firstDayIndex - 1; i >= 0; i--) {
        const cell = document.createElement('div');
        cell.className = 'cal-day-cell other-month';
        cell.innerHTML = `<span class="cal-day-num">${prevMonthLastDay - i}</span>`;
        calendarDaysGrid.appendChild(cell);
      }

      // 2. 현재 달 날짜 칸
      for (let day = 1; day <= lastDayDate; day++) {
        const dateStr = `${currentYear}.${String(currentMonth + 1).padStart(2, '0')}.${String(day).padStart(2, '0')}`;
        const dayRuns = getRunsForDate(dateStr);

        const cell = document.createElement('div');
        cell.className = 'cal-day-cell';
        if (dateStr === todayStr) cell.classList.add('today');
        if (dateStr === selectedDateString) cell.classList.add('selected');

        let badgeHtml = '';
        if (dayRuns.length > 0) {
          const totalKm = dayRuns.reduce((acc, cur) => acc + (parseFloat(cur.totalDistanceKm) || 0), 0);
          badgeHtml = `<span class="run-badge-km">${totalKm.toFixed(1)}k</span>`;
        }

        cell.innerHTML = `
          <span class="cal-day-num">${day}</span>
          ${badgeHtml}
        `;

        cell.onclick = () => {
          triggerHaptic(15);
          selectedDateString = dateStr;
          document.querySelectorAll('.cal-day-cell').forEach(c => c.classList.remove('selected'));
          cell.classList.add('selected');
          renderDayDetail(dateStr);
        };

        calendarDaysGrid.appendChild(cell);
      }

      renderDayDetail(selectedDateString);
    }

    // 하단 선택된 날짜 상세 뷰 렌더링
    function renderDayDetail(dateStr) {
      const runs = getRunsForDate(dateStr);
      detailSection.innerHTML = '';

      if (runs.length === 0) {
        detailSection.innerHTML = `
          <div class="no-run-placeholder">
            ${dateStr} 에 기록된 러닝 활동이 없습니다.
          </div>
        `;
        return;
      }

      // 당일 러닝 종합 통계 계산
      const totalKm = runs.reduce((acc, cur) => acc + (parseFloat(cur.totalDistanceKm) || 0), 0);
      const totalMs = runs.reduce((acc, cur) => acc + (parseInt(cur.totalElapsedMs) || 0), 0);

      const totalSec = Math.floor(totalMs / 1000);
      const h = Math.floor(totalSec / 3600);
      const m = Math.floor((totalSec % 3600) / 60);
      const s = totalSec % 60;
      const durationFormatted = h > 0 ? `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}` : `${m}:${String(s).padStart(2, '0')}`;

      const avgPaceSec = totalKm > 0 ? (totalSec / totalKm) : 0;
      const pMin = Math.floor(avgPaceSec / 60);
      const pSec = Math.round(avgPaceSec % 60);
      const paceFormatted = `${pMin}'${String(pSec).padStart(2, '0')}"`;

      const card = document.createElement('div');
      card.className = 'day-detail-card';
      card.onclick = () => {
        triggerHaptic(20);
        // 클릭 시 report.html로 이동
        window.location.href = 'report.html';
      };

      card.innerHTML = `
        <div class="detail-card-top">
          <span class="detail-date-title">${dateStr}</span>
          <span class="detail-count-tag">러닝 ${runs.length}회 완료</span>
        </div>
        <div class="detail-stats-grid">
          <div class="detail-hero-dist">
            ${totalKm.toFixed(2)}<span>KM</span>
          </div>
          <div class="detail-sub-group">
            <div class="detail-sub-item">
              <span class="detail-sub-val">${durationFormatted}</span>
              <span class="detail-sub-lbl">총 시간</span>
            </div>
            <div class="detail-sub-item">
              <span class="detail-sub-val">${paceFormatted}</span>
              <span class="detail-sub-lbl">평균 페이스</span>
            </div>
          </div>
        </div>
        <div class="detail-view-more-hint">
          <span>구간별 상세 랩타입 및 지표 확인</span>
          <span>전체 리포트 보기 →</span>
        </div>
      `;

      detailSection.appendChild(card);
    }

    window.onload = () => {
      loadHistory();
      populateYearSelect();
      renderCalendar();
    };
  </script>
</body>
</html>
